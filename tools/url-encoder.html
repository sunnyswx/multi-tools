    <script>
        // 问题反馈功能
        function submitFeedback(e) {
            e.preventDefault();
            
            const name = document.getElementById('feedbackName').value.trim();
            const email = document.getElementById('feedbackEmail').value.trim();
            const type = document.getElementById('feedbackType').value;
            const message = document.getElementById('feedbackMessage').value.trim();
            const includeBrowser = document.getElementById('feedbackBrowser').checked;
            
            if (!message) {
                alert('请填写问题描述！');
                return;
            }
            
            // 构建反馈数据
            const feedbackData = {
                tool: '""" + tool_name + """',
                timestamp: new Date().toISOString(),
                name: name || '匿名用户',
                email: email || '',
                type: type,
                message: message,
                browser: includeBrowser ? navigator.userAgent : ''
            };
            
            // 保存到localStorage
            try {
                const feedbacks = JSON.parse(localStorage.getItem('feedbacks') || '[]');
                feedbacks.push(feedbackData);
                localStorage.setItem('feedbacks', JSON.stringify(feedbacks));
                
                // 显示成功消息
                document.getElementById('feedbackSuccess').style.display = 'block';
                document.getElementById('feedbackError').style.display = 'none';
                
                // 清空表单
                document.getElementById('feedbackForm').reset();
                
                trackToolUsage('""" + tool_name + """', 'feedback');
                
                // 3秒后隐藏成功消息
                setTimeout(() => {
                    document.getElementById('feedbackSuccess').style.display = 'none';
                }, 3000);
            } catch (error) {
                // 显示错误消息
                document.getElementById('feedbackError').style.display = 'block';
                document.getElementById('feedbackSuccess').style.display = 'none';
                console.error('反馈提交失败:', error);
            }
        }

    <script>
        function encode() {
            const input = document.getElementById('input').value;
            if (!input) {
                alert('请输入文本');
                return;
            }
            try {
                const encoded = encodeURIComponent(input);
                document.getElementById('output').textContent = encoded;
            } catch (e) {
                document.getElementById('output').textContent = '❌ 编码错误: ' + e.message;
            }
        }
        
        function decode() {
            const input = document.getElementById('input').value;
            if (!input) {
                alert('请输入URL编码文本');
                return;
            }
            try {
                const decoded = decodeURIComponent(input);
                document.getElementById('output').textContent = decoded;
            } catch (e) {
                document.getElementById('output').textContent = '❌ 解码错误: ' + e.message;
            }
        }
        
        function swap() {
            const output = document.getElementById('output').textContent;
            if (output && output !== '等待输入...') {
                document.getElementById('input').value = output;
                document.getElementById('output').textContent = '等待输入...';
            }
        }
        
        function clearAll() {
            document.getElementById('input').value = '';
            document.getElementById('output').textContent = '等待输入...';
        }
        
        function copyResult() {
            const result = document.getElementById('output').textContent;
            if (result && result !== '等待输入...') {
                navigator.clipboard.writeText(result).then(() => {
                    const btn = event.target;
                    const original = btn.textContent;
                    btn.textContent = '✓ 已复制';
                    setTimeout(() => btn.textContent = original, 2000);
                });
            }
        }
        
        document.getElementById('input').addEventListener('input', () => {
            encode();
        });
