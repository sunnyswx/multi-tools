<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mortgage Calculator - Multi Tools</title>
    <meta name="description" content="Calculate monthly mortgage payments.">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lang.js"></script>
    <script>
        // 自动检测浏览器语言
        (function() {
            const browserLang = navigator.language.split('-')[0];
            const supportedLangs = ['en', 'zh', 'ja', 'ko', 'es', 'fr', 'de', 'ru', 'ar'];
            
            // 检查浏览器语言是否在支持列表中
            let lang = 'en'; // 默认英文
            if (supportedLangs.includes(browserLang)) {
                lang = browserLang;
            }
            
            // 保存到 localStorage
            localStorage.setItem('multi-tools-lang', lang);
            
            console.log('[AutoLang] Browser language:', browserLang, '=> Using:', lang);
        })();
    </script>
    <script>
        // 初始化语言
        document.addEventListener('DOMContentLoaded', function() {
            initLanguage();
            debugTranslations();
        });
    </script>
    <style>
        .tool-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 30px; }
        .tool-header h1 { color: #333; font-size: 2rem; margin-bottom: 10px; }
        .tool-header p { color: #666; }
        .tool-content { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input[type="number"], input[type="range"] { width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; }
        .range-value { text-align: right; color: #666; margin-top: 5px; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .btn { padding: 12px 30px; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .result { margin-top: 20px; padding: 25px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 10px; color: white; display: none; }
        .result-value { font-size: 2.5rem; font-weight: bold; }
        .result-label { opacity: 0.9; margin-top: 5px; }
        .language-selector { margin-top: 30px; text-align: center; }
        .language-selector select { padding: 10px 20px; font-size: 16px; border: none; border-radius: 25px; background: #667eea; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn" data-i18n="common.back_to_home">← Back to Home</a>
        <div class="tool-container">
            <div class="tool-header">
                <h1>🏠 Mortgage Calculator</h1>
                <p>Calculate monthly mortgage payments</p>
            </div>
            <div class="tool-content">
                <div class="input-group">
                    <label>Loan Amount ($):</label>
                    <input type="number" id="loanAmount" value="300000">
                </div>
                <div class="input-group">
                    <label>Interest Rate (%):</label>
                    <input type="range" id="interestRate" min="1" max="15" step="0.1" value="6" oninput="updateRate()">
                    <div class="range-value" id="rateValue">6%</div>
                </div>
                <div class="input-group">
                    <label>Loan Term (years):</label>
                    <input type="number" id="loanTerm" value="30">
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="calculateMortgage()">Calculate</button>
                </div>
                <div class="result" id="result">
                    <div class="result-value" id="monthlyPayment">$0</div>
                    <div class="result-label">Monthly Payment</div>
                    <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.3);">
                        <div>Total Payment: <span id="totalPayment">$0</span></div>
                        <div>Total Interest: <span id="totalInterest">$0</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getLanguage();
            applyLanguage(lang);
        });
        
        function updateRate() {
            document.getElementById('rateValue').textContent = document.getElementById('interestRate').value + '%';
        }
        
        function calculateMortgage() {
            const principal = parseFloat(document.getElementById('loanAmount').value);
            const rate = parseFloat(document.getElementById('interestRate').value) / 100 / 12;
            const months = parseFloat(document.getElementById('loanTerm').value) * 12;
            
            if (!principal || !months) {
                alert('Please enter valid values!');
                return;
            }
            
            const monthly = principal * (rate * Math.pow(1 + rate, months)) / (Math.pow(1 + rate, months) - 1);
            const total = monthly * months;
            const totalInterest = total - principal;
            
            document.getElementById('monthlyPayment').textContent = '$' + monthly.toFixed(2);
            document.getElementById('totalPayment').textContent = '$' + total.toFixed(2);
            document.getElementById('totalInterest').textContent = '$' + totalInterest.toFixed(2);
            document.getElementById('result').style.display = 'block';
        }
        
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_open', { tool: 'mortgage-calculator' });
        }
    </script>
</body>
</html>
