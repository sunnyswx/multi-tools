    <script>
        // 问题反馈功能
        function submitFeedback(e) {
            e.preventDefault();
            
            const name = document.getElementById('feedbackName').value.trim();
            const email = document.getElementById('feedbackEmail').value.trim();
            const type = document.getElementById('feedbackType').value;
            const message = document.getElementById('feedbackMessage').value.trim();
            const includeBrowser = document.getElementById('feedbackBrowser').checked;
            
            if (!message) {
                alert('请填写问题描述！');
                return;
            }
            
            // 构建反馈数据
            const feedbackData = {
                tool: '""" + tool_name + """',
                timestamp: new Date().toISOString(),
                name: name || '匿名用户',
                email: email || '',
                type: type,
                message: message,
                browser: includeBrowser ? navigator.userAgent : ''
            };
            
            // 保存到localStorage
            try {
                const feedbacks = JSON.parse(localStorage.getItem('feedbacks') || '[]');
                feedbacks.push(feedbackData);
                localStorage.setItem('feedbacks', JSON.stringify(feedbacks));
                
                // 显示成功消息
                document.getElementById('feedbackSuccess').style.display = 'block';
                document.getElementById('feedbackError').style.display = 'none';
                
                // 清空表单
                document.getElementById('feedbackForm').reset();
                
                trackToolUsage('""" + tool_name + """', 'feedback');
                
                // 3秒后隐藏成功消息

                }, 3000);

                document.getElementById('feedbackError').style.display = 'block';
                document.getElementById('feedbackSuccess').style.display = 'none';
                console.error('反馈提交失败:', error);
            }
        }

    <script>
        function calculate() {
            trackToolUsage('mortgage-calculator', 'calculate');
            
            const amount = parseFloat(document.getElementById('loanAmount').value) * 10000;
            const years = parseInt(document.getElementById('loanYears').value);
            const rate = parseFloat(document.getElementById('interestRate').value) / 100;
            const method = document.getElementById('repaymentMethod').value;
            
            const months = years * 12;
            const monthlyRate = rate / 12;
            
            let monthlyPayment, totalInterest, totalPayment;
            
            if (method === 'equal_payment') {
                monthlyPayment = amount * monthlyRate * Math.pow(1 + monthlyRate, months) / (Math.pow(1 + monthlyRate, months) - 1);
                totalPayment = monthlyPayment * months;
                totalInterest = totalPayment - amount;
            } else {
                const principalPerMonth = amount / months;
                monthlyPayment = principalPerMonth + amount * monthlyRate;
                totalInterest = (months + 1) * amount * monthlyRate / 2;
                totalPayment = amount + totalInterest;
            }
            
            document.getElementById('monthlyPayment').textContent = formatNumber(monthlyPayment);
            document.getElementById('totalInterest').textContent = formatNumber(totalInterest);
            document.getElementById('totalPayment').textContent = formatNumber(totalPayment);
            document.getElementById('interestRatio').textContent = ((totalInterest / totalPayment) * 100).toFixed(1) + '%';
            
            document.getElementById('result').style.display = 'block';
        }
        
        function formatNumber(num) {
            return num.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }
        
        calculate();
