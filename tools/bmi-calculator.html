<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator - Multi Tools</title>
    <meta name="description" content="Calculate Body Mass Index online.">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lang.js"></script>
    <script>
        // 自动检测浏览器语言
        (function() {
            const browserLang = navigator.language.split('-')[0];
            const supportedLangs = ['en', 'zh', 'ja', 'ko', 'es', 'fr', 'de', 'ru', 'ar'];
            
            // 检查浏览器语言是否在支持列表中
            let lang = 'en'; // 默认英文
            if (supportedLangs.includes(browserLang)) {
                lang = browserLang;
            }
            
            // 保存到 localStorage
            localStorage.setItem('multi-tools-lang', lang);
            
            console.log('[AutoLang] Browser language:', browserLang, '=> Using:', lang);
        })();
    </script>
    <style>
        .tool-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 30px; }
        .tool-header h1 { color: #333; font-size: 2rem; margin-bottom: 10px; }
        .tool-header p { color: #666; }
        .tool-content { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input[type="number"] { width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; }
        input[type="number"]:focus { outline: none; border-color: #667eea; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .btn { padding: 12px 30px; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .result { margin-top: 20px; padding: 25px; background: #f8f9fa; border-radius: 10px; text-align: center; display: none; }
        .bmi-value { font-size: 3rem; font-weight: bold; margin-bottom: 10px; }
        .bmi-category { font-size: 1.3rem; margin-bottom: 15px; }
        .bmi-scale { display: flex; height: 20px; border-radius: 10px; overflow: hidden; margin-top: 15px; }
        .bmi-scale div { flex: 1; }
        .language-selector { margin-top: 30px; text-align: center; }
        .language-selector select { padding: 10px 20px; font-size: 16px; border: none; border-radius: 25px; background: #667eea; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn">← Back to Home</a>
        <div class="tool-container">
            <div class="tool-header">
                <h1>⚖️ BMI Calculator</h1>
                <p>Calculate Body Mass Index online</p>
            </div>
            <div class="tool-content">
                <div class="input-group">
                    <label>Height (cm):</label>
                    <input type="number" id="height" placeholder="170">
                </div>
                <div class="input-group">
                    <label>Weight (kg):</label>
                    <input type="number" id="weight" placeholder="70">
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="calculateBMI()">Calculate BMI</button>
                </div>
                <div class="result" id="result">
                    <div class="bmi-value" id="bmiValue">0</div>
                    <div class="bmi-category" id="bmiCategory">-</div>
                    <div class="bmi-scale">
                        <div style="background: #3498db;"></div>
                        <div style="background: #2ecc71;"></div>
                        <div style="background: #f39c12;"></div>
                        <div style="background: #e74c3c;"></div>
                    </div>
                    <p style="margin-top: 15px; color: #666; font-size: 0.9rem;">Underweight: &lt;18.5 | Normal: 18.5-24.9 | Overweight: 25-29.9 | Obese: ≥30</p>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getLanguage();
            applyLanguage(lang);
        });
        
        function calculateBMI() {
            const height = parseFloat(document.getElementById('height').value) / 100;
            const weight = parseFloat(document.getElementById('weight').value);
            
            if (!height || !weight) {
                alert('Please enter valid height and weight!');
                return;
            }
            
            const bmi = weight / (height * height);
            let category = '';
            let color = '';
            
            if (bmi < 18.5) {
                category = 'Underweight';
                color = '#3498db';
            } else if (bmi < 25) {
                category = 'Normal';
                color = '#2ecc71';
            } else if (bmi < 30) {
                category = 'Overweight';
                color = '#f39c12';
            } else {
                category = 'Obese';
                color = '#e74c3c';
            }
            
            document.getElementById('bmiValue').textContent = bmi.toFixed(1);
            document.getElementById('bmiValue').style.color = color;
            document.getElementById('bmiCategory').textContent = category;
            document.getElementById('bmiCategory').style.color = color;
            document.getElementById('result').style.display = 'block';
        }
        
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_open', { tool: 'bmi-calculator' });
        }
    </script>
</body>
</html>
