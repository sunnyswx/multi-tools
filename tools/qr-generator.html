    <script>
        // 问题反馈功能
        function submitFeedback(e) {
            e.preventDefault();
            
            const name = document.getElementById('feedbackName').value.trim();
            const email = document.getElementById('feedbackEmail').value.trim();
            const type = document.getElementById('feedbackType').value;
            const message = document.getElementById('feedbackMessage').value.trim();
            const includeBrowser = document.getElementById('feedbackBrowser').checked;
            
            if (!message) {
                alert('请填写问题描述！');
                return;
            }
            
            // 构建反馈数据
            const feedbackData = {
                tool: '""" + tool_name + """',
                timestamp: new Date().toISOString(),
                name: name || '匿名用户',
                email: email || '',
                type: type,
                message: message,
                browser: includeBrowser ? navigator.userAgent : ''
            };
            
            // 保存到localStorage
            try {
                const feedbacks = JSON.parse(localStorage.getItem('feedbacks') || '[]');
                feedbacks.push(feedbackData);
                localStorage.setItem('feedbacks', JSON.stringify(feedbacks));
                
                // 显示成功消息
                document.getElementById('feedbackSuccess').style.display = 'block';
                document.getElementById('feedbackError').style.display = 'none';
                
                // 清空表单
                document.getElementById('feedbackForm').reset();
                
                trackToolUsage('""" + tool_name + """', 'feedback');
                
                // 3秒后隐藏成功消息
                setTimeout(() => {
                    document.getElementById('feedbackSuccess').style.display = 'none';
                }, 3000);
            } catch (error) {
                // 显示错误消息
                document.getElementById('feedbackError').style.display = 'block';
                document.getElementById('feedbackSuccess').style.display = 'none';
                console.error('反馈提交失败:', error);
            }
        }

    <script>
        const inputText = document.getElementById('inputText');
        const generateBtn = document.getElementById('generateBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const qrcodeDiv = document.getElementById('qrcode');
        
        generateBtn.addEventListener('click', () => {
            const text = inputText.value.trim();
            if (!text) {
                alert('请输入内容');
                return;
            }
            
            qrcodeDiv.innerHTML = '<p>生成中...</p>';
            
            setTimeout(() => {
                QRCode.toDataURL(text, { 
                    width: 300,
                    margin: 2,
                    color: {
                        dark: '#667eea',
                        light: '#ffffff'
                    }
                }, (err, url) => {
                    if (err) {
                        qrcodeDiv.innerHTML = '<p style="color: red;">生成失败</p>';
                        return;
                    }
                    
                    qrcodeDiv.innerHTML = `<img src="${url}" alt="QR Code">`;
                    downloadBtn.style.display = 'inline-block';
                    downloadBtn.onclick = () => {
                        const link = document.createElement('a');
                        link.download = 'qrcode.png';
                        link.href = url;
                        link.click();
                    };
                });
            }, 500);
        });
        
        inputText.addEventListener('input', () => {
            if (inputText.value.trim()) {
                generateBtn.click();
            }
        });
