<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>QR Code GeneratorFree Online Tool | Multi Tools</title> <meta name="description" content="Generate QR codes online for free. Support text, URL, WiFi, contact info. Fast and high-quality QR code generation."> <meta name="keywords" content="QR code, generator, qrcode, online, scan, free"> <!-- GA4 --> <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script> <script> window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'G-L7GQFYBWB6'); </script> <!-- Open Graph --> <meta property="og:title" content="QR Code Generator - Free Online Tool"> <meta property="og:description" content="Generate high-quality QR codes online for free. Support text, URL, WiFi, and contact info."> <meta property="og:type" content="website"> <meta property="og:url" content="https://sunnyswx-tools.pages.dev/tools/qr-generator.html"> <meta property="og:image" content="https://sunnyswx-tools.pages.dev/og-image.jpg"> <style> * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; } .container { max-width: 800px; margin: 0 auto; } header { text-align: center; padding: 40px 20px; color: white; } header h1 { font-size: 2.5rem; margin-bottom: 10px; } .back-btn { display: inline-block; margin-bottom: 20px; padding: 10px 20px; background: rgba(255,255,255,0.2); color: white; text-decoration: none; border-radius: 25px; transition: all 0.3s; } .back-btn:hover { background: rgba(255,255,255,0.3); } .tool-content { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); } .input-group { margin-bottom: 20px; } .input-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #333; } .input-group input, .input-group textarea, .input-group select { width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; transition: border-color 0.3s; } .input-group input:focus, .input-group textarea:focus, .input-group select:focus { outline: none; border-color: #667eea; } .input-group textarea { min-height: 100px; resize: vertical; } .btn { display: inline-block; padding: 12px 30px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; transition: all 0.3s; margin: 10px 5px; } .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); } .btn-secondary { background: #f0f0f0; color: #333; } .btn-secondary:hover { background: #e0e0e0; box-shadow: none; } .qr-preview { text-align: center; margin: 30px 0; } .qr-preview img { max-width: 300px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); } .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 20px; } @media (max-width: 768px) { .options { grid-template-columns: 1fr; } .tool-content { padding: 20px; } } </style> </head> <body> <div class="container"> <a href="/" class="back-btn">← Back to Home</a> <header> <h1>📱 QR Code Generator</h1> <p>Generate QR codes online for free</p> </header> <main class="tool-content"> <div class="input-group"> <label>Content Type</label> <select id="contentType" onchange="toggleFields()"> <option value="text">Text</option> <option value="url">URL</option> <option value="wifi">WiFi</option> <option value="email">Email</option> </select> </div> <div id="textFields"> <div class="input-group"> <label>Text Content</label> <textarea id="textContent" placeholder="Enter your text here..."></textarea> </div> </div> <div id="urlFields" style="display: none;"> <div class="input-group"> <label>URL</label> <input type="url" id="urlContent" placeholder="https://example.com"> </div> </div> <div id="wifiFields" style="display: none;"> <div class="input-group"> <label>Network Name (SSID)</label> <input type="text" id="wifiSSID" placeholder="WiFi Network Name"> </div> <div class="input-group"> <label>Password</label> <input type="text" id="wifiPassword" placeholder="WiFi Password"> </div> <div class="input-group"> <label>Encryption</label> <select id="wifiEncryption"> <option value="WPA">WPA/WPA2</option> <option value="WEP">WEP</option> <option value="nopass">None</option> </select> </div> </div> <div id="emailFields" style="display: none;"> <div class="input-group"> <label>Email Address</label> <input type="email" id="emailAddress" placeholder="example@email.com"> </div> </div> <div class="options"> <div class="input-group"> <label>Size (px)</label> <input type="number" id="qrSize" value="300" min="100" max="1000"> </div> <div class="input-group"> <label>Color</label> <input type="color" id="qrColor" value="#000000"> </div> </div> <div style="text-align: center;"> <button class="btn" onclick="generateQR()">🔲 Generate QR Code</button> <button class="btn btn-secondary" onclick="downloadQR()">⬇️ Download</button> <button class="btn btn-secondary" onclick="clearAll()">🗑️ Clear</button> </div> <div class="qr-preview" id="qrPreview" style="display: none;"> <img id="qrImage" src="" alt="QR Code"> </div> </main> </div> <script> function toggleFields() { const type = document.getElementById('contentType').value; document.getElementById('textFields').style.display = type === 'text' ? 'block' : 'none'; document.getElementById('urlFields').style.display = type === 'url' ? 'block' : 'none'; document.getElementById('wifiFields').style.display = type === 'wifi' ? 'block' : 'none'; document.getElementById('emailFields').style.display = type === 'email' ? 'block' : 'none'; } function generateQR() { const type = document.getElementById('contentType').value; let data = ''; switch(type) { case 'text': data = document.getElementById('textContent').value; break; case 'url': data = document.getElementById('urlContent').value; break; case 'wifi': const ssid = document.getElementById('wifiSSID').value; const pass = document.getElementById('wifiPassword').value; const enc = document.getElementById('wifiEncryption').value; data = `WIFI:T:${enc};S:${ssid};P:${pass};;`; break; case 'email': data = `mailto:${document.getElementById('emailAddress').value}`; break; } if (!data) { alert('Please enter some content!'); return; } const size = document.getElementById('qrSize').value; const color = document.getElementById('qrColor').value; const apiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(data)}&color=${color.replace('#', '')}`; document.getElementById('qrImage').src = apiUrl; document.getElementById('qrPreview').style.display = 'block'; } function downloadQR() { const img = document.getElementById('qrImage'); if (!img.src) { alert('Please generate a QR code first!'); return; } const link = document.createElement('a'); link.href = img.src; link.download = 'qrcode.png'; link.click(); } function clearAll() { document.getElementById('contentType').value = 'text'; document.getElementById('textContent').value = ''; document.getElementById('urlContent').value = ''; document.getElementById('wifiSSID').value = ''; document.getElementById('wifiPassword').value = ''; document.getElementById('emailAddress').value = ''; document.getElementById('qrPreview').style.display = 'none'; toggleFields(); } // Track usage if (typeof gtag !== 'undefined') { gtag('event', 'tool_usage', { 'event_category': 'tools', 'event_label': 'qr-generator', 'value': 1 }); } </script> </body> </html>
