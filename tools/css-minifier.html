<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Minifier - Multi Tools</title>
    <meta name="description" content="Minify CSS code.">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lang.js"></script>
    <script>
        // 自动检测浏览器语言
        (function() {
            const browserLang = navigator.language.split('-')[0];
            const supportedLangs = ['en', 'zh', 'ja', 'ko', 'es', 'fr', 'de', 'ru', 'ar'];
            
            // 检查浏览器语言是否在支持列表中
            let lang = 'en'; // 默认英文
            if (supportedLangs.includes(browserLang)) {
                lang = browserLang;
            }
            
            // 保存到 localStorage
            localStorage.setItem('multi-tools-lang', lang);
            
            console.log('[AutoLang] Browser language:', browserLang, '=> Using:', lang);
        })();
    </script>
    <style>
        .tool-container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 30px; }
        .tool-header h1 { color: #333; font-size: 2rem; margin-bottom: 10px; }
        .tool-header p { color: #666; }
        .tool-content { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 200px; padding: 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-family: monospace; font-size: 14px; resize: vertical; box-sizing: border-box; }
        textarea:focus { outline: none; border-color: #667eea; }
        .btn-group { display: flex; gap: 10px; margin: 20px 0; }
        .btn { padding: 12px 30px; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .info { margin-top: 10px; color: #666; }
        .language-selector { margin-top: 30px; text-align: center; }
        .language-selector select { padding: 10px 20px; font-size: 16px; border: none; border-radius: 25px; background: #667eea; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn">← Back to Home</a>
        <div class="tool-container">
            <div class="tool-header">
                <h1>🎨 CSS Minifier</h1>
                <p>Minify CSS code</p>
            </div>
            <div class="tool-content">
                <textarea id="input" placeholder="Paste CSS here...">body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}</textarea>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="minify()">Minify</button>
                    <button class="btn btn-secondary" onclick="format()">Format</button>
                    <button class="btn btn-secondary" onclick="copyCSS()">Copy</button>
                </div>
                <div class="info" id="info"></div>
                <textarea id="output" placeholder="Minified CSS..." readonly></textarea>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getLanguage();
            applyLanguage(lang);
        });
        
        function minify() {
            const css = document.getElementById('input').value;
            let minified = css
                .replace(/\/\*[\s\S]*?\*\//g, '')
                .replace(/\s+/g, ' ')
                .replace(/\s*{\s*/g, '{')
                .replace(/\s*}\s*/g, '}')
                .replace(/\s*:\s*/g, ':')
                .replace(/\s*;\s*/g, ';')
                .replace(/;}/g, '}')
                .trim();
            
            document.getElementById('output').value = minified;
            const reduction = ((1 - minified.length / css.length) * 100).toFixed(1);
            document.getElementById('info').textContent = 'Reduced by ' + reduction + '%';
        }
        
        function format() {
            const css = document.getElementById('input').value;
            let formatted = css
                .replace(/\s*{\s*/g, ' {\n    ')
                .replace(/\s*}\s*/g, '\n}\n')
                .replace(/;\s*/g, ';\n    ');
            document.getElementById('output').value = formatted;
        }
        
        function copyCSS() {
            const output = document.getElementById('output');
            output.select();
            navigator.clipboard.writeText(output.value);
            alert('Copied!');
        }
        
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_open', { tool: 'css-minifier' });
        }
    </script>
</body>
</html>
