<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Text to Speech Converter - Multi Tools</title> <meta name="description" content="Convert text to speech with multiple voices and speeds. Free online TTS tool."> <style> * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; } .container { max-width: 800px; margin: 0 auto; } header { text-align: center; padding: 40px 20px; color: white; } header h1 { font-size: 2.5rem; margin-bottom: 10px; } header p { font-size: 1.1rem; opacity: 0.9; } .tool-card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); } .input-section { margin-bottom: 25px; } .input-section label { display: block; margin-bottom: 10px; font-weight: 600; color: #333; } textarea { width: 100%; padding: 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; resize: vertical; min-height: 150px; transition: border-color 0.3s; } textarea:focus { outline: none; border-color: #667eea; } .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 25px; } .control-group { display: flex; flex-direction: column; } .control-group label { margin-bottom: 8px; font-weight: 600; color: #555; } select, input[type="range"] { padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; } select:focus { outline: none; border-color: #667eea; } .range-value { text-align: center; margin-top: 5px; font-size: 14px; color: #666; } .button-group { display: flex; gap: 15px; flex-wrap: wrap; } button { flex: 1; min-width: 120px; padding: 15px 25px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; } .btn-play { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; } .btn-play:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); } .btn-stop { background: #f44336; color: white; } .btn-stop:hover { background: #d32f2f; } .btn-clear { background: #9e9e9e; color: white; } .btn-clear:hover { background: #757575; } .status { margin-top: 20px; padding: 15px; border-radius: 10px; text-align: center; font-weight: 500; } .status.playing { background: #e3f2fd; color: #1976d2; } .status.error { background: #ffebee; color: #c62828; } .back-link { display: block; text-align: center; margin-top: 30px; color: white; text-decoration: none; opacity: 0.9; } .back-link:hover { opacity: 1; } </style> </head> <body> <div class="container"> <header> <h1>🔊 Text to Speech</h1> <p>Convert text to natural speech with multiple voices</p> </header> <div class="tool-card"> <div class="input-section"> <label for="textInput">Enter your text:</label> <textarea id="textInput" placeholder="Type or paste your text here...">Hello! Welcome to Multi Tools. This is a text to speech converter.</textarea> </div> <div class="controls"> <div class="control-group"> <label for="voiceSelect">Select Voice:</label> <select id="voiceSelect"> <option value="">Loading voices...</option> </select> </div> <div class="control-group"> <label for="rateRange">Speed: <span id="rateValue">1.0</span>x</label> <input type="range" id="rateRange" min="0.5" max="2" step="0.1" value="1"> </div> <div class="control-group"> <label for="pitchRange">Pitch: <span id="pitchValue">1.0</span></label> <input type="range" id="pitchRange" min="0.5" max="2" step="0.1" value="1"> </div> </div> <div class="button-group"> <button class="btn-play" onclick="speakText()">▶ Play</button> <button class="btn-stop" onclick="stopSpeech()">⏹ Stop</button> <button class="btn-clear" onclick="clearText()">🗑 Clear</button> </div> <div id="status" class="status" style="display: none;"></div> </div> <a href="/" class="back-link">← Back to All Tools</a> </div> <script> const synth = window.speechSynthesis; const textInput = document.getElementById('textInput'); const voiceSelect = document.getElementById('voiceSelect'); const rateRange = document.getElementById('rateRange'); const pitchRange = document.getElementById('pitchRange'); const rateValue = document.getElementById('rateValue'); const pitchValue = document.getElementById('pitchValue'); const status = document.getElementById('status'); let voices = []; // Load voices function loadVoices() { voices = synth.getVoices(); voiceSelect.innerHTML = ''; voices.forEach((voice, index) => { const option = document.createElement('option'); option.value = index; option.textContent = `${voice.name} (${voice.lang})`; if (voice.default) { option.textContent += ' - Default'; } voiceSelect.appendChild(option); }); } // Initialize if (synth.onvoiceschanged !== undefined) { synth.onvoiceschanged = loadVoices; } loadVoices(); // Update range values rateRange.addEventListener('input', (e) => { rateValue.textContent = e.target.value; }); pitchRange.addEventListener('input', (e) => { pitchValue.textContent = e.target.value; }); // Speak text function speakText() { if (synth.speaking) { synth.cancel(); } const text = textInput.value.trim(); if (!text) { showStatus('Please enter some text', 'error'); return; } const utterance = new SpeechSynthesisUtterance(text); const selectedVoice = voices[voiceSelect.value]; if (selectedVoice) { utterance.voice = selectedVoice; } utterance.rate = parseFloat(rateRange.value); utterance.pitch = parseFloat(pitchRange.value); utterance.onstart = () => { showStatus('🔊 Playing...', 'playing'); }; utterance.onend = () => { showStatus('', ''); }; utterance.onerror = (e) => { showStatus('Error: ' + e.error, 'error'); }; synth.speak(utterance); } // Stop speech function stopSpeech() { if (synth.speaking) { synth.cancel(); showStatus('', ''); } } // Clear text function clearText() { textInput.value = ''; stopSpeech(); } // Show status function showStatus(message, type) { status.textContent = message; status.className = 'status'; if (type) { status.classList.add(type); } status.style.display = message ? 'block' : 'none'; } // GA4 tracking gtag('event', 'tool_used', { 'tool_name': 'text-to-speech' }); </script> </body> </html>
