<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Speech - Multi Tools</title>
    <meta name="description" content="Convert text to speech online.">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lang.js"></script>
    <script>
        // 自动检测浏览器语言
        (function() {
            const browserLang = navigator.language.split('-')[0];
            const supportedLangs = ['en', 'zh', 'ja', 'ko', 'es', 'fr', 'de', 'ru', 'ar'];
            
            // 检查浏览器语言是否在支持列表中
            let lang = 'en'; // 默认英文
            if (supportedLangs.includes(browserLang)) {
                lang = browserLang;
            }
            
            // 保存到 localStorage
            localStorage.setItem('multi-tools-lang', lang);
            
            console.log('[AutoLang] Browser language:', browserLang, '=> Using:', lang);
        })();
    </script>
    <script>
        // 初始化语言
        document.addEventListener('DOMContentLoaded', function() {
            initLanguage();
            debugTranslations();
        });
    </script>
    <style>
        .tool-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 30px; }
        .tool-header h1 { color: #333; font-size: 2rem; margin-bottom: 10px; }
        .tool-header p { color: #666; }
        .tool-content { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 200px; padding: 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; resize: vertical; }
        textarea:focus { outline: none; border-color: #667eea; }
        .control-group { margin: 20px 0; }
        .control-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        select { width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; }
        input[type="range"] { width: 100%; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { padding: 12px 30px; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-stop { background: #e74c3c; color: white; }
        .language-selector { margin-top: 30px; text-align: center; }
        .language-selector select { padding: 10px 20px; font-size: 16px; border: none; border-radius: 25px; background: #667eea; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn" data-i18n="common.back_to_home">← Back to Home/a>
        <div class="tool-container">
            <div class="tool-header">
                <h1>🔊 Text to Speech</h1>
                <p>Convert text to speech online</p>
            </div>
            <div class="tool-content">
                <textarea id="textInput" placeholder="Enter text to convert...">Hello! This is a text to speech demo.</textarea>
                <div class="control-group">
                    <label>Voice:</label>
                    <select id="voiceSelect"></select>
                </div>
                <div class="control-group">
                    <label>Speed: <span id="rateValue">1</span>x</label>
                    <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1" oninput="document.getElementById('rateValue').textContent = this.value">
                </div>
                <div class="control-group">
                    <label>Pitch: <span id="pitchValue">1</span></label>
                    <input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1" oninput="document.getElementById('pitchValue').textContent = this.value">
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="speak()">Speak</button>
                    <button class="btn btn-stop" onclick="stopSpeaking()">Stop</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getLanguage();
            applyLanguage(lang);
            
            const synth = window.speechSynthesis;
            const voiceSelect = document.getElementById('voiceSelect');
            
            function populateVoices() {
                const voices = synth.getVoices();
                voiceSelect.innerHTML = '';
                
                voices.forEach((voice, i) => {
                    const option = document.createElement('option');
                    option.textContent = voice.name + ' (' + voice.lang + ')';
                    option.value = i;
                    if (voice.default) option.selected = true;
                    voiceSelect.appendChild(option);
                });
            }
            
            populateVoices();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = populateVoices;
            }
        });
        
        function speak() {
            const synth = window.speechSynthesis;
            const text = document.getElementById('textInput').value;
            
            if (!text) {
                alert('Please enter some text!');
                return;
            }
            
            const utterance = new SpeechSynthesisUtterance(text);
            const voices = synth.getVoices();
            utterance.voice = voices[document.getElementById('voiceSelect').value];
            utterance.rate = parseFloat(document.getElementById('rate').value);
            utterance.pitch = parseFloat(document.getElementById('pitch').value);
            
            synth.speak(utterance);
        }
        
        function stopSpeaking() {
            window.speechSynthesis.stop();
        }
        
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_open', { tool: 'text-to-speech' });
        }
    </script>
</body>
</html>
