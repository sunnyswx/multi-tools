<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UUID Generator - Multi Tools</title>
    <meta name="description" content="Generate unique UUIDs instantly.">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lang.js"></script>
    <script>
        // 自动检测浏览器语言
        (function() {
            const browserLang = navigator.language.split('-')[0];
            const supportedLangs = ['en', 'zh', 'ja', 'ko', 'es', 'fr', 'de', 'ru', 'ar'];
            
            // 检查浏览器语言是否在支持列表中
            let lang = 'en'; // 默认英文
            if (supportedLangs.includes(browserLang)) {
                lang = browserLang;
            }
            
            // 保存到 localStorage
            localStorage.setItem('multi-tools-lang', lang);
            
            console.log('[AutoLang] Browser language:', browserLang, '=> Using:', lang);
        })();
    </script>
    <script>
        // 初始化语言
        document.addEventListener('DOMContentLoaded', function() {
            initLanguage();
        });
    </script>
    <style>
        .tool-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 30px; }
        .tool-header h1 { color: #333; font-size: 2rem; margin-bottom: 10px; }
        .tool-header p { color: #666; }
        .tool-content { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .uuid-display { width: 100%; padding: 20px; font-size: 1.3rem; font-family: monospace; background: #f8f9fa; border: 2px solid #e0e0e0; border-radius: 10px; text-align: center; margin-bottom: 20px; word-break: break-all; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .btn { padding: 12px 30px; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .language-selector { margin-top: 30px; text-align: center; }
        .language-selector select { padding: 10px 20px; font-size: 16px; border: none; border-radius: 25px; background: #667eea; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn">← Back to Home</a>
        <div class="tool-container">
            <div class="tool-header">
                <h1>🆔 UUID Generator</h1>
                <p>Generate unique UUIDs instantly</p>
            </div>
            <div class="tool-content">
                <div class="uuid-display" id="uuidDisplay">Click Generate</div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="generateUUID()">Generate</button>
                    <button class="btn btn-secondary" onclick="generateBatch()">Generate 5</button>
                    <button class="btn btn-secondary" onclick="copyUUID()">Copy</button>
                </div>
                <div id="batchResult" style="margin-top: 20px; display: none;"></div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getLanguage();
            applyLanguage(lang);
            generateUUID();
        });
        
        function generateUUID() {
            const uuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
            document.getElementById('uuidDisplay').textContent = uuid;
        }
        
        function generateBatch() {
            let batch = '';
            for (let i = 0; i < 5; i++) {
                batch += 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                    const r = Math.random() * 16 | 0;
                    const v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                }) + '<br>';
            }
            document.getElementById('batchResult').innerHTML = '<h3>5 UUIDs:</h3><pre style="background:#f8f9fa;padding:15px;border-radius:10px;">' + batch + '</pre>';
            document.getElementById('batchResult').style.display = 'block';
        }
        
        function copyUUID() {
            const uuid = document.getElementById('uuidDisplay').textContent;
            if (uuid === 'Click Generate') {
                alert('Please generate a UUID first!');
                return;
            }
            navigator.clipboard.writeText(uuid);
            alert('Copied!');
        }
        
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_open', { tool: 'uuid-generator' });
        }
    </script>
</body>
</html>
