</style> </head> <body> <div class="container"> <a href="/" class="back-btn">← Back to Home</a> <header> <h1>🎲 UUID Generator</h1> <p>Generate unique identifiers instantly</p> </header> <main class="tool-content"> <div class="controls"> <div class="control-group"> <label>Format</label> <select id="format"> <option value="standard">Standard (with dashes)</option> <option value="nos dash">No Dash</option> <option value="uppercase">Uppercase</option> </select> </div> <div class="control-group"> <label>Quantity</label> <input type="number" id="quantity" min="1" max="100" value="5"> </div> <button class="btn btn-primary" onclick="generateUUIDs()">🎲 Generate</button> <button class="btn btn-secondary" onclick="copyAll()">📋 Copy All</button> <button class="btn btn-secondary" onclick="clearAll()">🗑️ Clear</button> </div> <div class="uuid-list" id="uuidList"></div> </main> </div> <script> function generateUUID(format = 'standard') { // Generate UUID v4 let uuid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) { var r = crypto.getRandomValues(new Uint8Array(1))[0] % 16; var v = c === 'x' ? r : (r & 0x3 | 0x8); return v.toString(16); }); // Apply format if (format === 'nos dash') { uuid = uuid.replace(/-/g, ''); } else if (format === 'uppercase') { uuid = uuid.toUpperCase(); } return uuid; } function generateUUIDs() { const format = document.getElementById('format').value; const quantity = parseInt(document.getElementById('quantity').value) || 5; const list = document.getElementById('uuidList'); list.innerHTML = ''; for (let i = 0; i < quantity; i++) { const uuid = generateUUID(format); const time = new Date().toLocaleTimeString(); const item = document.createElement('div'); item.className = 'uuid-item'; item.innerHTML = ` <div> <div class="uuid-text">${uuid}</div> <div class="uuid-time">${time}</div> </div> <button class="btn btn-secondary" onclick="copyUUID(this, '${uuid}')">📋</button> `; list.appendChild(item); } } function copyUUID(btn, uuid) { navigator.clipboard.writeText(uuid).then(() => { btn.textContent = '✅'; setTimeout(() => btn.textContent = '📋', 1000); }); } function copyAll() { const uuids = Array.from(document.querySelectorAll('.uuid-text')).map(el => el.textContent).join('\n'); if (!uuids) { alert('Please generate UUIDs first!'); return; } navigator.clipboard.writeText(uuids).then(() => { alert('All UUIDs copied to clipboard!'); }); } function clearAll() { document.getElementById('uuidList').innerHTML = ''; } // Generate on load generateUUIDs(); // Track usage if (typeof gtag !== 'undefined') { gtag('event', 'tool_usage', { 'event_category': 'tools', 'event_label': 'uuid-generator', 'value': 1 }); } </script> </body> </html>
