    <script>
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = crypto.getRandomValues(new Uint8Array(1))[0] % 16;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        
        function generateUUIDs() {
            const count = parseInt(document.getElementById('count').value) || 10;
            const list = document.getElementById('uuidList');
            list.innerHTML = '';
            
            const uuids = [];
            for (let i = 0; i < count; i++) {
                const uuid = generateUUID();
                uuids.push(uuid);
                
                const item = document.createElement('div');
                item.className = 'uuid-item';
                item.innerHTML = `
                    <span>${i + 1}. ${uuid}</span>
                    <button class="copy-btn" onclick="copyUUID(this, '${uuid}')">复制</button>
                `;
                list.appendChild(item);
            }
            
            window.currentUUIDs = uuids;
        }
        
        function copyUUID(btn, uuid) {
            navigator.clipboard.writeText(uuid).then(() => {
                const original = btn.textContent;
                btn.textContent = '✓ 已复制';
                setTimeout(() => btn.textContent = original, 2000);
            });
        }
        
        function copyAll() {
            if (window.currentUUIDs && window.currentUUIDs.length > 0) {
                const text = window.currentUUIDs.join('\n');
                navigator.clipboard.writeText(text).then(() => {
                    const btn = event.target;
                    const original = btn.textContent;
                    btn.textContent = '✓ 已复制';
                    setTimeout(() => btn.textContent = original, 2000);
                });
            }
        }
        
        function clearAll() {
            document.getElementById('uuidList').innerHTML = '';
            window.currentUUIDs = [];
        }
        
        // 页面加载时自动生成
        generateUUIDs();
