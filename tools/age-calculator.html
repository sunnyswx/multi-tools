<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator - Multi Tools</title>
    <meta name="description" content="Calculate your exact age from birthdate.">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lang.js"></script>
    <style>
        .tool-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 30px; }
        .tool-header h1 { color: #333; font-size: 2rem; margin-bottom: 10px; }
        .tool-header p { color: #666; }
        .tool-content { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input[type="date"] { width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; }
        input[type="date"]:focus { outline: none; border-color: #667eea; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .btn { padding: 12px 30px; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
        .result-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 25px; border-radius: 10px; text-align: center; }
        .result-card .number { font-size: 2.5rem; font-weight: bold; }
        .result-card .label { font-size: 0.9rem; opacity: 0.9; margin-top: 5px; }
        .language-selector { margin-top: 30px; text-align: center; }
        .language-selector select { padding: 10px 20px; font-size: 16px; border: none; border-radius: 25px; background: #667eea; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn">← Back to Home</a>
        <div class="tool-container">
            <div class="tool-header">
                <h1>🎂 Age Calculator</h1>
                <p>Calculate your exact age from birthdate</p>
            </div>
            <div class="tool-content">
                <div class="input-group">
                    <label>Date of Birth:</label>
                    <input type="date" id="birthDate" max="">
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="calculateAge()">Calculate Age</button>
                </div>
                <div class="result-grid" id="resultGrid" style="display: none;">
                    <div class="result-card">
                        <div class="number" id="years">0</div>
                        <div class="label">Years</div>
                    </div>
                    <div class="result-card">
                        <div class="number" id="months">0</div>
                        <div class="label">Months</div>
                    </div>
                    <div class="result-card">
                        <div class="number" id="days">0</div>
                        <div class="label">Days</div>
                    </div>
                    <div class="result-card">
                        <div class="number" id="weeks">0</div>
                        <div class="label">Weeks</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getLanguage();
            applyLanguage(lang);
            document.getElementById('birthDate').max = new Date().toISOString().split('T')[0];
        });
        
        function calculateAge() {
            const birthDate = new Date(document.getElementById('birthDate').value);
            const today = new Date();
            
            if (isNaN(birthDate.getTime())) {
                alert('Please select a valid date!');
                return;
            }
            
            let years = today.getFullYear() - birthDate.getFullYear();
            let months = today.getMonth() - birthDate.getMonth();
            let days = today.getDate() - birthDate.getDate();
            
            if (days < 0) {
                months--;
                days += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
            }
            if (months < 0) {
                years--;
                months += 12;
            }
            
            const totalDays = Math.floor((today - birthDate) / (1000 * 60 * 60 * 24));
            const totalWeeks = Math.floor(totalDays / 7);
            
            document.getElementById('years').textContent = years;
            document.getElementById('months').textContent = months;
            document.getElementById('days').textContent = days;
            document.getElementById('weeks').textContent = totalWeeks;
            document.getElementById('resultGrid').style.display = 'grid';
        }
        
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_open', { tool: 'age-calculator' });
        }
    </script>
</body>
</html>
