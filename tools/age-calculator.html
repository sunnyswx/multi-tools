<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年龄计算器 - 免费在线工具 | Multi Tools</title>
    <meta name="description" content="年龄计算器，精确计算年龄">
    
    <!-- GA4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            padding: 40px 20px;
            color: white;
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        .tool-content {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px 5px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            display: none;
        }
        .result.show {
            display: block;
        }
        .result-item {
            margin: 10px 0;
            font-size: 1.1rem;
        }
        .result-value {
            font-size: 1.5rem;
            color: #667eea;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-btn">← 返回首页</a>
        
        <header>
            <h1>🎂 年龄计算器</h1>
            <p>精确计算年龄，显示详细时间信息</p>
        </header>
        
        <main class="tool-content">
            <div class="input-group">
                <label for="birthDate">出生日期</label>
                <input type="date" id="birthDate" max="">
            </div>
            
            <button class="btn" onclick="calculateAge()">计算年龄</button>
            <button class="btn btn-secondary" onclick="clearForm()">清空</button>
            
            <div id="result" class="result">
                <div class="result-item">
                    您今年 <span class="result-value" id="ageYears">--</span> 岁
                </div>
                <div class="result-item">
                    精确年龄：<span class="result-value" id="ageDetail">--</span>
                </div>
                <div class="result-item">
                    已度过 <span class="result-value" id="totalDays">--</span> 天
                </div>
                <div class="result-item">
                    约 <span class="result-value" id="totalHours">--</span> 小时
                </div>
                <div class="result-item">
                    下一个生日还有 <span class="result-value" id="daysToBirthday">--</span> 天
                </div>
            </div>
        </main>
    </div>
    
    <script>
        // 设置最大日期为今天
        document.getElementById('birthDate').max = new Date().toISOString().split('T')[0];
        
        function calculateAge() {
            const birthDateStr = document.getElementById('birthDate').value;
            
            if (!birthDateStr) {
                alert('请选择出生日期');
                return;
            }
            
            const birthDate = new Date(birthDateStr);
            const today = new Date();
            
            if (birthDate > today) {
                alert('出生日期不能晚于今天');
                return;
            }
            
            // 计算年龄
            let years = today.getFullYear() - birthDate.getFullYear();
            let months = today.getMonth() - birthDate.getMonth();
            let days = today.getDate() - birthDate.getDate();
            
            if (days < 0) {
                months--;
                const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                days += prevMonth.getDate();
            }
            
            if (months < 0) {
                years--;
                months += 12;
            }
            
            // 计算总天数
            const diffTime = Math.abs(today - birthDate);
            const totalDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            const totalHours = totalDays * 24;
            
            // 计算下一个生日
            let nextBirthday = new Date(today.getFullYear(), birthDate.getMonth(), birthDate.getDate());
            if (nextBirthday < today) {
                nextBirthday = new Date(today.getFullYear() + 1, birthDate.getMonth(), birthDate.getDate());
            }
            const daysToBirthday = Math.ceil((nextBirthday - today) / (1000 * 60 * 60 * 24));
            
            // 显示结果
            document.getElementById('ageYears').textContent = years;
            document.getElementById('ageDetail').textContent = `${years}岁${months}个月${days}天`;
            document.getElementById('totalDays').textContent = totalDays.toLocaleString();
            document.getElementById('totalHours').textContent = totalHours.toLocaleString();
            document.getElementById('daysToBirthday').textContent = daysToBirthday;
            
            document.getElementById('result').classList.add('show');
            trackToolUsage('age-calculator');
        }
        
        function clearForm() {
            document.getElementById('birthDate').value = '';
            document.getElementById('result').classList.remove('show');
        }
        
        function trackToolUsage(toolName) {
            if (typeof gtag !== 'undefined') {
                gtag('event', 'tool_usage', {
                    'event_category': 'tools',
                    'event_label': toolName,
                    'value': 1
                });
            }
        }
        
        trackToolUsage('age-calculator');
    </script>
</body>
</html>
