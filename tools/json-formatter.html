<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Formatter - Free Online Tool | Multi Tools</title>
    <meta name="description" content="Free online JSON formatter and validator. Format, validate, and beautify JSON data instantly.">
    <meta name="keywords" content="json, formatter, validator, beautify, minify, online tool">
    
    <!-- GA4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; padding: 40px 20px; color: white; }
        header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .back-btn { display: inline-block; margin-bottom: 20px; padding: 10px 20px; background: rgba(255,255,255,0.2); color: white; text-decoration: none; border-radius: 25px; }
        .tool-content { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .editor-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .editor-box { display: flex; flex-direction: column; }
        .editor-box label { font-weight: bold; margin-bottom: 8px; color: #333; }
        .editor-box textarea { width: 100%; min-height: 400px; padding: 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-family: 'Courier New', monospace; font-size: 14px; resize: vertical; }
        .editor-box textarea:focus { outline: none; border-color: #667eea; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn { padding: 12px 30px; border: none; border-radius: 25px; cursor: pointer; font-size: 16px; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover { background: #e0e0e0; }
        .message { padding: 15px; border-radius: 10px; margin-bottom: 20px; display: none; }
        .message.success { background: #d4edda; color: #155724; display: block; }
        .message.error { background: #f8d7da; color: #721c24; display: block; }
        @media (max-width: 768px) { .editor-container { grid-template-columns: 1fr; } .tool-content { padding: 20px; } }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-btn">← Back to Home</a>
        <header>
            <h1>📋 JSON Formatter</h1>
            <p>Format, validate and beautify JSON data</p>
        </header>
        <main class="tool-content">
            <div id="message" class="message"></div>
            
            <div class="editor-container">
                <div class="editor-box">
                    <label>Input JSON</label>
                    <textarea id="inputJson" placeholder='{"example": "Paste your JSON here"}'></textarea>
                </div>
                <div class="editor-box">
                    <label>Formatted Output</label>
                    <textarea id="outputJson" readonly placeholder="Formatted JSON will appear here..."></textarea>
                </div>
            </div>
            
            <div class="btn-group">
                <button class="btn btn-primary" onclick="formatJSON()">✨ Format</button>
                <button class="btn btn-primary" onclick="minifyJSON()">📦 Minify</button>
                <button class="btn btn-secondary" onclick="validateJSON()">✅ Validate</button>
                <button class="btn btn-secondary" onclick="copyOutput()">📋 Copy</button>
                <button class="btn btn-secondary" onclick="clearAll()">🗑️ Clear</button>
            </div>
        </main>
    </div>
    
    <script>
        function formatJSON() {
            const input = document.getElementById('inputJson').value.trim();
            if (!input) {
                showMessage('Please enter JSON data', 'error');
                return;
            }
            try {
                const parsed = JSON.parse(input);
                const formatted = JSON.stringify(parsed, null, 2);
                document.getElementById('outputJson').value = formatted;
                showMessage('JSON formatted successfully!', 'success');
            } catch (e) {
                showMessage('Invalid JSON: ' + e.message, 'error');
            }
        }
        
        function minifyJSON() {
            const input = document.getElementById('inputJson').value.trim();
            if (!input) {
                showMessage('Please enter JSON data', 'error');
                return;
            }
            try {
                const parsed = JSON.parse(input);
                const minified = JSON.stringify(parsed);
                document.getElementById('outputJson').value = minified;
                showMessage('JSON minified successfully!', 'success');
            } catch (e) {
                showMessage('Invalid JSON: ' + e.message, 'error');
            }
        }
        
        function validateJSON() {
            const input = document.getElementById('inputJson').value.trim();
            if (!input) {
                showMessage('Please enter JSON data', 'error');
                return;
            }
            try {
                JSON.parse(input);
                showMessage('Valid JSON!', 'success');
            } catch (e) {
                showMessage('Invalid JSON: ' + e.message, 'error');
            }
        }
        
        function copyOutput() {
            const output = document.getElementById('outputJson').value;
            if (!output) {
                showMessage('No output to copy', 'error');
                return;
            }
            navigator.clipboard.writeText(output).then(() => {
                showMessage('Copied to clipboard!', 'success');
            });
        }
        
        function clearAll() {
            document.getElementById('inputJson').value = '';
            document.getElementById('outputJson').value = '';
            hideMessage();
        }
        
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            setTimeout(hideMessage, 3000);
        }
        
        function hideMessage() {
            document.getElementById('message').className = 'message';
        }
        
        // Track usage
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_usage', { 'event_category': 'tools', 'event_label': 'json-formatter', 'value': 1 });
        }
    </script>
</body>
</html>
