            // 保存到localStorage

    <script>
        const input = document.getElementById('input');
        const output = document.getElementById('output');
        const info = document.getElementById('info');
        
        let currentJSON = null;
        
        function formatJSON() {
            trackToolUsage('json-formatter', 'format');
            try {
                const json = JSON.parse(input.value);
                currentJSON = json;
                output.textContent = JSON.stringify(json, null, 2);
                updateInfo(json);
                output.style.color = '#333';
            } catch (e) {
                output.textContent = '❌ JSON格式错误: ' + e.message;
                output.style.color = '#f44336';
                info.style.display = 'none';
            }
        }
        
        function minifyJSON() {
            trackToolUsage('json-formatter', 'minify');
            try {
                const json = JSON.parse(input.value);
                currentJSON = json;
                output.textContent = JSON.stringify(json);
                updateInfo(json);
                output.style.color = '#333';
            } catch (e) {
                output.textContent = '❌ JSON格式错误: ' + e.message;
                output.style.color = '#f44336';
                info.style.display = 'none';
            }
        }
        
        function validateJSON() {
            trackToolUsage('json-formatter', 'validate');
            try {
                JSON.parse(input.value);
                output.textContent = '✅ JSON格式正确';
                output.style.color = '#4caf50';
                info.style.display = 'none';
            } catch (e) {
                output.textContent = '❌ JSON格式错误: ' + e.message;
                output.style.color = '#f44336';
                info.style.display = 'none';
            }
        }
        
        function copyJSON() {
            const text = output.textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                const original = btn.textContent;
                btn.textContent = '✓ 已复制';
                setTimeout(() => btn.textContent = original, 2000);
            });
        }
        
        function clearAll() {
            input.value = '';
            output.textContent = '';
            currentJSON = null;
            info.style.display = 'none';
        }
        
        function loadExample() {
            input.value = JSON.stringify({
                "name": "Multi Tools",
                "version": "1.0.0",
                "description": "多功能在线工具集",
                "features": ["图片压缩", "PDF转换", "二维码生成"],
                "contact": {
                    "email": "contact@multitools.com",
                    "website": "https://multitools.example.com"
                },
                "stats": {
                    "users": 10000,
                    "tools": 18,
                    "rating": 4.8
                }
            }, null, 2);
            formatJSON();
        }
        
        function updateInfo(json) {
            const jsonStr = JSON.stringify(json);
            document.getElementById('charCount').textContent = jsonStr.length;
            document.getElementById('lineCount').textContent = jsonStr.split('\n').length;
            document.getElementById('keyCount').textContent = countKeys(json);
            info.style.display = 'flex';
        }
        
        function countKeys(obj) {
            let count = 0;
            if (typeof obj !== 'object' || obj === null) return 0;
            
            for (let key in obj) {
                if (obj.hasOwnProperty(key)) {
                    count++;
                    if (typeof obj[key] === 'object' && obj[key] !== null) {
                        count += countKeys(obj[key]);
                    }
                }
            }
            return count;
        }
        
        input.addEventListener('input', () => {
            if (input.value.trim()) {
                try {
                    currentJSON = JSON.parse(input.value);
                    output.textContent = JSON.stringify(currentJSON, null, 2);
                    updateInfo(currentJSON);
                    output.style.color = '#333';
                } catch (e) {
                    output.textContent = '⚠️ 等待有效JSON...';
                    output.style.color = '#ff9800';
                }
            } else {
                output.textContent = '';
                info.style.display = 'none';
            }
        });
