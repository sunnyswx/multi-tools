<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>CSS Box Model Multi Tools</title> <meta name="description" content=""> <!-- GA4 --> <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script> <script> window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'G-L7GQFYBWB6'); </script>
    <script src="tool-translations.js"></script>
    <script src="lang-helper.js"></script> <style> * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; } .container { max-width: 1200px; margin: 0 auto; } header { text-align: center; padding: 40px 20px; color: white; } header h1 { font-size: 2.5rem; margin-bottom: 10px; } .back-btn { display: inline-block; margin-bottom: 20px; padding: 10px 20px; background: rgba(255,255,255,0.2); color: white; text-decoration: none; border-radius: 25px; transition: all 0.3s; } .back-btn:hover { background: rgba(255,255,255,0.3); } .tool-content { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); } .controls { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 30px; } .control-group { display: flex; flex-direction: column; } .control-group label { font-weight: bold; margin-bottom: 8px; color: #333; } .control-group input { padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; } .control-group input:focus { outline: none; border-color: #667eea; } .preview { background: #f8f9fa; padding: 40px; border-radius: 10px; margin-bottom: 30px; display: flex; justify-content: center; align-items: center; } .box-model { position: relative; } .margin { background: #ff6b6b; padding: 20px; text-align: center; color: white; font-weight: bold; } .border { background: #4ecdc4; padding: 10px; text-align: center; color: white; font-weight: bold; } .padding { background: #45b7d1; padding: 30px; text-align: center; color: white; font-weight: bold; } .content { background: #96ceb4; padding: 20px; text-align: center; font-weight: bold; } .code-output { background: #2d2d2d; color: #f8f8f2; padding: 20px; border-radius: 10px; font-family: 'Courier New', monospace; font-size: 14px; overflow-x: auto; white-space: pre-wrap; } .btn { display: inline-block; padding: 12px 30px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; transition: all 0.3s; margin: 10px 5px; } .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); } @media (max-width: 768px) { .controls { grid-template-columns: 1fr; } } </style> </head> <body> <div class="container"> <a href="/" class="back-btn">← </a> <header> <h1>📦 CSS</h1> <p>，CSS</p> </header> <main class="tool-content"> <div class="controls"> <div class="control-group"> <label>Margin（）</label> <input type="text" id="margin" value="20px" placeholder="：20px 10px 20px"> </div> <div class="control-group"> <label>Border（）</label> <input type="text" id="border" value="2px solid #333" placeholder="：2px solid #333"> </div> <div class="control-group"> <label>Padding（）</label> <input type="text" id="padding" value="30px" placeholder="：30px 10px 20px"> </div> <div class="control-group"> <label>Content Width（）</label> <input type="text" id="width" value="200px" placeholder="：200px"> </div> </div> <div class="preview"> <div class="box-model"> <div class="margin" id="margin-box"> Margin: <span id="margin-value">20px</span> </div> <div class="border" id="border-box"> Border: <span id="border-value">2px solid</span> </div> <div class="padding" id="padding-box"> Padding: <span id="padding-value">30px</span> </div> <div class="content" id="content-box" style="width: 200px;"> Content </div> </div> </div> <h3 style="margin-bottom: 15px;">CSS：</h3> <div class="code-output" id="code-output"> .box { margin: 20px; border: 2px solid #333; padding: 30px; width: 200px; } </div> <div style="margin-top: 20px;"> <button class="btn" onclick="copyCode()">📋 </button> <button class="btn btn-secondary" onclick="resetValues()">🔄 </button> </div> </main> </div> <script> function updateBoxModel() { const margin = document.getElementById('margin').value || '20px'; const border = document.getElementById('border').value || '2px solid #333'; const padding = document.getElementById('padding').value || '30px'; const width = document.getElementById('width').value || '200px'; document.getElementById('margin-value').textContent = margin; document.getElementById('border-value').textContent = border; document.getElementById('padding-value').textContent = padding; const marginBox = document.getElementById('margin-box'); const borderBox = document.getElementById('border-box'); const paddingBox = document.getElementById('padding-box'); const contentBox = document.getElementById('content-box'); marginBox.style.padding = margin; borderBox.style.border = border; paddingBox.style.padding = padding; contentBox.style.width = width; const code = `.box { margin: ${margin}; border: ${border}; padding: ${padding}; width: ${width}; }`; document.getElementById('code-output').textContent = code; } function copyCode() { const code = document.getElementById('code-output').textContent; navigator.clipboard.writeText(code).then(() => { alert('！'); }); } function resetValues() { document.getElementById('margin').value = '20px'; document.getElementById('border').value = '2px solid #333'; document.getElementById('padding').value = '30px'; document.getElementById('width').value = '200px'; updateBoxModel(); } // document.getElementById('margin').addEventListener('input', updateBoxModel); document.getElementById('border').addEventListener('input', updateBoxModel); document.getElementById('padding').addEventListener('input', updateBoxModel); document.getElementById('width').addEventListener('input', updateBoxModel); // updateBoxModel(); // if (typeof gtag !== 'undefined') { gtag('event', 'tool_usage', { 'event_category': 'tools', 'event_label': 'box-model-generator', 'value': 1 }); } </script> </body> </html>
