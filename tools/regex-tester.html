<body>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7B5H09J4KB"></script>
    <script>

    <div class="container">
        <a href="/" class="back-btn">← 返回首页</a>
        <header>
            <h1>🔍 正则表达式测试器</h1>
            <p>在线测试正则表达式，实时显示匹配结果</p>
        </header>
        
        <div class="tool-card">
            <div class="regex-input">
                <input type="text" id="regex" placeholder="输入正则表达式..." value="^\w+@[\w\.-]+\.[a-z]{2,}$">
                <div class="flags">
                    <span class="flag active" data-flag="g" onclick="toggleFlag(this)">g</span>
                    <span class="flag" data-flag="i" onclick="toggleFlag(this)">i</span>
                    <span class="flag" data-flag="m" onclick="toggleFlag(this)">m</span>
                </div>
            </div>
            
            <textarea id="testString" placeholder="输入测试文本...">Contact us at support@example.com or sales@company.org</textarea>
            
            <div class="results" id="results">
                <div class="no-match">等待匹配...</div>
            </div>
        </div>
        
        <footer>
            <p>© 2026 Multi Tools | 免费在线工具集</p>
        </footer>
    </div>
    
    <script>
        const regexInput = document.getElementById('regex');
        const testString = document.getElementById('testString');
        const results = document.getElementById('results');
        
        function testRegex() {
            try {
                const flags = Array.from(document.querySelectorAll('.flag.active')).map(f => f.dataset.flag).join('');
                const pattern = new RegExp(regexInput.value, flags);
                
                if (!regexInput.value) {
                    results.innerHTML = '<div class="no-match">输入正则表达式</div>';
                    return;
                }
                
                const matches = testString.value.match(pattern);
                
                if (!matches) {
                    results.innerHTML = '<div class="no-match">无匹配</div>';
                    return;
                }
                
                let html = `<div style="margin-bottom: 10px; color: #667eea; font-weight: bold;">找到 ${matches.length} 个匹配：</div>`;
                matches.forEach((match, index) => {
                    html += `<div class="match">${index + 1}. ${match}</div>`;
                });
                
                results.innerHTML = html;
            } catch (e) {
                results.innerHTML = `<div style="color: #f44336;">❌ 正则表达式错误: ${e.message}</div>`;
            }
        }
        
        function toggleFlag(element) {
            element.classList.toggle('active');
            testRegex();
        }
        
        regexInput.addEventListener('input', testRegex);
        testString.addEventListener('input', testRegex);
        
        // 初始化
        testRegex();
    </script>
