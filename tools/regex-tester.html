<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regex Tester - Multi Tools</title>
    <meta name="description" content="Test regular expressions online.">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lang.js"></script>
    <style>
        .tool-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 30px; }
        .tool-header h1 { color: #333; font-size: 2rem; margin-bottom: 10px; }
        .tool-header p { color: #666; }
        .tool-content { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .regex-input { margin-bottom: 20px; }
        .regex-input label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        .regex-input input { width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; font-family: monospace; }
        .test-input { margin-bottom: 20px; }
        .test-input textarea { width: 100%; height: 150px; padding: 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; resize: vertical; }
        .test-input textarea:focus { outline: none; border-color: #667eea; }
        .results { background: #f8f9fa; border-radius: 10px; padding: 20px; }
        .match { color: #27ae60; font-weight: bold; }
        .flag-group { margin-bottom: 20px; }
        .flag-group label { margin-right: 15px; cursor: pointer; }
        .language-selector { margin-top: 30px; text-align: center; }
        .language-selector select { padding: 10px 20px; font-size: 16px; border: none; border-radius: 25px; background: #667eea; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn">← Back to Home</a>
        <div class="tool-container">
            <div class="tool-header">
                <h1>🔍 Regex Tester</h1>
                <p>Test regular expressions online</p>
            </div>
            <div class="tool-content">
                <div class="regex-input">
                    <label>Regular Expression:</label>
                    <input type="text" id="regex" placeholder="Enter regex pattern..." oninput="testRegex()">
                </div>
                <div class="flag-group">
                    <label><input type="checkbox" id="global" onchange="testRegex()"> Global</label>
                    <label><input type="checkbox" id="ignoreCase" onchange="testRegex()"> Ignore Case</label>
                    <label><input type="checkbox" id="multiline" onchange="testRegex()"> Multiline</label>
                </div>
                <div class="test-input">
                    <label>Test String:</label>
                    <textarea id="testString" placeholder="Enter test string..." oninput="testRegex()">Hello World! This is a test string. Contact: test@example.com</textarea>
                </div>
                <div class="results" id="results">
                    <p>Enter a regex pattern to test</p>
                </div>
            </div>
            <div class="language-selector">
                <select id="langSelect" onchange="changeLanguage(this.value)">
                    <option value="en">English</option>
                    <option value="zh">中文</option>
                    <option value="ja">日本語</option>
                    <option value="ko">한국어</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                    <option value="ru">Русский</option>
                    <option value="ar">العربية</option>
                </select>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getLanguage();
            applyLanguage(lang);
            testRegex();
        });
        
        function testRegex() {
            const pattern = document.getElementById('regex').value;
            const testString = document.getElementById('testString').value;
            const global = document.getElementById('global').checked;
            const ignoreCase = document.getElementById('ignoreCase').checked;
            const multiline = document.getElementById('multiline').checked;
            
            if (!pattern) {
                document.getElementById('results').innerHTML = '<p>Enter a regex pattern to test</p>';
                return;
            }
            
            try {
                const flags = (global ? 'g' : '') + (ignoreCase ? 'i' : '') + (multiline ? 'm' : '');
                const regex = new RegExp(pattern, flags);
                
                if (global) {
                    const matches = testString.match(regex);
                    if (matches) {
                        let html = '<h4>Found ' + matches.length + ' match(es):</h4><ul>';
                        matches.forEach((match, i) => {
                            html += '<li>' + escapeHtml(match) + '</li>';
                        });
                        html += '</ul>';
                        document.getElementById('results').innerHTML = html;
                    } else {
                        document.getElementById('results').innerHTML = '<p>No matches found</p>';
                    }
                } else {
                    const match = testString.match(regex);
                    if (match) {
                        document.getElementById('results').innerHTML = '<p>Match found: <strong>' + escapeHtml(match[0]) + '</strong></p>';
                    } else {
                        document.getElementById('results').innerHTML = '<p>No match found</p>';
                    }
                }
            } catch (e) {
                document.getElementById('results').innerHTML = '<p style="color: #e74c3c;">Invalid regex: ' + escapeHtml(e.message) + '</p>';
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_open', { tool: 'regex-tester' });
        }
    </script>
</body>
</html>
