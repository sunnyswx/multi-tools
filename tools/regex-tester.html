class="input-group"> <label>Regular Expression</label> <input type="text" id="regex" placeholder="Enter regex pattern..." oninput="testRegex()"> </div> <div class="flags"> <div class="flag-item"> <input type="checkbox" id="global" onchange="testRegex()"> <label for="global">Global (g)</label> </div> <div class="flag-item"> <input type="checkbox" id="multiline" onchange="testRegex()"> <label for="multiline">Multiline (m)</label> </div> <div class="flag-item"> <input type="checkbox" id="caseInsensitive" onchange="testRegex()"> <label for="caseInsensitive">Case Insensitive (i)</label> </div> </div> <div class="input-group"> <label>Test String</label> <textarea id="testString" placeholder="Enter text to test..." oninput="testRegex()"></textarea> </div> <div class="result-box"> <h3>Result</h3> <div id="highlightedText" style="margin-top: 15px; white-space: pre-wrap; word-break: break-all;"></div> <div class="match-list" id="matchList"></div> </div> </main> </div> <script> function testRegex() { const pattern = document.getElementById('regex').value; const text = document.getElementById('testString').value; if (!pattern || !text) { document.getElementById('highlightedText').textContent = text; document.getElementById('matchList').innerHTML = ''; return; } let flags = ''; if (document.getElementById('global').checked) flags += 'g'; if (document.getElementById('multiline').checked) flags += 'm'; if (document.getElementById('caseInsensitive').checked) flags += 'i'; try { const regex = new RegExp(pattern, flags); const matches = text.match(regex); // Highlight matches let highlighted = text.replace(regex, match => `<span class="match">${match}</span>`); document.getElementById('highlightedText').innerHTML = highlighted; // Show matches if (matches) { document.getElementById('matchList').innerHTML = matches.map((m, i) => `<div class="match-item"><strong>Match ${i + 1}:</strong> ${m}</div>` ).join(''); } else { document.getElementById('matchList').innerHTML = '<div class="match-item">No matches found</div>'; } } catch (e) { document.getElementById('highlightedText').textContent = 'Invalid regex: ' + e.message; document.getElementById('matchList').innerHTML = ''; } } // Track usage if (typeof gtag !== 'undefined') { gtag('event', 'tool_usage', { 'event_category': 'tools', 'event_label': 'regex-tester', 'value': 1 }); } </script> </body> </html>
