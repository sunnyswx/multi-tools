<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timestamp Converter - Multi Tools</title>
    <meta name="description" content="Convert Unix timestamps.">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lang.js"></script>
    <style>
        .tool-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 30px; }
        .tool-header h1 { color: #333; font-size: 2rem; margin-bottom: 10px; }
        .tool-header p { color: #666; }
        .tool-content { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        input[type="number"], input[type="datetime-local"] { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        .btn { padding: 12px 30px; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .result { margin-top: 20px; padding: 20px; background: #f8f9fa; border-radius: 10px; }
        .result h3 { margin-top: 0; }
        .result-value { font-size: 1.5rem; font-weight: bold; color: #667eea; }
        .language-selector { margin-top: 30px; text-align: center; }
        .language-selector select { padding: 10px 20px; font-size: 16px; border: none; border-radius: 25px; background: #667eea; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn">← Back to Home</a>
        <div class="tool-container">
            <div class="tool-header">
                <h1>⏱️ Timestamp Converter</h1>
                <p>Convert Unix timestamps</p>
            </div>
            <div class="tool-content">
                <div class="input-group">
                    <label>Unix Timestamp (seconds):</label>
                    <input type="number" id="timestamp" placeholder="1700000000">
                </div>
                <button class="btn" onclick="convert()">Convert</button>
                <div class="result" id="result" style="display: none;">
                    <h3>Result:</h3>
                    <div class="result-value" id="resultValue"></div>
                </div>
            </div>
            <div class="language-selector">
                <select id="langSelect" onchange="changeLanguage(this.value)">
                    <option value="en">English</option>
                    <option value="zh">中文</option>
                    <option value="ja">日本語</option>
                    <option value="ko">한국어</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                    <option value="ru">Русский</option>
                    <option value="ar">العربية</option>
                </select>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getLanguage();
            applyLanguage(lang);
        });
        
        function convert() {
            const ts = parseInt(document.getElementById('timestamp').value);
            if (isNaN(ts)) {
                alert('Please enter a valid timestamp');
                return;
            }
            
            const date = new Date(ts * 1000);
            const formatted = date.toLocaleString();
            const iso = date.toISOString();
            
            document.getElementById('resultValue').innerHTML = 
                '<strong>Local:</strong> ' + formatted + '<br>' +
                '<strong>UTC:</strong> ' + iso;
            document.getElementById('result').style.display = 'block';
        }
        
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_open', { tool: 'timestamp-converter' });
        }
    </script>
</body>
</html>
