<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本压缩器 - 免费在线文本压缩工具 | Multi Tools</title>
    <meta name="description" content="免费在线文本压缩工具，去除多余空格、空行和换行符。支持自定义压缩级别，适用于代码优化和文本处理。">
    
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7B5H09J4KB"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-7B5H09J4KB');
    </script>
    
    <script>
        function trackToolUsage(toolName, action) {
            if (typeof gtag !== 'undefined') {
                gtag('event', 'tool_usage', {
                    'event_category': 'Tool',
                    'event_label': toolName,
                    'value': action
                });
            }
        }
    </script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        header { text-align: center; padding: 40px 20px; color: white; }
        header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        header p { font-size: 1.1rem; opacity: 0.9; }
        
        .tool-container { background: white; border-radius: 20px; padding: 40px; margin-top: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        
        .tool-header { text-align: center; margin-bottom: 30px; }
        .tool-icon { font-size: 4rem; margin-bottom: 15px; }
        .tool-title { font-size: 2rem; color: #333; margin-bottom: 10px; }
        .tool-description { color: #666; font-size: 1.1rem; }
        
        .input-section { margin-bottom: 30px; }
        .input-section label { display: block; font-weight: bold; color: #333; margin-bottom: 10px; }
        .input-section textarea { width: 100%; height: 200px; padding: 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; resize: vertical; transition: border-color 0.3s; }
        .input-section textarea:focus { outline: none; border-color: #667eea; }
        
        .options { background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .options h3 { color: #333; margin-bottom: 15px; }
        .option-item { margin: 10px 0; }
        .option-item label { display: inline-flex; align-items: center; cursor: pointer; }
        .option-item input[type="checkbox"] { margin-right: 8px; }
        
        .button-group { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .btn { padding: 12px 30px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: all 0.3s; font-weight: 500; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover { background: #e0e0e0; }
        
        .result-section { background: #f8f9fa; padding: 20px; border-radius: 10px; }
        .result-section h3 { color: #333; margin-bottom: 15px; }
        .result-section textarea { width: 100%; height: 200px; padding: 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; resize: vertical; background: white; }
        
        .stats { display: flex; gap: 30px; margin-top: 20px; padding: 20px; background: white; border-radius: 10px; flex-wrap: wrap; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 2rem; font-weight: bold; color: #667eea; }
        .stat-label { color: #666; font-size: 0.9rem; margin-top: 5px; }
        
        .back-link { display: inline-block; margin-top: 30px; color: #667eea; text-decoration: none; font-weight: 500; }
        .back-link:hover { text-decoration: underline; }
        
        /* 问题反馈样式 */
        .feedback-section {
            margin-top: 40px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
        }
        
        .feedback-section h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }
        
        .feedback-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .feedback-form textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
        }
        
        .feedback-form textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .feedback-form .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .feedback-form .form-group {
            flex: 1;
            min-width: 200px;
        }
        
        .feedback-form label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .feedback-form input[type="text"],
        .feedback-form input[type="email"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .feedback-form input[type="text"]:focus,
        .feedback-form input[type="email"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .feedback-form .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            align-self: flex-start;
        }
        
        .feedback-form .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .feedback-success {
            background: #d1fae5;
            color: #065f46;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }
        
        .feedback-error {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }
        
        footer { text-align: center; padding: 40px 20px; color: white; opacity: 0.8; margin-top: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛠️ Multi Tools</h1>
            <p>免费在线工具集 - 本地处理，保护隐私</p>
        </header>
        
        <div class="tool-container">
            <div class="tool-header">
                <div class="tool-icon">📝</div>
                <h1 class="tool-title">文本压缩器</h1>
                <p class="tool-description">在线压缩文本，去除多余空格和换行</p>
            </div>
            
            <div class="input-section">
                <label for="inputText">输入文本：</label>
                <textarea id="inputText" placeholder="请在此输入或粘贴需要压缩的文本..."></textarea>
            </div>
            
            <div class="options">
                <h3>压缩选项：</h3>
                <div class="option-item">
                    <label>
                        <input type="checkbox" id="removeSpaces" checked>
                        去除多余空格
                    </label>
                </div>
                <div class="option-item">
                    <label>
                        <input type="checkbox" id="removeEmptyLines" checked>
                        去除空行
                    </label>
                </div>
                <div class="option-item">
                    <label>
                        <input type="checkbox" id="compressNewlines" checked>
                        压缩换行符
                    </label>
                </div>
                <div class="option-item">
                    <label>
                        <input type="checkbox" id="trimLines">
                        去除每行首尾空格
                    </label>
                </div>
            </div>
            
            <div class="button-group">
                <button class="btn btn-primary" onclick="compressText()">压缩文本</button>
                <button class="btn btn-secondary" onclick="copyResult()">复制结果</button>
                <button class="btn btn-secondary" onclick="clearAll()">清空全部</button>
            </div>
            
            <div class="result-section">
                <h3>压缩结果：</h3>
                <textarea id="outputText" readonly placeholder="压缩后的文本将显示在这里..."></textarea>
                
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="originalSize">0</div>
                        <div class="stat-label">原始字符数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="compressedSize">0</div>
                        <div class="stat-label">压缩后字符数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="compressionRate">0%</div>
                        <div class="stat-label">压缩率</div>
                    </div>
                </div>
            </div>
            
            <!-- 问题反馈区域 -->
            <div class="feedback-section">
                <h3>💬 问题反馈</h3>
                <p style="color: #666; margin-bottom: 20px;">发现bug或使用问题？请告诉我们，我们会尽快修复！</p>
                
                <form class="feedback-form" id="feedbackForm" onsubmit="submitFeedback(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="feedbackName">您的姓名（可选）</label>
                            <input type="text" id="feedbackName" placeholder="输入您的姓名">
                        </div>
                        <div class="form-group">
                            <label for="feedbackEmail">您的邮箱（可选）</label>
                            <input type="email" id="feedbackEmail" placeholder="input@example.com">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="feedbackType">问题类型</label>
                        <select id="feedbackType" style="width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px;">
                            <option value="bug">🐛 Bug报告</option>
                            <option value="feature">✨ 功能建议</option>
                            <option value="performance">⚡ 性能问题</option>
                            <option value="ui">🎨 界面问题</option>
                            <option value="other">📝 其他</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="feedbackMessage">问题描述 *</label>
                        <textarea id="feedbackMessage" placeholder="请详细描述您遇到的问题或建议..." required></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="feedbackBrowser">
                            包含浏览器信息（帮助快速定位问题）
                        </label>
                    </div>
                    
                    <button type="submit" class="btn-submit">提交反馈</button>
                </form>
                
                <div class="feedback-success" id="feedbackSuccess">
                    ✅ 感谢您的反馈！我们会尽快处理。
                </div>
                
                <div class="feedback-error" id="feedbackError">
                    ❌ 提交失败，请稍后重试。
                </div>
            </div>
            
            <a href="/" class="back-link">← 返回首页</a>
        </div>
        
        <footer>
            <p>© 2026 Multi Tools - 免费在线工具集</p>
        </footer>
    </div>
    
    <script>
        function compressText() {
            const input = document.getElementById('inputText').value;
            if (!input.trim()) {
                alert('请先输入文本！');
                return;
            }
            
            let result = input;
            
            // 去除每行首尾空格
            if (document.getElementById('trimLines').checked) {
                result = result.split('\n').map(line => line.trim()).join('\n');
            }
            
            // 去除空行
            if (document.getElementById('removeEmptyLines').checked) {
                result = result.split('\n').filter(line => line.trim() !== '').join('\n');
            }
            
            // 压缩换行符（多个换行变成单个）
            if (document.getElementById('compressNewlines').checked) {
                result = result.replace(/\n{3,}/g, '\n\n');
            }
            
            // 去除多余空格
            if (document.getElementById('removeSpaces').checked) {
                result = result.replace(/\s+/g, ' ');
            }
            
            document.getElementById('outputText').value = result.trim();
            
            // 更新统计
            const originalLen = input.length;
            const compressedLen = result.trim().length;
            const rate = originalLen > 0 ? Math.round((1 - compressedLen / originalLen) * 100) : 0;
            
            document.getElementById('originalSize').textContent = originalLen;
            document.getElementById('compressedSize').textContent = compressedLen;
            document.getElementById('compressionRate').textContent = rate + '%';
            
            trackToolUsage('text-compressor', 'compress');
        }
        
        function copyResult() {
            const output = document.getElementById('outputText');
            if (!output.value) {
                alert('没有可复制的内容！');
                return;
            }
            
            output.select();
            document.execCommand('copy');
            alert('已复制到剪贴板！');
            trackToolUsage('text-compressor', 'copy');
        }
        
        function clearAll() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').value = '';
            document.getElementById('originalSize').textContent = '0';
            document.getElementById('compressedSize').textContent = '0';
            document.getElementById('compressionRate').textContent = '0%';
            trackToolUsage('text-compressor', 'clear');
        }
        
        // 问题反馈功能
        function submitFeedback(e) {
            e.preventDefault();
            
            const name = document.getElementById('feedbackName').value.trim();
            const email = document.getElementById('feedbackEmail').value.trim();
            const type = document.getElementById('feedbackType').value;
            const message = document.getElementById('feedbackMessage').value.trim();
            const includeBrowser = document.getElementById('feedbackBrowser').checked;
            
            if (!message) {
                alert('请填写问题描述！');
                return;
            }
            
            // 构建反馈数据
            const feedbackData = {
                tool: 'text-compressor',
                timestamp: new Date().toISOString(),
                name: name || '匿名用户',
                email: email || '',
                type: type,
                message: message,
                browser: includeBrowser ? navigator.userAgent : ''
            };
            
            // 这里可以发送到后端API
            // 暂时使用localStorage保存
            try {
                const feedbacks = JSON.parse(localStorage.getItem('feedbacks') || '[]');
                feedbacks.push(feedbackData);
                localStorage.setItem('feedbacks', JSON.stringify(feedbacks));
                
                // 显示成功消息
                document.getElementById('feedbackSuccess').style.display = 'block';
                document.getElementById('feedbackError').style.display = 'none';
                
                // 清空表单
                document.getElementById('feedbackForm').reset();
                
                trackToolUsage('text-compressor', 'feedback');
                
                // 3秒后隐藏成功消息
                setTimeout(() => {
                    document.getElementById('feedbackSuccess').style.display = 'none';
                }, 3000);
            } catch (error) {
                // 显示错误消息
                document.getElementById('feedbackError').style.display = 'block';
                document.getElementById('feedbackSuccess').style.display = 'none';
                console.error('反馈提交失败:', error);
            }
        }
    </script>
</body>
</html>
