<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本压缩器 - 免费在线文本压缩工具 | Multi Tools</title>
    <meta name="description" content="免费在线文本压缩工具，去除多余空格、空行和换行符。支持自定义压缩级别，适用于代码优化和文本处理。">
    
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7B5H09J4KB"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-7B5H09J4KB');
    </script>
    
    <script>
        function trackToolUsage(toolName, action) {
            if (typeof gtag !== 'undefined') {
                gtag('event', 'tool_usage', {
                    'event_category': 'Tool',
                    'event_label': toolName,
                    'value': action
                });
            }
        }
    </script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        header { text-align: center; padding: 40px 20px; color: white; }
        header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        header p { font-size: 1.1rem; opacity: 0.9; }
        
        .tool-container { background: white; border-radius: 20px; padding: 40px; margin-top: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        
        .tool-header { text-align: center; margin-bottom: 30px; }
        .tool-icon { font-size: 4rem; margin-bottom: 15px; }
        .tool-title { font-size: 2rem; color: #333; margin-bottom: 10px; }
        .tool-description { color: #666; font-size: 1.1rem; }
        
        .input-section { margin-bottom: 30px; }
        .input-section label { display: block; font-weight: bold; color: #333; margin-bottom: 10px; }
        .input-section textarea { width: 100%; height: 200px; padding: 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; resize: vertical; transition: border-color 0.3s; }
        .input-section textarea:focus { outline: none; border-color: #667eea; }
        
        .options { background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .options h3 { color: #333; margin-bottom: 15px; }
        .option-item { margin: 10px 0; }
        .option-item label { display: inline-flex; align-items: center; cursor: pointer; }
        .option-item input[type="checkbox"] { margin-right: 8px; }
        
        .button-group { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; }
        .btn { padding: 12px 30px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: all 0.3s; font-weight: 500; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover { background: #e0e0e0; }
        
        .result-section { background: #f8f9fa; padding: 20px; border-radius: 10px; }
        .result-section h3 { color: #333; margin-bottom: 15px; }
        .result-section textarea { width: 100%; height: 200px; padding: 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; resize: vertical; background: white; }
        
        .stats { display: flex; gap: 30px; margin-top: 20px; padding: 20px; background: white; border-radius: 10px; flex-wrap: wrap; }
        .stat-item { text-align: center; }
        .stat-value { font-size: 2rem; font-weight: bold; color: #667eea; }
        .stat-label { color: #666; font-size: 0.9rem; margin-top: 5px; }
        
        .back-link { display: inline-block; margin-top: 30px; color: #667eea; text-decoration: none; font-weight: 500; }
        .back-link:hover { text-decoration: underline; }
        
        footer { text-align: center; padding: 40px 20px; color: white; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛠️ Multi Tools</h1>
            <p>免费在线工具集 - 本地处理，保护隐私</p>
        </header>
        
        <div class="tool-container">
            <div class="tool-header">
                <div class="tool-icon">📝</div>
                <h1 class="tool-title">文本压缩器</h1>
                <p class="tool-description">在线压缩文本，去除多余空格和换行</p>
            </div>
            
            <div class="input-section">
                <label for="inputText">输入文本：</label>
                <textarea id="inputText" placeholder="请在此输入或粘贴需要压缩的文本..."></textarea>
            </div>
            
            <div class="options">
                <h3>压缩选项：</h3>
                <div class="option-item">
                    <label>
                        <input type="checkbox" id="removeSpaces" checked>
                        去除多余空格
                    </label>
                </div>
                <div class="option-item">
                    <label>
                        <input type="checkbox" id="removeEmptyLines" checked>
                        去除空行
                    </label>
                </div>
                <div class="option-item">
                    <label>
                        <input type="checkbox" id="compressNewlines" checked>
                        压缩换行符
                    </label>
                </div>
                <div class="option-item">
                    <label>
                        <input type="checkbox" id="trimLines">
                        去除每行首尾空格
                    </label>
                </div>
            </div>
            
            <div class="button-group">
                <button class="btn btn-primary" onclick="compressText()">压缩文本</button>
                <button class="btn btn-secondary" onclick="copyResult()">复制结果</button>
                <button class="btn btn-secondary" onclick="clearAll()">清空全部</button>
            </div>
            
            <div class="result-section">
                <h3>压缩结果：</h3>
                <textarea id="outputText" readonly placeholder="压缩后的文本将显示在这里..."></textarea>
                
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="originalSize">0</div>
                        <div class="stat-label">原始字符数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="compressedSize">0</div>
                        <div class="stat-label">压缩后字符数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="compressionRate">0%</div>
                        <div class="stat-label">压缩率</div>
                    </div>
                </div>
            </div>
            
            <a href="/" class="back-link">← 返回首页</a>
        </div>
        
        <footer>
            <p>© 2026 Multi Tools - 免费在线工具集</p>
        </footer>
    </div>
    
    <script>
        function compressText() {
            const input = document.getElementById('inputText').value;
            if (!input.trim()) {
                alert('请先输入文本！');
                return;
            }
            
            let result = input;
            
            // 去除每行首尾空格
            if (document.getElementById('trimLines').checked) {
                result = result.split('\n').map(line => line.trim()).join('\n');
            }
            
            // 去除空行
            if (document.getElementById('removeEmptyLines').checked) {
                result = result.split('\n').filter(line => line.trim() !== '').join('\n');
            }
            
            // 压缩换行符（多个换行变成单个）
            if (document.getElementById('compressNewlines').checked) {
                result = result.replace(/\n{3,}/g, '\n\n');
            }
            
            // 去除多余空格
            if (document.getElementById('removeSpaces').checked) {
                result = result.replace(/\s+/g, ' ');
            }
            
            document.getElementById('outputText').value = result.trim();
            
            // 更新统计
            const originalLen = input.length;
            const compressedLen = result.trim().length;
            const rate = originalLen > 0 ? Math.round((1 - compressedLen / originalLen) * 100) : 0;
            
            document.getElementById('originalSize').textContent = originalLen;
            document.getElementById('compressedSize').textContent = compressedLen;
            document.getElementById('compressionRate').textContent = rate + '%';
            
            trackToolUsage('text-compressor', 'compress');
        }
        
        function copyResult() {
            const output = document.getElementById('outputText');
            if (!output.value) {
                alert('没有可复制的内容！');
                return;
            }
            
            output.select();
            document.execCommand('copy');
            alert('已复制到剪贴板！');
            trackToolUsage('text-compressor', 'copy');
        }
        
        function clearAll() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').value = '';
            document.getElementById('originalSize').textContent = '0';
            document.getElementById('compressedSize').textContent = '0';
            document.getElementById('compressionRate').textContent = '0%';
            trackToolUsage('text-compressor', 'clear');
        }
    </script>
</body>
</html>
