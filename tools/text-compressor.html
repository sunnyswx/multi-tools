header> <h1>📦 Text Compressor</h1> <p>Compress text to reduce size</p> </header> <main class="tool-content"> <div class="input-group"> <label>Input Text</label> <textarea id="inputText" placeholder="Enter text to compress..."></textarea> </div> <div class="btn-group"> <button class="btn btn-primary" onclick="compress()">📦 Compress</button> <button class="btn btn-primary" onclick="decompress()">📤 Decompress</button> <button class="btn btn-secondary" onclick="copyResult()">📋 Copy Result</button> <button class="btn btn-secondary" onclick="clearAll()">🗑️ Clear</button> </div> <div class="input-group"> <label>Result</label> <textarea id="resultText" readonly placeholder="Result will appear here..."></textarea> </div> <div class="stats"> <div class="stat-box"> <div class="stat-value" id="originalSize">0</div> <div class="stat-label">Original Size (bytes)</div> </div> <div class="stat-box"> <div class="stat-value" id="compressedSize">0</div> <div class="stat-label">Compressed Size (bytes)</div> </div> <div class="stat-box"> <div class="stat-value" id="compressionRatio">0%</div> <div class="stat-label">Compression Ratio</div> </div> </div> </main> </div> <script> async function compress() { const text = document.getElementById('inputText').value; if (!text) { alert('Please enter text to compress!'); return; } try { const encoder = new TextEncoder(); const data = encoder.encode(text); // Use compression stream (if available) const stream = new CompressionStream('deflate-raw'); const writer = stream.writable.getWriter(); writer.write(data); writer.close(); const compressed = await new Response(stream.readable).arrayBuffer(); const base64 = btoa(String.fromCharCode(...new Uint8Array(compressed))); document.getElementById('resultText').value = base64; updateStats(text.length, base64.length); } catch (e) { // Fallback: simple encoding const encoded = encodeURIComponent(text); document.getElementById('resultText').value = encoded; updateStats(text.length, encoded.length); } } async function decompress() { const text = document.getElementById('resultText').value; if (!text) { alert('Please compress first!'); return; } try { // Try to decode as Base64 first const binary = atob(text); const bytes = new Uint8Array(binary.length); for (let i = 0; i < binary.length; i++) { bytes[i] = binary.charCodeAt(i); } // Try decompression const stream = new DecompressionStream('deflate-raw'); const writer = stream.writable.getWriter(); writer.write(bytes); writer.close(); const decompressed = await new Response(stream.readable).arrayBuffer(); const decoder = new TextDecoder(); const result = decoder.decode(decompressed); document.getElementById('inputText').value = result; updateStats(text.length, result.length); } catch (e) { // Fallback: try decodeURIComponent try { const result = decodeURIComponent(text); document.getElementById('inputText').value = result; updateStats(text.length, result.length); } catch (e2) { alert('Failed to decompress. Please check the format.'); } } } function copyResult() { const result = document.getElementById('resultText').value; if (!result) { alert('No result to copy!'); return; } navigator.clipboard.writeText(result).then(() => { alert('Result copied!'); }); } function clearAll() { document.getElementById('inputText').value = ''; document.getElementById('resultText').value = ''; updateStats(0, 0); } function updateStats(original, compressed) { document.getElementById('originalSize').textContent = original; document.getElementById('compressedSize').textContent = compressed; if (original > 0) { const ratio = ((1 - compressed / original) * 100).toFixed(1); document.getElementById('compressionRatio').textContent = ratio + '%'; } else { document.getElementById('compressionRatio').textContent = '0%'; } } // Track usage if (typeof gtag !== 'undefined') { gtag('event', 'tool_usage', { 'event_category': 'tools', 'event_label': 'text-compressor', 'value': 1 }); } </script> </body> </html>
