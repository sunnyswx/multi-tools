<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cron Generator - Multi Tools</title>
    <meta name="description" content="Generate cron expressions.">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lang.js"></script>
    <style>
        .tool-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 30px; }
        .tool-header h1 { color: #333; font-size: 2rem; margin-bottom: 10px; }
        .tool-header p { color: #666; }
        .tool-content { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .cron-display { font-size: 2.5rem; font-family: monospace; text-align: center; padding: 20px; background: #f8f9fa; border-radius: 10px; margin-bottom: 20px; }
        .control-group { margin-bottom: 20px; }
        .control-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        .preset-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .btn { padding: 10px 20px; border: 2px solid #e0e0e0; border-radius: 25px; cursor: pointer; background: white; font-size: 14px; }
        .btn:hover { border-color: #667eea; color: #667eea; }
        .language-selector { margin-top: 30px; text-align: center; }
        .language-selector select { padding: 10px 20px; font-size: 16px; border: none; border-radius: 25px; background: #667eea; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn">← Back to Home</a>
        <div class="tool-container">
            <div class="tool-header">
                <h1>⏰ Cron Generator</h1>
                <p>Generate cron expressions</p>
            </div>
            <div class="tool-content">
                <div class="cron-display" id="cron">* * * * *</div>
                <div class="preset-buttons">
                    <button class="btn" onclick="setPreset('* * * * *', 'Every minute')">Every minute</button>
                    <button class="btn" onclick="setPreset('0 * * * *', 'Every hour')">Every hour</button>
                    <button class="btn" onclick="setPreset('0 0 * * *', 'Daily')">Daily</button>
                    <button class="btn" onclick="setPreset('0 0 * * 0', 'Weekly')">Weekly</button>
                    <button class="btn" onclick="setPreset('0 0 1 * *', 'Monthly')">Monthly</button>
                </div>
                <div class="control-group">
                    <label>Minute:</label>
                    <select id="minute" onchange="updateCron()">
                        <option value="*">Every minute</option>
                        <option value="0">At minute 0</option>
                        <option value="15">At minute 15</option>
                        <option value="30">At minute 30</option>
                        <option value="45">At minute 45</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Hour:</label>
                    <select id="hour" onchange="updateCron()">
                        <option value="*">Every hour</option>
                        <option value="0">Midnight</option>
                        <option value="12">Noon</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Day of month:</label>
                    <select id="dom" onchange="updateCron()">
                        <option value="*">Every day</option>
                        <option value="1">1st of month</option>
                        <option value="15">15th of month</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Month:</label>
                    <select id="month" onchange="updateCron()">
                        <option value="*">Every month</option>
                        <option value="1">January</option>
                        <option value="6">June</option>
                        <option value="12">December</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Day of week:</label>
                    <select id="dow" onchange="updateCron()">
                        <option value="*">Every day</option>
                        <option value="0">Sunday</option>
                        <option value="1">Monday</option>
                        <option value="5">Friday</option>
                        <option value="6">Saturday</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getLanguage();
            applyLanguage(lang);
        });
        
        function updateCron() {
            const cron = document.getElementById('minute').value + ' ' + 
                        document.getElementById('hour').value + ' ' + 
                        document.getElementById('dom').value + ' ' + 
                        document.getElementById('month').value + ' ' + 
                        document.getElementById('dow').value;
            document.getElementById('cron').textContent = cron;
        }
        
        function setPreset(cron, desc) {
            const parts = cron.split(' ');
            document.getElementById('minute').value = parts[0];
            document.getElementById('hour').value = parts[1];
            document.getElementById('dom').value = parts[2];
            document.getElementById('month').value = parts[3];
            document.getElementById('dow').value = parts[4];
            updateCron();
        }
        
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_open', { tool: 'cron-generator' });
        }
    </script>
</body>
</html>
