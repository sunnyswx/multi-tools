    <script>
        const descriptions = {
            '* * * * *': '每分钟执行一次',
            '*/5 * * * *': '每5分钟执行一次',
            '*/10 * * * *': '每10分钟执行一次',
            '*/30 * * * *': '每30分钟执行一次',
            '0 * * * *': '每小时整点执行',
            '0 9 * * *': '每天9点执行',
            '0 9 * * 1-5': '工作日9点执行',
            '0 9 * * 1': '每周一9点执行',
            '0 9 * * 5': '每周五9点执行',
            '0 0 * * *': '每天午夜执行',
            '0 0 * * 0': '每周日午夜执行',
            '0 0 1 * *': '每月1号执行',
            '0 0 1 1 *': '每年1月1日执行',
            '0 0 1 * *': '每月1号午夜执行'
        };
        
        function updateCron() {
            const minute = document.getElementById('minute').value;
            const hour = document.getElementById('hour').value;
            const day = document.getElementById('day').value;
            const month = document.getElementById('month').value;
            const weekday = document.getElementById('weekday').value;
            
            const cron = `${minute} ${hour} ${day} ${month} ${weekday}`;
            document.getElementById('cronExpression').textContent = cron;
            
            // 尝试匹配描述
            let desc = descriptions[cron] || '自定义定时任务';
            document.getElementById('cronDesc').textContent = desc;
        }
        
        function setExample(cron, desc) {
            const parts = cron.split(' ');
            document.getElementById('minute').value = parts[0];
            document.getElementById('hour').value = parts[1];
            document.getElementById('day').value = parts[2] || '*';
            document.getElementById('month').value = parts[3] || '*';
            document.getElementById('weekday').value = parts[4] || '*';
            
            document.getElementById('cronExpression').textContent = cron;
            document.getElementById('cronDesc').textContent = desc;
        }
        
        function copyCron() {
            const cron = document.getElementById('cronExpression').textContent;
            navigator.clipboard.writeText(cron).then(() => {
                const btn = event.target;
                const original = btn.textContent;
                btn.textContent = '✓ 已复制';
                setTimeout(() => btn.textContent = original, 2000);
            });
        }
        
        function resetCron() {
            document.getElementById('minute').value = '*';
            document.getElementById('hour').value = '*';
            document.getElementById('day').value = '*';
            document.getElementById('month').value = '*';
            document.getElementById('weekday').value = '*';
            updateCron();
        }
        
        // 初始化
        updateCron();
