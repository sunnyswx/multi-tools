<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Contrast Checker - Multi Tools</title>
    <meta name="description" content="Check color contrast accessibility.">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lang.js"></script>
    <script>
        // 自动检测浏览器语言
        (function() {
            const browserLang = navigator.language.split('-')[0];
            const supportedLangs = ['en', 'zh', 'ja', 'ko', 'es', 'fr', 'de', 'ru', 'ar'];
            
            // 检查浏览器语言是否在支持列表中
            let lang = 'en'; // 默认英文
            if (supportedLangs.includes(browserLang)) {
                lang = browserLang;
            }
            
            // 保存到 localStorage
            localStorage.setItem('multi-tools-lang', lang);
            
            console.log('[AutoLang] Browser language:', browserLang, '=> Using:', lang);
        })();
    </script>
    <style>
        .tool-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 30px; }
        .tool-header h1 { color: #333; font-size: 2rem; margin-bottom: 10px; }
        .tool-header p { color: #666; }
        .tool-content { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .color-inputs { display: flex; gap: 20px; margin-bottom: 20px; }
        .color-input { flex: 1; }
        .color-input label { display: block; margin-bottom: 8px; font-weight: 600; }
        .color-input input[type="color"] { width: 100%; height: 50px; border: none; cursor: pointer; }
        .preview-box { padding: 40px; border-radius: 10px; text-align: center; margin-bottom: 20px; }
        .result { padding: 20px; border-radius: 10px; text-align: center; }
        .result.pass { background: #d4edda; color: #155724; }
        .result.fail { background: #f8d7da; color: #721c24; }
        .ratio { font-size: 2rem; font-weight: bold; margin-bottom: 10px; }
        .level { font-size: 1.2rem; }
        .language-selector { margin-top: 30px; text-align: center; }
        .language-selector select { padding: 10px 20px; font-size: 16px; border: none; border-radius: 25px; background: #667eea; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn">← Back to Home</a>
        <div class="tool-container">
            <div class="tool-header">
                <h1>🎨 Color Contrast Checker</h1>
                <p>Check color contrast accessibility</p>
            </div>
            <div class="tool-content">
                <div class="color-inputs">
                    <div class="color-input">
                        <label>Foreground</label>
                        <input type="color" id="fgColor" value="#000000" oninput="checkContrast()">
                    </div>
                    <div class="color-input">
                        <label>Background</label>
                        <input type="color" id="bgColor" value="#ffffff" oninput="checkContrast()">
                    </div>
                </div>
                <div class="preview-box" id="previewBox">
                    <h2>Preview Text</h2>
                    <p>The quick brown fox jumps over the lazy dog</p>
                </div>
                <div class="result" id="result">
                    <div class="ratio" id="ratio">21:1</div>
                    <div class="level" id="level">AAA Pass</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getLanguage();
            applyLanguage(lang);
            checkContrast();
        });
        
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }
        
        function getLuminance(r, g, b) {
            var a = [r, g, b].map(function(v) {
                v /= 255;
                return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
            });
            return a[0] * 0.2126 + a[1] * 0.7152 + a[2] * 0.0722;
        }
        
        function checkContrast() {
            const fg = hexToRgb(document.getElementById('fgColor').value);
            const bg = hexToRgb(document.getElementById('bgColor').value);
            
            if (!fg || !bg) return;
            
            const lumFg = getLuminance(fg.r, fg.g, fg.b);
            const lumBg = getLuminance(bg.r, bg.g, bg.b);
            const ratio = (Math.max(lumFg, lumBg) + 0.05) / (Math.min(lumFg, lumBg) + 0.05);
            
            document.getElementById('ratio').textContent = ratio.toFixed(2) + ':1';
            
            const preview = document.getElementById('previewBox');
            preview.style.color = document.getElementById('fgColor').value;
            preview.style.background = document.getElementById('bgColor').value;
            
            const result = document.getElementById('result');
            let level = '';
            
            if (ratio >= 7) {
                level = 'AAA Pass ✓';
                result.className = 'result pass';
            } else if (ratio >= 4.5) {
                level = 'AA Pass ✓';
                result.className = 'result pass';
            } else if (ratio >= 3) {
                level = 'AA Large Pass ✓';
                result.className = 'result pass';
            } else {
                level = 'Fail ✗';
                result.className = 'result fail';
            }
            
            document.getElementById('level').textContent = level;
        }
        
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_open', { tool: 'color-contrast-checker' });
        }
    </script>
</body>
</html>
