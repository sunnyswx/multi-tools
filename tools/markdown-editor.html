    <script>
        // 问题反馈功能
        function submitFeedback(e) {
            e.preventDefault();
            
            const name = document.getElementById('feedbackName').value.trim();
            const email = document.getElementById('feedbackEmail').value.trim();
            const type = document.getElementById('feedbackType').value;
            const message = document.getElementById('feedbackMessage').value.trim();
            const includeBrowser = document.getElementById('feedbackBrowser').checked;
            
            if (!message) {
                alert('请填写问题描述！');
                return;
            }
            
            // 构建反馈数据
            const feedbackData = {
                tool: '""" + tool_name + """',
                timestamp: new Date().toISOString(),
                name: name || '匿名用户',
                email: email || '',
                type: type,
                message: message,
                browser: includeBrowser ? navigator.userAgent : ''
            };
            
            // 保存到localStorage
            try {
                const feedbacks = JSON.parse(localStorage.getItem('feedbacks') || '[]');
                feedbacks.push(feedbackData);
                localStorage.setItem('feedbacks', JSON.stringify(feedbacks));
                
                // 显示成功消息
                document.getElementById('feedbackSuccess').style.display = 'block';
                document.getElementById('feedbackError').style.display = 'none';
                
                // 清空表单
                document.getElementById('feedbackForm').reset();
                
                trackToolUsage('""" + tool_name + """', 'feedback');
                
                // 3秒后隐藏成功消息
                setTimeout(() => {
                    document.getElementById('feedbackSuccess').style.display = 'none';
                }, 3000);
            } catch (error) {
                // 显示错误消息
                document.getElementById('feedbackError').style.display = 'block';
                document.getElementById('feedbackSuccess').style.display = 'none';
                console.error('反馈提交失败:', error);
            }
        }
    </script>

    <script>
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        
        function updatePreview() {
            const markdown = editor.value;
            preview.innerHTML = marked.parse(markdown);
        }
        
        editor.addEventListener('input', updatePreview);
        
        function insertMarkdown(before, after) {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const text = editor.value;
            const selectedText = text.substring(start, end);
            
            const newText = text.substring(0, start) + before + selectedText + after + text.substring(end);
            editor.value = newText;
            
            if (selectedText) {
                editor.setSelectionRange(start + before.length, end + before.length);
            } else {
                editor.setSelectionRange(start + before.length, start + before.length);
            }
            
            editor.focus();
            updatePreview();
        }
        
        updatePreview();
