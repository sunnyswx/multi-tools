<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Editor - Multi Tools</title>
    <meta name="description" content="Edit Markdown with live preview.">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lang.js"></script>
    <style>
        .tool-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 30px; }
        .tool-header h1 { color: #333; font-size: 2rem; margin-bottom: 10px; }
        .tool-header p { color: #666; }
        .tool-content { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .editor-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .editor-pane { display: flex; flex-direction: column; }
        .pane-header { padding: 10px; background: #f0f0f0; border-radius: 10px 10px 0 0; font-weight: 600; color: #666; }
        textarea { width: 100%; height: 500px; padding: 20px; border: 2px solid #e0e0e0; border-radius: 0 0 10px 10px; font-family: monospace; font-size: 14px; resize: vertical; }
        textarea:focus { outline: none; border-color: #667eea; }
        .preview-pane { width: 100%; height: 500px; padding: 20px; border: 2px solid #e0e0e0; border-radius: 0 0 10px 10px; overflow-y: auto; background: #fafafa; }
        .preview-pane h1, .preview-pane h2, .preview-pane h3 { margin-top: 0; }
        .preview-pane code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
        .preview-pane pre { background: #f8f9fa; padding: 15px; border-radius: 10px; overflow-x: auto; }
        .preview-pane blockquote { border-left: 4px solid #667eea; padding-left: 15px; margin: 0; color: #666; }
        .language-selector { margin-top: 30px; text-align: center; }
        .language-selector select { padding: 10px 20px; font-size: 16px; border: none; border-radius: 25px; background: #667eea; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn">← Back to Home</a>
        <div class="tool-container">
            <div class="tool-header">
                <h1>📝 Markdown Editor</h1>
                <p>Edit Markdown with live preview</p>
            </div>
            <div class="tool-content">
                <div class="editor-container">
                    <div class="editor-pane">
                        <div class="pane-header">Markdown</div>
                        <textarea id="markdownInput" placeholder="Type your Markdown here..."># Hello World

## Features
- **Bold text** and *italic text*
- [Links](https://example.com)
- `Inline code`

### Code Block
\`\`\`javascript
console.log('Hello!');
\`\`\`

> This is a quote

1. First item
2. Second item
</textarea>
                    </div>
                    <div class="editor-pane">
                        <div class="pane-header">Preview</div>
                        <div class="preview-pane" id="preview"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getLanguage();
            applyLanguage(lang);
            updatePreview();
            document.getElementById('markdownInput').addEventListener('input', updatePreview);
        });
        
        function updatePreview() {
            const markdown = document.getElementById('markdownInput').value;
            const html = simpleMarkdown(markdown);
            document.getElementById('preview').innerHTML = html;
        }
        
        function simpleMarkdown(md) {
            return md
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                .replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>')
                .replace(/\*(.*)\*/gim, '<em>$1</em>')
                .replace(/\[(.*)\]\((.*)\)/gim, '<a href="$2">$1</a>')
                .replace(/`(.*)`/gim, '<code>$1</code>')
                .replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>')
                .replace(/^\d+\. (.*$)/gim, '<li>$1</li>')
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>');
        }
        
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_open', { tool: 'markdown-editor' });
        }
    </script>
</body>
</html>
