<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Generator - Free Online Tool | Multi Tools</title>
    <meta name="description" content="Free online random generator. Generate random numbers, strings, passwords, and more.">
    <meta name="keywords" content="random, generator, random number, random string, online tool">
    
    <!-- GA4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; padding: 40px 20px; color: white; }
        header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .back-btn { display: inline-block; margin-bottom: 20px; padding: 10px 20px; background: rgba(255,255,255,0.2); color: white; text-decoration: none; border-radius: 25px; }
        .tool-content { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .result-box { background: #f8f9fa; padding: 30px; border-radius: 15px; text-align: center; margin: 30px 0; }
        .result-value { font-size: 3rem; font-weight: bold; color: #667eea; font-family: 'Courier New', monospace; word-break: break-all; }
        .controls { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 30px; }
        .control-group { display: flex; flex-direction: column; }
        .control-group label { font-weight: bold; margin-bottom: 8px; }
        .control-group input, .control-group select { padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; }
        .checkbox-group { display: flex; align-items: center; gap: 10px; padding: 15px; background: #f8f9fa; border-radius: 8px; margin-bottom: 10px; }
        .checkbox-group input { width: 20px; height: 20px; }
        .checkbox-group label { margin: 0; cursor: pointer; }
        .btn { padding: 12px 30px; border: none; border-radius: 25px; cursor: pointer; font-size: 16px; transition: all 0.3s; margin: 5px; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .btn-secondary { background: #f0f0f0; color: #333; }
        @media (max-width: 768px) { .controls { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-btn">← Back to Home</a>
        <header>
            <h1>🎲 Random Generator</h1>
            <p>Generate random numbers, strings, and more</p>
        </header>
        <main class="tool-content">
            <div class="controls">
                <div class="control-group">
                    <label>Type</label>
                    <select id="type" onchange="toggleOptions()">
                        <option value="number">Random Number</option>
                        <option value="string">Random String</option>
                        <option value="password">Random Password</option>
                        <option value="uuid">UUID</option>
                    </select>
                </div>
                <div class="control-group" id="numberOptions">
                    <label>Range</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="number" id="min" placeholder="Min" value="1" style="flex: 1;">
                        <input type="number" id="max" placeholder="Max" value="100" style="flex: 1;">
                    </div>
                </div>
                <div class="control-group" id="stringOptions" style="display: none;">
                    <label>Length</label>
                    <input type="number" id="stringLength" value="10" min="1" max="100">
                </div>
                <div class="control-group" id="passwordOptions" style="display: none;">
                    <label>Length</label>
                    <input type="number" id="passwordLength" value="16" min="4" max="64">
                </div>
            </div>
            
            <div id="passwordOptions" style="display: none;">
                <div class="checkbox-group">
                    <input type="checkbox" id="uppercase" checked>
                    <label for="uppercase">Uppercase (A-Z)</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="lowercase" checked>
                    <label for="lowercase">Lowercase (a-z)</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="numbers" checked>
                    <label for="numbers">Numbers (0-9)</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="symbols" checked>
                    <label for="symbols">Symbols (!@#$%^&*)</label>
                </div>
            </div>
            
            <div class="result-box">
                <div class="result-value" id="result">Click Generate</div>
            </div>
            
            <div style="text-align: center;">
                <button class="btn btn-primary" onclick="generate()">🎲 Generate</button>
                <button class="btn btn-secondary" onclick="copyResult()">📋 Copy</button>
            </div>
        </main>
    </div>
    
    <script>
        function toggleOptions() {
            const type = document.getElementById('type').value;
            document.getElementById('numberOptions').style.display = type === 'number' ? 'block' : 'none';
            document.getElementById('stringOptions').style.display = type === 'string' ? 'block' : 'none';
            document.getElementById('passwordOptions').style.display = type === 'password' ? 'block' : 'none';
            generate();
        }
        
        function generate() {
            const type = document.getElementById('type').value;
            let result;
            
            switch(type) {
                case 'number':
                    const min = parseInt(document.getElementById('min').value) || 1;
                    const max = parseInt(document.getElementById('max').value) || 100;
                    result = Math.floor(Math.random() * (max - min + 1)) + min;
                    break;
                case 'string':
                    const length = parseInt(document.getElementById('stringLength').value) || 10;
                    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
                    result = '';
                    for (let i = 0; i < length; i++) {
                        result += chars.charAt(Math.floor(Math.random() * chars.length));
                    }
                    break;
                case 'password':
                    const pwLength = parseInt(document.getElementById('passwordLength').value) || 16;
                    let pwChars = '';
                    if (document.getElementById('uppercase').checked) pwChars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                    if (document.getElementById('lowercase').checked) pwChars += 'abcdefghijklmnopqrstuvwxyz';
                    if (document.getElementById('numbers').checked) pwChars += '0123456789';
                    if (document.getElementById('symbols').checked) pwChars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
                    if (!pwChars) pwChars = 'abcdefghijklmnopqrstuvwxyz0123456789';
                    result = '';
                    for (let i = 0; i < pwLength; i++) {
                        result += pwChars.charAt(Math.floor(Math.random() * pwChars.length));
                    }
                    break;
                case 'uuid':
                    result = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                        const r = Math.random() * 16 | 0;
                        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
                    });
                    break;
            }
            
            document.getElementById('result').textContent = result;
        }
        
        function copyResult() {
            const result = document.getElementById('result').textContent;
            if (result === 'Click Generate') {
                alert('Please generate first!');
                return;
            }
            navigator.clipboard.writeText(result).then(() => {
                alert('Copied!');
            });
        }
        
        // Generate on load
        generate();
        
        // Track usage
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_usage', { 'event_category': 'tools', 'event_label': 'random-generator', 'value': 1 });
        }
    </script>
</body>
</html>
