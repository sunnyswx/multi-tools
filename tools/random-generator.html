<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Number Generator - Multi Tools</title>
    <meta name="description" content="Generate random numbers.">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lang.js"></script>
    <script>
        // 自动检测浏览器语言
        (function() {
            const browserLang = navigator.language.split('-')[0];
            const supportedLangs = ['en', 'zh', 'ja', 'ko', 'es', 'fr', 'de', 'ru', 'ar'];
            
            // 检查浏览器语言是否在支持列表中
            let lang = 'en'; // 默认英文
            if (supportedLangs.includes(browserLang)) {
                lang = browserLang;
            }
            
            // 保存到 localStorage
            localStorage.setItem('multi-tools-lang', lang);
            
            console.log('[AutoLang] Browser language:', browserLang, '=> Using:', lang);
        })();
    </script>
    <script>
        // 初始化语言
        document.addEventListener('DOMContentLoaded', function() {
            initLanguage();
            debugTranslations();
        });
    </script>
    <style>
        .tool-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 30px; }
        .tool-header h1 { color: #333; font-size: 2rem; margin-bottom: 10px; }
        .tool-header p { color: #666; }
        .tool-content { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        .range-inputs { display: flex; gap: 15px; align-items: center; }
        .range-inputs div { flex: 1; }
        input[type="number"] { width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; }
        input[type="number"]:focus { outline: none; border-color: #667eea; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .btn { padding: 12px 30px; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .result { margin-top: 20px; text-align: center; }
        .result-value { font-size: 4rem; font-weight: bold; color: #667eea; }
        .result-label { color: #666; margin-top: 10px; }
        .count-group { margin-bottom: 20px; }
        .language-selector { margin-top: 30px; text-align: center; }
        .language-selector select { padding: 10px 20px; font-size: 16px; border: none; border-radius: 25px; background: #667eea; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn" data-i18n="common.back_to_home">← Back to Home</a>
        <div class="tool-container">
            <div class="tool-header">
                <h1>🎲 Random Number Generator</h1>
                <p>Generate random numbers</p>
            </div>
            <div class="tool-content">
                <div class="range-inputs">
                    <div class="input-group">
                        <label>Min</label>
                        <input type="number" id="min" value="1">
                    </div>
                    <div class="input-group">
                        <label>Max</label>
                        <input type="number" id="max" value="100">
                    </div>
                </div>
                <div class="count-group">
                    <label>Count: <input type="number" id="count" value="1" min="1" max="100" style="width: 80px;"></label>
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="generate()">Generate</button>
                    <button class="btn btn-secondary" onclick="copy()">Copy</button>
                </div>
                <div class="result" id="result">
                    <div class="result-value" id="resultValue">-</div>
                    <div class="result-label">Result</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getLanguage();
            applyLanguage(lang);
        });
        
        function generate() {
            const min = parseInt(document.getElementById('min').value);
            const max = parseInt(document.getElementById('max').value);
            const count = parseInt(document.getElementById('count').value) || 1;
            
            if (isNaN(min) || isNaN(max)) {
                alert('Please enter valid numbers!');
                return;
            }
            
            let results = [];
            for (let i = 0; i < count; i++) {
                results.push(Math.floor(Math.random() * (max - min + 1)) + min);
            }
            
            const resultValue = results.join(', ');
            document.getElementById('resultValue').textContent = resultValue;
            document.getElementById('result').style.display = 'block';
            
            window.lastResults = results;
        }
        
        function copy() {
            if (!window.lastResults) {
                alert('Generate a number first!');
                return;
            }
            navigator.clipboard.writeText(window.lastResults.join(', '));
            alert('Copied!');
        }
        
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_open', { tool: 'random-generator' });
        }
    </script>
</body>
</html>
