    <script>
        // 问题反馈功能
        function submitFeedback(e) {
            e.preventDefault();
            
            const name = document.getElementById('feedbackName').value.trim();
            const email = document.getElementById('feedbackEmail').value.trim();
            const type = document.getElementById('feedbackType').value;
            const message = document.getElementById('feedbackMessage').value.trim();
            const includeBrowser = document.getElementById('feedbackBrowser').checked;
            
            if (!message) {
                alert('请填写问题描述！');
                return;
            }
            
            // 构建反馈数据
            const feedbackData = {
                tool: '""" + tool_name + """',
                timestamp: new Date().toISOString(),
                name: name || '匿名用户',
                email: email || '',
                type: type,
                message: message,
                browser: includeBrowser ? navigator.userAgent : ''
            };
            
            // 保存到localStorage
            try {
                const feedbacks = JSON.parse(localStorage.getItem('feedbacks') || '[]');
                feedbacks.push(feedbackData);
                localStorage.setItem('feedbacks', JSON.stringify(feedbacks));
                
                // 显示成功消息
                document.getElementById('feedbackSuccess').style.display = 'block';
                document.getElementById('feedbackError').style.display = 'none';
                
                // 清空表单
                document.getElementById('feedbackForm').reset();
                
                trackToolUsage('""" + tool_name + """', 'feedback');
                
                // 3秒后隐藏成功消息
                setTimeout(() => {
                    document.getElementById('feedbackSuccess').style.display = 'none';
                }, 3000);
            } catch (error) {
                // 显示错误消息
                document.getElementById('feedbackError').style.display = 'block';
                document.getElementById('feedbackSuccess').style.display = 'none';
                console.error('反馈提交失败:', error);
            }
        }
    </script>

    <script>
        // 工具使用追踪
        function trackToolUsage(toolName, action) {
            gtag('event', 'tool_usage', {
                'tool_name': toolName,
                'action': action,
                'event_category': 'Tool',
                'event_label': toolName + '_' + action
            });
        }
        
        // 随机数生成
        function generateRandom() {
            trackToolUsage('random-generator', 'generate_random');
            
            const min = parseInt(document.getElementById('minNum').value);
            const max = parseInt(document.getElementById('maxNum').value);
            const count = parseInt(document.getElementById('count').value);
            
            if (min >= max) {
                alert('最小值必须小于最大值');
                return;
            }
            
            const results = [];
            for (let i = 0; i < count; i++) {
                results.push(Math.floor(Math.random() * (max - min + 1)) + min);
            }
            
            document.getElementById('randomValue').textContent = results.join(', ');
            document.getElementById('randomResult').style.display = 'block';
        }
        
        // 随机选择
        function randomChoice() {
            trackToolUsage('random-generator', 'random_choice');
            
            const text = document.getElementById('optionsText').value.trim();
            if (!text) {
                alert('请输入选项');
                return;
            }
            
            const options = text.split('\n').filter(opt => opt.trim());
            if (options.length === 0) {
                alert('请输入至少一个选项');
                return;
            }
            
            const randomIndex = Math.floor(Math.random() * options.length);
            document.getElementById('choiceValue').textContent = options[randomIndex];
            document.getElementById('choiceResult').style.display = 'block';
        }
        
        // 随机密码生成
        function generatePassword() {
            trackToolUsage('random-generator', 'generate_password');
            
            const length = parseInt(document.getElementById('pwdLength').value);
            const includeUpper = document.getElementById('includeUpper').checked;
            const includeLower = document.getElementById('includeLower').checked;
            const includeNumbers = document.getElementById('includeNumbers').checked;
            const includeSymbols = document.getElementById('includeSymbols').checked;
            
            let chars = '';
            if (includeUpper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (includeLower) chars += 'abcdefghijklmnopqrstuvwxyz';
            if (includeNumbers) chars += '0123456789';
            if (includeSymbols) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
            
            if (chars === '') {
                alert('请至少选择一种字符类型');
                return;
            }
            
            let password = '';
            for (let i = 0; i < length; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            
            document.getElementById('passwordValue').textContent = password;
            document.getElementById('passwordResult').style.display = 'block';
        }
        
        // 复制密码
        function copyPassword() {
            trackToolUsage('random-generator', 'copy_password');
            
            const password = document.getElementById('passwordValue').textContent;
            navigator.clipboard.writeText(password).then(() => {
                alert('密码已复制到剪贴板！');
            }).catch(() => {
                alert('复制失败，请手动复制');
            });
        }
    </script>
