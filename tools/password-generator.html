    <script>
        const passwordDisplay = document.getElementById('passwordDisplay');
        const lengthSlider = document.getElementById('lengthSlider');
        const lengthValue = document.getElementById('lengthValue');
        const uppercase = document.getElementById('uppercase');
        const lowercase = document.getElementById('lowercase');
        const numbers = document.getElementById('numbers');
        const symbols = document.getElementById('symbols');
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const strengthFill = document.getElementById('strengthFill');
        
        lengthSlider.addEventListener('input', (e) => {
            lengthValue.textContent = e.target.value;
            generatePassword();
        });
        
        [uppercase, lowercase, numbers, symbols].forEach(cb => {
            cb.addEventListener('change', generatePassword);
        });
        
        function generatePassword() {
            const length = parseInt(lengthSlider.value);
            let chars = '';
            
            if (uppercase.checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (lowercase.checked) chars += 'abcdefghijklmnopqrstuvwxyz';
            if (numbers.checked) chars += '0123456789';
            if (symbols.checked) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
            
            if (!chars) {
                alert('请至少选择一种字符类型');
                return;
            }
            
            let password = '';
            const array = new Uint32Array(length);
            crypto.getRandomValues(array);
            
            for (let i = 0; i < length; i++) {
                password += chars[array[i] % chars.length];
            }
            
            passwordDisplay.textContent = password;
            updateStrength(password);
        }
        
        function updateStrength(password) {
            let strength = 0;
            
            if (password.length >= 8) strength += 25;
            if (password.length >= 12) strength += 25;
            if (/[A-Z]/.test(password)) strength += 25;
            if (/[0-9]/.test(password) && /[^A-Za-z0-9]/.test(password)) strength += 25;
            
            strengthFill.style.width = strength + '%';
            
            if (strength < 50) {
                strengthFill.style.background = '#f44336';
            } else if (strength < 75) {
                strengthFill.style.background = '#ff9800';
            } else {
                strengthFill.style.background = '#4caf50';
            }
        }
        
        generateBtn.addEventListener('click', generatePassword);
        
        copyBtn.addEventListener('click', () => {
            const password = passwordDisplay.textContent;
            navigator.clipboard.writeText(password).then(() => {
                copyBtn.textContent = '✓ 已复制';
                setTimeout(() => {
                    copyBtn.textContent = '复制密码';
                }, 2000);
            });
        });
        
        generatePassword();
