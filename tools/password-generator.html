<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator - Multi Tools</title>
    <meta name="description" content="Password Generator: Generate strong, secure passwords online.">
    
    <!-- GA4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lang.js"></script>
    
    <style>
        .tool-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .tool-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .tool-header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .tool-header p {
            color: #666;
            font-size: 1.1rem;
        }
        .tool-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        .input-group input,
        .input-group textarea,
        .input-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .input-group input:focus,
        .input-group textarea:focus,
        .input-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .input-group textarea {
            min-height: 150px;
            resize: vertical;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .result h3 {
            color: #333;
            margin-bottom: 10px;
        }
        .result pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 14px;
        }
        .result code {
            font-family: 'Consolas', 'Monaco', monospace;
        }
        .language-selector {
            margin-top: 30px;
            text-align: center;
        }
        .language-selector select {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            background: #667eea;
            color: white;
            cursor: pointer;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            text-decoration: none;
            border-radius: 25px;
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: rgba(102, 126, 234, 0.2);
        }
        /* Color Picker Styles */
        .color-preview {
            width: 100%;
            height: 150px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
        }
        /* Range Slider */
        input[type="range"] {
            width: 100%;
            margin: 10px 0;
        }
        /* Gradient Preview */
        .gradient-preview {
            width: 100%;
            height: 150px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
        }
        /* Shadow Preview */
        .shadow-preview {
            width: 200px;
            height: 200px;
            background: white;
            border-radius: 10px;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        /* Countdown Timer */
        .timer-display {
            font-size: 4rem;
            text-align: center;
            font-weight: bold;
            color: #667eea;
            margin: 30px 0;
        }
        /* Calculator */
        .calculator-display {
            width: 100%;
            padding: 20px;
            font-size: 2rem;
            text-align: right;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        /* QR Code */
        .qr-preview {
            text-align: center;
            margin: 20px 0;
        }
        .qr-preview img {
            max-width: 200px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn">← Back to Home</a>
        
        <div class="tool-container">
            <div class="tool-header">
                <h1>🔑 Password Generator</h1>
                <p>Generate strong, secure passwords online.</p>
            </div>
            
            <div class="tool-content" id="toolContent">
                <!-- Tool-specific content will be inserted here -->
            </div>
            
            <div class="language-selector">
                <select id="langSelect" onchange="changeLanguage(this.value)">
                    <option value="en">English</option>
                    <option value="zh">中文</option>
                    <option value="ja">日本語</option>
                    <option value="ko">한국어</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                    <option value="ru">Русский</option>
                    <option value="ar">العربية</option>
                </select>
            </div>
        </div>
    </div>
    
    <script>
        // Initialize language
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getLanguage();
            applyLanguage(lang);
            initTool();
        });
        
        // Initialize tool
        function initTool() {
            
            const lengthGroup = document.createElement('div');
            lengthGroup.className = 'input-group';
            lengthGroup.innerHTML = '<label>Password Length: <span id="lengthValue">16</span></label><input type="range" id="passwordLength" min="4" max="64" value="16">';
            
            const optionsGroup = document.createElement('div');
            optionsGroup.className = 'input-group';
            optionsGroup.innerHTML = '<label>Options:</label>' +
                '<label style="font-weight: normal;"><input type="checkbox" id="includeUpper" checked> Uppercase (A-Z)</label>' +
                '<label style="font-weight: normal;"><input type="checkbox" id="includeLower" checked> Lowercase (a-z)</label>' +
                '<label style="font-weight: normal;"><input type="checkbox" id="includeNumbers" checked> Numbers (0-9)</label>' +
                '<label style="font-weight: normal;"><input type="checkbox" id="includeSymbols" checked> Symbols (!@#$%^&*)</label>';
            
            const generateBtn = document.createElement('button');
            generateBtn.className = 'btn btn-primary';
            generateBtn.textContent = 'Generate Password';
            
            const resultDiv = document.createElement('div');
            resultDiv.className = 'result';
            resultDiv.id = 'passwordResult';
            resultDiv.style.display = 'none';
            
            const toolContent = document.getElementById('toolContent');
            toolContent.appendChild(lengthGroup);
            toolContent.appendChild(optionsGroup);
            toolContent.appendChild(generateBtn);
            toolContent.appendChild(resultDiv);
            
            document.getElementById('passwordLength').addEventListener('input', (e) => {
                document.getElementById('lengthValue').textContent = e.target.value;
            });
            
            generateBtn.addEventListener('click', () => {
                const length = parseInt(document.getElementById('passwordLength').value);
                const includeUpper = document.getElementById('includeUpper').checked;
                const includeLower = document.getElementById('includeLower').checked;
                const includeNumbers = document.getElementById('includeNumbers').checked;
                const includeSymbols = document.getElementById('includeSymbols').checked;
                
                let chars = '';
                if (includeUpper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                if (includeLower) chars += 'abcdefghijklmnopqrstuvwxyz';
                if (includeNumbers) chars += '0123456789';
                if (includeSymbols) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
                
                if (!chars) {
                    alert('Please select at least one character type!');
                    return;
                }
                
                let password = '';
                for (let i = 0; i < length; i++) {
                    password += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                
                resultDiv.innerHTML = '<h3>Generated Password:</h3><pre><code style="font-size: 1.5rem;">' + escapeHtml(password) + '</code></pre>';
                resultDiv.style.display = 'block';
            });
        
        }
        
        // Track tool usage
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_open', { tool: 'password-generator' });
        }
    </script>
</body>
</html>
