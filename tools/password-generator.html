<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator - Multi Tools</title>
    <meta name="description" content="Generate secure passwords.">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lang.js"></script>
    <script>
        // 自动检测浏览器语言
        (function() {
            const browserLang = navigator.language.split('-')[0];
            const supportedLangs = ['en', 'zh', 'ja', 'ko', 'es', 'fr', 'de', 'ru', 'ar'];
            
            // 检查浏览器语言是否在支持列表中
            let lang = 'en'; // 默认英文
            if (supportedLangs.includes(browserLang)) {
                lang = browserLang;
            }
            
            // 保存到 localStorage
            localStorage.setItem('multi-tools-lang', lang);
            
            console.log('[AutoLang] Browser language:', browserLang, '=> Using:', lang);
        })();
    </script>
    <script>
        // 初始化语言
        document.addEventListener('DOMContentLoaded', function() {
            initLanguage();
        });
    </script>
    <style>
        .tool-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 30px; }
        .tool-header h1 { color: #333; font-size: 2rem; margin-bottom: 10px; }
        .tool-header p { color: #666; }
        .tool-content { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .password-display { font-size: 2rem; font-family: monospace; text-align: center; padding: 20px; background: #f8f9fa; border-radius: 10px; margin-bottom: 20px; word-break: break-all; }
        .control-group { margin-bottom: 20px; }
        .control-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        input[type="range"] { width: 100%; }
        .length-display { text-align: right; color: #666; }
        .checkbox-group { margin-bottom: 15px; }
        .checkbox-group label { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .btn-group { display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 12px 30px; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .strength-bar { height: 10px; background: #e0e0e0; border-radius: 5px; margin-top: 10px; overflow: hidden; }
        .strength-fill { height: 100%; transition: all 0.3s; }
        .language-selector { margin-top: 30px; text-align: center; }
        .language-selector select { padding: 10px 20px; font-size: 16px; border: none; border-radius: 25px; background: #667eea; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn">← Back to Home</a>
        <div class="tool-container">
            <div class="tool-header">
                <h1>🔐 Password Generator</h1>
                <p>Generate secure passwords</p>
            </div>
            <div class="tool-content">
                <div class="password-display" id="password">Click Generate</div>
                <div class="strength-bar">
                    <div class="strength-fill" id="strengthFill"></div>
                </div>
                <div class="control-group">
                    <label>Length: <span class="length-display" id="lengthValue">16</span></label>
                    <input type="range" id="length" min="8" max="32" value="16" oninput="document.getElementById('lengthValue').textContent = this.value">
                </div>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="uppercase" checked> Uppercase (A-Z)</label>
                </div>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="lowercase" checked> Lowercase (a-z)</label>
                </div>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="numbers" checked> Numbers (0-9)</label>
                </div>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="symbols" checked> Symbols (!@#$...)</label>
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="generate()">Generate</button>
                    <button class="btn btn-secondary" onclick="copy()">Copy</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getLanguage();
            applyLanguage(lang);
        });
        
        function generate() {
            const length = parseInt(document.getElementById('length').value);
            const useUpper = document.getElementById('uppercase').checked;
            const useLower = document.getElementById('lowercase').checked;
            const useNumbers = document.getElementById('numbers').checked;
            const useSymbols = document.getElementById('symbols').checked;
            
            let chars = '';
            if (useUpper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (useLower) chars += 'abcdefghijklmnopqrstuvwxyz';
            if (useNumbers) chars += '0123456789';
            if (useSymbols) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';
            
            if (!chars) {
                alert('Please select at least one character type');
                return;
            }
            
            let password = '';
            for (let i = 0; i < length; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            
            document.getElementById('password').textContent = password;
            updateStrength(password);
        }
        
        function updateStrength(password) {
            let strength = 0;
            if (password.length >= 8) strength++;
            if (password.length >= 12) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            const fill = document.getElementById('strengthFill');
            const levels = ['20%', '40%', '60%', '80%', '100%'];
            const colors = ['#e74c3c', '#e67e22', '#f39c12', '#2ecc71', '#27ae60'];
            
            fill.style.width = levels[strength - 1] || '20%';
            fill.style.background = colors[strength - 1] || '#e74c3c';
        }
        
        function copy() {
            const password = document.getElementById('password').textContent;
            if (password === 'Click Generate') return;
            
            navigator.clipboard.writeText(password);
            alert('Copied!');
        }
        
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_open', { tool: 'password-generator' });
        }
    </script>
</body>
</html>
