<body>
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7B5H09J4KB"></script>
    <script>
      window.dataLayer = window.dataLayer || [];

    <div class="container">
        <a href="/" class="back-btn">← 返回首页</a>
        <header>
            <h1>📝 字数统计器</h1>
            <p>实时统计文字数量、字符数、段落数</p>
        </header>
        
        <div class="tool-card">
            <textarea id="textInput" placeholder="在这里输入或粘贴文本..."></textarea>
            
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="charCount">0</div>
                    <div class="stat-label">字符数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="wordCount">0</div>
                    <div class="stat-label">词数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="lineCount">0</div>
                    <div class="stat-label">行数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="paraCount">0</div>
                    <div class="stat-label">段落数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="ChineseCount">0</div>
                    <div class="stat-label">中文字</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="readTime">0</div>
                    <div class="stat-label">分钟阅读</div>
                </div>
            </div>
            
            <div style="text-align: center; margin-top: 30px;">
                <button class="btn" id="clearBtn">清空</button>
                <button class="btn" id="copyBtn">复制</button>
            </div>
        </div>
        
        <footer>
            <p>© 2026 Multi Tools | 免费在线工具集</p>
        </footer>
    </div>
    
    <script>
        const textInput = document.getElementById('textInput');
        const charCount = document.getElementById('charCount');
        const wordCount = document.getElementById('wordCount');
        const lineCount = document.getElementById('lineCount');
        const paraCount = document.getElementById('paraCount');
        const ChineseCount = document.getElementById('ChineseCount');
        const readTime = document.getElementById('readTime');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        
        textInput.addEventListener('input', () => {
            const text = textInput.value;
            
            charCount.textContent = text.length;
            wordCount.textContent = text.trim() ? text.trim().split(/\s+/).length : 0;
            lineCount.textContent = text ? text.split(/\n/).length : 0;
            paraCount.textContent = text.trim() ? text.trim().split(/\n\s*\n/).length : 0;
            ChineseCount.textContent = (text.match(/[\u4e00-\u9fa5]/g) || []).length;
            readTime.textContent = Math.ceil(text.length / 500);
        });
        
        clearBtn.addEventListener('click', () => {
            textInput.value = '';
            textInput.dispatchEvent(new Event('input'));
        });
        
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(textInput.value).then(() => {
                const original = copyBtn.textContent;
                copyBtn.textContent = '✓ 已复制';
                setTimeout(() => copyBtn.textContent = original, 2000);
            });
        });
    </script>
