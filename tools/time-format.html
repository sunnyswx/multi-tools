<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Time Format Multi Tools</title> <meta name="description" content=""> <!-- GA4 --> <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script> <script> window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'G-L7GQFYBWB6'); </script> <style> * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; } .container { max-width: 800px; margin: 0 auto; } header { text-align: center; padding: 40px 20px; color: white; } header h1 { font-size: 2.5rem; margin-bottom: 10px; } .back-btn { display: inline-block; margin-bottom: 20px; padding: 10px 20px; background: rgba(255,255,255,0.2); color: white; text-decoration: none; border-radius: 25px; transition: all 0.3s; } .back-btn:hover { background: rgba(255,255,255,0.3); transform: translateY(-2px); } .tool-content { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); } .convert-type { margin-bottom: 30px; padding-bottom: 30px; border-bottom: 1px solid #e0e0e0; } .convert-type:last-child { border-bottom: none; } .convert-type h3 { margin-bottom: 15px; color: #333; } .input-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; } .input-row input, .input-row select { flex: 1; min-width: 150px; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; } .input-row input:focus, .input-row select:focus { outline: none; border-color: #667eea; } .btn { display: inline-block; padding: 12px 30px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; transition: all 0.3s; margin: 10px 5px; } .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); } .result { margin-top: 15px; padding: 15px; background: #f8f9fa; border-radius: 10px; border-left: 4px solid #667eea; display: none; word-break: break-all; } .result.show { display: block; } .result-value { font-size: 1.3rem; color: #667eea; font-weight: bold; } .copy-btn { margin-left: 10px; padding: 5px 15px; background: #2ecc71; color: white; border: none; border-radius: 15px; cursor: pointer; font-size: 14px; } .copy-btn:hover { background: #27ae60; } </style> </head> <body> <div class="container"> <a href="/" class="back-btn">← </a> <header> <h1>🕐 </h1> <p></p> </header> <main class="tool-content"> <div class="convert-type"> <h3>1. → </h3> <div class="input-row"> <input type="number" id="timestamp_input" placeholder="，：1692345600"> <select id="timestamp_format"> <option value="YYYY-MM-DD HH:mm:ss">YYYY-MM-DD HH:mm:ss</option> <option value="YYYY/MM/DD HH:mm">YYYY/MM/DD HH:mm</option> <option value="YYYYMMDD HH:mm">YYYYMMDD HH:mm</option> <option value="MM-DD-YYYY HH:mm:ss">MM-DD-YYYY HH:mm:ss</option> </select> </div> <button class="btn" onclick="timestampToFormat()"></button> <div id="result1" class="result"> <span class="result-value" id="result1_value">--</span> <button class="copy-btn" onclick="copyResult('result1_value')"></button> </div> </div> <div class="convert-type"> <h3>2. → </h3> <div class="input-row"> <input type="text" id="format_input" placeholder="，：2023-08-19 12:00:00"> <select id="format_type"> <option value="YYYY-MM-DD HH:mm:ss">YYYY-MM-DD HH:mm:ss</option> <option value="YYYY/MM/DD HH:mm">YYYY/MM/DD HH:mm</option> <option value="MM-DD-YYYY HH:mm:ss">MM-DD-YYYY HH:mm:ss</option> </select> </div> <button class="btn" onclick="formatToTimestamp()"></button> <div id="result2" class="result"> <span class="result-value" id="result2_value">--</span> <button class="copy-btn" onclick="copyResult('result2_value')"></button> </div> </div> <div class="convert-type"> <h3>3. </h3> <button class="btn" onclick="getCurrentTimestamp()"></button> <div id="result3" class="result"> <span class="result-value" id="result3_value">--</span> <button class="copy-btn" onclick="copyResult('result3_value')"></button> </div> </div> </main> </div> <script> function timestampToFormat() { const timestamp = document.getElementById('timestamp_input').value; const format = document.getElementById('timestamp_format').value; if (!timestamp) { alert(''); return; } const date = new Date(parseInt(timestamp) * 1000); if (isNaN(date.getTime())) { alert(''); return; } const result = formatDate(date, format); document.getElementById('result1_value').textContent = result; document.getElementById('result1').classList.add('show'); trackToolUsage('time-format'); } function formatToTimestamp() { const input = document.getElementById('format_input').value; const format = document.getElementById('format_type').value; if (!input) { alert(''); return; } const date = parseDate(input, format); if (!date) { alert(''); return; } const timestamp = Math.floor(date.getTime() / 1000); document.getElementById('result2_value').textContent = timestamp; document.getElementById('result2').classList.add('show'); trackToolUsage('time-format'); } function getCurrentTimestamp() { const timestamp = Math.floor(Date.now() / 1000); document.getElementById('result3_value').textContent = timestamp; document.getElementById('result3').classList.add('show'); trackToolUsage('time-format'); } function formatDate(date, format) { const map = { 'YYYY': date.getFullYear(), 'MM': String(date.getMonth() + 1).padStart(2, '0'), 'DD': String(date.getDate()).padStart(2, '0'), 'HH': String(date.getHours()).padStart(2, '0'), 'mm': String(date.getMinutes()).padStart(2, '0'), 'ss': String(date.getSeconds()).padStart(2, '0') }; return format.replace(/YYYY|MM|DD|HH|mm|ss/g, match => map[match]); } function parseDate(input, format) { const parts = input.split(/[-\/\s:]/); let year, month, day, hour = 0, minute = 0, second = 0; if (format.startsWith('MM')) { month = parseInt(parts[0]) - 1; day = parseInt(parts[1]); year = parseInt(parts[2]); } else { year = parseInt(parts[0]); month = parseInt(parts[1]) - 1; day = parseInt(parts[2]); } if (parts.length > 3) { hour = parseInt(parts[3]) || 0; minute = parseInt(parts[4]) || 0; second = parseInt(parts[5]) || 0; } return new Date(year, month, day, hour, minute, second); } function copyResult(elementId) { const text = document.getElementById(elementId).textContent; navigator.clipboard.writeText(text).then(() => { alert(''); }).catch(() => { alert('，'); }); } function trackToolUsage(toolName) { if (typeof gtag !== 'undefined') { gtag('event', 'tool_usage', { 'event_category': 'tools', 'event_label': toolName, 'value': 1 }); } } trackToolUsage('time-format'); </script> </body> </html>
