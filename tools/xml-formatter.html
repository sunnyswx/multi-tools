<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML Formatter - Multi Tools</title>
    <meta name="description" content="Format and validate XML.">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lang.js"></script>
    <script>
        // 自动检测浏览器语言
        (function() {
            const browserLang = navigator.language.split('-')[0];
            const supportedLangs = ['en', 'zh', 'ja', 'ko', 'es', 'fr', 'de', 'ru', 'ar'];
            
            // 检查浏览器语言是否在支持列表中
            let lang = 'en'; // 默认英文
            if (supportedLangs.includes(browserLang)) {
                lang = browserLang;
            }
            
            // 保存到 localStorage
            localStorage.setItem('multi-tools-lang', lang);
            
            console.log('[AutoLang] Browser language:', browserLang, '=> Using:', lang);
        })();
    </script>
    <script>
        // 初始化语言
        document.addEventListener('DOMContentLoaded', function() {
            initLanguage();
            debugTranslations();
        });
    </script>
    <style>
        .tool-container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 30px; }
        .tool-header h1 { color: #333; font-size: 2rem; margin-bottom: 10px; }
        .tool-header p { color: #666; }
        .tool-content { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 300px; padding: 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-family: monospace; font-size: 14px; resize: vertical; box-sizing: border-box; }
        textarea:focus { outline: none; border-color: #667eea; }
        .btn-group { display: flex; gap: 10px; margin: 20px 0; }
        .btn { padding: 12px 30px; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .status { padding: 15px; border-radius: 10px; margin-top: 10px; display: none; }
        .status.success { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        .language-selector { margin-top: 30px; text-align: center; }
        .language-selector select { padding: 10px 20px; font-size: 16px; border: none; border-radius: 25px; background: #667eea; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn" data-i18n="common.back_to_home">← Back to Home</a>
        <div class="tool-container">
            <div class="tool-header">
                <h1>📄 XML Formatter</h1>
                <p>Format and validate XML</p>
            </div>
            <div class="tool-content">
                <textarea id="xmlInput" placeholder="Paste XML here..."><root>
  <user id="1">
    <name>John</name>
    <email>john@example.com</email>
  </user>
  <user id="2">
    <name>Jane</name>
    <email>jane@example.com</email>
  </user>
</root></textarea>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="formatXML()">Format</button>
                    <button class="btn btn-primary" onclick="minifyXML()">Minify</button>
                    <button class="btn btn-secondary" onclick="validateXML()">Validate</button>
                    <button class="btn btn-secondary" onclick="copyXML()">Copy</button>
                </div>
                <div class="status" id="status"></div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getLanguage();
            applyLanguage(lang);
        });
        
        function formatXML() {
            try {
                const xml = document.getElementById('xmlInput').value;
                const parser = new DOMParser();
                const doc = parser.parseFromString(xml, 'text/xml');
                
                const err = doc.getElementsByTagName('parsererror');
                if (err.length > 0) {
                    throw new Error('Invalid XML');
                }
                
                const serializer = new XMLSerializer();
                let formatted = serializer.serializeToString(doc);
                
                // Pretty print
                formatted = formatted.replace(/></g, '>\n<').replace(/\n\s*\n/g, '\n');
                
                document.getElementById('xmlInput').value = formatted;
                showStatus('Formatted successfully!', 'success');
            } catch (e) {
                showStatus('Error: ' + e.message, 'error');
            }
        }
        
        function minifyXML() {
            const xml = document.getElementById('xmlInput').value;
            const minified = xml.replace(/\s+/g, ' ').trim();
            document.getElementById('xmlInput').value = minified;
            showStatus('Minified successfully!', 'success');
        }
        
        function validateXML() {
            try {
                const xml = document.getElementById('xmlInput').value;
                const parser = new DOMParser();
                const doc = parser.parseFromString(xml, 'text/xml');
                
                const err = doc.getElementsByTagName('parsererror');
                if (err.length > 0) {
                    throw new Error('XML is invalid');
                }
                
                showStatus('XML is valid!', 'success');
            } catch (e) {
                showStatus('Validation error: ' + e.message, 'error');
            }
        }
        
        function copyXML() {
            const output = document.getElementById('xmlInput');
            output.select();
            navigator.clipboard.writeText(output.value);
            alert('Copied!');
        }
        
        function showStatus(msg, type) {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.className = 'status ' + type;
            status.style.display = 'block';
            setTimeout(() => { status.style.display = 'none'; }, 3000);
        }
        
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_open', { tool: 'xml-formatter' });
        }
    </script>
</body>
</html>
