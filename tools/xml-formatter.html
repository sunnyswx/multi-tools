body> <div class="container"> <a href="/" class="back-btn">← Back to Home</a> <header> <h1>📄 XML Formatter</h1> <p>Format, validate and beautify XML data</p> </header> <main class="tool-content"> <div id="message" class="message"></div> <div class="editor-container"> <div class="editor-box"> <label>Input XML</label> <textarea id="inputXml" placeholder="<root> <item>Value</item> </root>"></textarea> </div> <div class="editor-box"> <label>Formatted Output</label> <textarea id="outputXml" readonly placeholder="Formatted XML will appear here..."></textarea> </div> </div> <div class="btn-group"> <button class="btn btn-primary" onclick="formatXML()">✨ Format</button> <button class="btn btn-primary" onclick="minifyXML()">📦 Minify</button> <button class="btn btn-secondary" onclick="validateXML()">✅ Validate</button> <button class="btn btn-secondary" onclick="copyOutput()">📋 Copy</button> <button class="btn btn-secondary" onclick="clearAll()">🗑️ Clear</button> </div> </main> </div> <script> function formatXML() { const input = document.getElementById('inputXml').value.trim(); if (!input) { showMessage('Please enter XML data', 'error'); return; } try { const parser = new DOMParser(); const xmlDoc = parser.parseFromString(input, 'text/xml'); const parseError = xmlDoc.getElementsByTagName('parsererror'); if (parseError.length > 0) { showMessage('Invalid XML: ' + parseError[0].textContent, 'error'); return; } const serializer = new XMLSerializer(); let formatted = serializer.serializeToString(xmlDoc); // Pretty print formatted = formatted.replace(/></g, '>\n<'); formatted = formatted.replace(/(\n)/g, '\n '); formatted = formatted.replace(/>\n <//g, '></'); document.getElementById('outputXml').value = formatted; showMessage('XML formatted successfully!', 'success'); } catch (e) { showMessage('Error: ' + e.message, 'error'); } } function minifyXML() { const input = document.getElementById('inputXml').value.trim(); if (!input) { showMessage('Please enter XML data', 'error'); return; } try { const parser = new DOMParser(); const xmlDoc = parser.parseFromString(input, 'text/xml'); const parseError = xmlDoc.getElementsByTagName('parsererror'); if (parseError.length > 0) { showMessage('Invalid XML: ' + parseError[0].textContent, 'error'); return; } const serializer = new XMLSerializer(); const minified = serializer.serializeToString(xmlDoc).replace(/\s+/g, ' ').trim(); document.getElementById('outputXml').value = minified; showMessage('XML minified successfully!', 'success'); } catch (e) { showMessage('Error: ' + e.message, 'error'); } } function validateXML() { const input = document.getElementById('inputXml').value.trim(); if (!input) { showMessage('Please enter XML data', 'error'); return; } try { const parser = new DOMParser(); const xmlDoc = parser.parseFromString(input, 'text/xml'); const parseError = xmlDoc.getElementsByTagName('parsererror'); if (parseError.length > 0) { showMessage('Invalid XML: ' + parseError[0].textContent, 'error'); } else { showMessage('Valid XML!', 'success'); } } catch (e) { showMessage('Error: ' + e.message, 'error'); } } function copyOutput() { const output = document.getElementById('outputXml').value; if (!output) { showMessage('No output to copy', 'error'); return; } navigator.clipboard.writeText(output).then(() => { showMessage('Copied to clipboard!', 'success'); }); } function clearAll() { document.getElementById('inputXml').value = ''; document.getElementById('outputXml').value = ''; hideMessage(); } function showMessage(text, type) { const msg = document.getElementById('message'); msg.textContent = text; msg.className = 'message ' + type; setTimeout(hideMessage, 3000); } function hideMessage() { document.getElementById('message').className = 'message'; } // Track usage if (typeof gtag !== 'undefined') { gtag('event', 'tool_usage', { 'event_category': 'tools', 'event_label': 'xml-formatter', 'value': 1 }); } </script> </body> </html>
