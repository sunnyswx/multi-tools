<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS渐变生成器 - 免费在线工具 | Multi Tools</title>
    <meta name="description" content="CSS渐变生成器，在线生成渐变代码">
    
    <!-- GA4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            padding: 40px 20px;
            color: white;
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        .tool-content {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .preview {
            width: 100%;
            height: 200px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
        }
        .control-group label {
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        .control-group input[type="color"] {
            width: 100%;
            height: 40px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
        }
        .control-group input[type="range"] {
            width: 100%;
        }
        .control-group select {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px 5px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .code-output {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            word-break: break-all;
            margin-top: 20px;
        }
        .copy-btn {
            margin-top: 10px;
            padding: 8px 20px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 14px;
        }
        .copy-btn:hover {
            background: #27ae60;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-btn">← 返回首页</a>
        
        <header>
            <h1>🌈 CSS渐变生成器</h1>
            <p>生成CSS渐变代码，支持多种类型</p>
        </header>
        
        <main class="tool-content">
            <div id="preview" class="preview"></div>
            
            <div class="controls">
                <div class="control-group">
                    <label>渐变类型</label>
                    <select id="gradientType" onchange="updateGradient()">
                        <option value="linear">线性渐变</option>
                        <option value="radial">径向渐变</option>
                    </select>
                </div>
                
                <div class="control-group" id="angleGroup">
                    <label>角度：<span id="angleValue">135</span>°</label>
                    <input type="range" id="angle" min="0" max="360" value="135" oninput="updateAngle(); updateGradient();">
                </div>
                
                <div class="control-group">
                    <label>颜色1</label>
                    <input type="color" id="color1" value="#667eea" onchange="updateGradient()">
                </div>
                
                <div class="control-group">
                    <label>颜色2</label>
                    <input type="color" id="color2" value="#764ba2" onchange="updateGradient()">
                </div>
                
                <div class="control-group">
                    <label>颜色3（可选）</label>
                    <input type="color" id="color3" value="#f093fb" onchange="updateGradient()">
                </div>
                
                <div class="control-group">
                    <label>颜色3位置</label>
                    <input type="range" id="color3Stop" min="0" max="100" value="100" oninput="updateColor3Stop(); updateGradient();">
                </div>
            </div>
            
            <button class="btn" onclick="randomGradient()">随机渐变</button>
            <button class="btn btn-secondary" onclick="resetGradient()">重置</button>
            
            <div class="code-output" id="codeOutput"></div>
            <button class="copy-btn" onclick="copyCode()">复制代码</button>
        </main>
    </div>
    
    <script>
        function updateAngle() {
            document.getElementById('angleValue').textContent = document.getElementById('angle').value;
        }
        
        function updateColor3Stop() {
            // 颜色3位置更新
        }
        
        function updateGradient() {
            const type = document.getElementById('gradientType').value;
            const angle = document.getElementById('angle').value;
            const color1 = document.getElementById('color1').value;
            const color2 = document.getElementById('color2').value;
            const color3 = document.getElementById('color3').value;
            const color3Stop = document.getElementById('color3Stop').value;
            
            let gradient = '';
            
            if (type === 'linear') {
                gradient = `linear-gradient(${angle}deg, ${color1} 0%, ${color2} 50%, ${color3} ${color3Stop}%)`;
            } else {
                gradient = `radial-gradient(circle, ${color1} 0%, ${color2} 50%, ${color3} ${color3Stop}%)`;
            }
            
            document.getElementById('preview').style.background = gradient;
            document.getElementById('codeOutput').textContent = `background: ${gradient};`;
            
            trackToolUsage('gradient-generator');
        }
        
        function randomGradient() {
            const randomColor = () => '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
            
            document.getElementById('color1').value = randomColor();
            document.getElementById('color2').value = randomColor();
            document.getElementById('color3').value = randomColor();
            document.getElementById('angle').value = Math.floor(Math.random() * 360);
            document.getElementById('color3Stop').value = 70 + Math.floor(Math.random() * 30);
            
            updateAngle();
            updateGradient();
        }
        
        function resetGradient() {
            document.getElementById('gradientType').value = 'linear';
            document.getElementById('angle').value = 135;
            document.getElementById('color1').value = '#667eea';
            document.getElementById('color2').value = '#764ba2';
            document.getElementById('color3').value = '#f093fb';
            document.getElementById('color3Stop').value = 100;
            
            updateAngle();
            updateGradient();
        }
        
        function copyCode() {
            const code = document.getElementById('codeOutput').textContent;
            navigator.clipboard.writeText(code).then(() => {
                alert('代码已复制到剪贴板');
            }).catch(() => {
                alert('复制失败，请手动复制');
            });
        }
        
        function trackToolUsage(toolName) {
            if (typeof gtag !== 'undefined') {
                gtag('event', 'tool_usage', {
                    'event_category': 'tools',
                    'event_label': toolName,
                    'value': 1
                });
            }
        }
        
        trackToolUsage('gradient-generator');
        updateGradient();
    </script>
</body>
</html>
