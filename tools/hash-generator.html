    <script>
        async function generateHash(algorithm, data) {
            const dataBuffer = new TextEncoder().encode(data);
            const hashBuffer = await crypto.subtle.digest(algorithm, dataBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }
        
        async function generateAllHashes() {
            const input = document.getElementById('input').value;
            if (!input) {
                ['md5', 'sha1', 'sha256', 'sha512'].forEach(id => {
                    document.getElementById(id).textContent = '等待输入...';
                });
                return;
            }
            
            try {
                document.getElementById('md5').textContent = await generateHash('MD5', input);
                document.getElementById('sha1').textContent = await generateHash('SHA-1', input);
                document.getElementById('sha256').textContent = await generateHash('SHA-256', input);
                document.getElementById('sha512').textContent = await generateHash('SHA-512', input);
            } catch (e) {
                console.error('Hash generation error:', e);
            }
        }
        
        function copyHash(id) {
            const text = document.getElementById(id).textContent;
            if (text && text !== '等待输入...') {
                navigator.clipboard.writeText(text).then(() => {
                    const btn = event.target;
                    const original = btn.textContent;
                    btn.textContent = '✓ 已复制';
                    setTimeout(() => btn.textContent = original, 2000);
                });
            }
        }
        
        document.getElementById('input').addEventListener('input', generateAllHashes);
