        <div class="tool-card">
            <div class="timer-display" id="timerDisplay">00:00:00</div>
            
            <div class="presets">
                <button class="preset-btn" onclick="trackToolUsage('countdown-timer', 'click'); setTimer(60)">1分钟</button>
                <button class="preset-btn" onclick="setTimer(300)">5分钟</button>
                <button class="preset-btn" onclick="setTimer(600)">10分钟</button>
                <button class="preset-btn" onclick="setTimer(900)">15分钟</button>
                <button class="preset-btn" onclick="setTimer(1800)">30分钟</button>
                <button class="preset-btn" onclick="setTimer(3600)">1小时</button>
            </div>
            
            <div class="custom-input">
                <input type="number" id="hoursInput" min="0" max="23" value="0" placeholder="时">
                <label>时</label>
                <input type="number" id="minutesInput" min="0" max="59" value="5" placeholder="分">
                <label>分</label>
                <input type="number" id="secondsInput" min="0" max="59" value="0" placeholder="秒">
                <label>秒</label>
                <button class="preset-btn" onclick="setCustomTimer()">设置</button>
            </div>
            
            <div class="controls">
                <button class="btn" id="startBtn" onclick="startTimer()">开始</button>
                <button class="btn btn-stop" id="stopBtn" onclick="stopTimer()" style="display: none;">暂停</button>
                <button class="btn btn-reset" id="resetBtn" onclick="resetTimer()">重置</button>
            </div>

    <script>
        let timerInterval = null;
        let totalSeconds = 0;
        let remainingSeconds = 0;
        let isRunning = false;
        
        const timerDisplay = document.getElementById('timerDisplay');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        
        function setTimer(seconds) {
            totalSeconds = seconds;
            remainingSeconds = seconds;
            updateDisplay();
        }
        
        function setCustomTimer() {
            const hours = parseInt(document.getElementById('hoursInput').value) || 0;
            const minutes = parseInt(document.getElementById('minutesInput').value) || 0;
            const seconds = parseInt(document.getElementById('secondsInput').value) || 0;
            
            totalSeconds = hours * 3600 + minutes * 60 + seconds;
            remainingSeconds = totalSeconds;
            updateDisplay();
        }
        
        function startTimer() {
            if (remainingSeconds <= 0) return;
            
            isRunning = true;
            timerDisplay.className = 'timer-display running';
            startBtn.style.display = 'none';
            stopBtn.style.display = 'inline-block';
            
            timerInterval = setInterval(() => {
                remainingSeconds--;
                updateDisplay();
                
                if (remainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.className = 'timer-display finished';
                    stopBtn.style.display = 'none';
                    startBtn.style.display = 'inline-block';
                    alert('⏰ 时间到！');
                }
            }, 1000);
        }
        
        function stopTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            timerDisplay.className = 'timer-display paused';
            startBtn.style.display = 'inline-block';
            stopBtn.style.display = 'none';
        }
        
        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            remainingSeconds = totalSeconds;
            timerDisplay.className = 'timer-display';
            startBtn.style.display = 'inline-block';
            stopBtn.style.display = 'none';
            updateDisplay();
        }
        
        function updateDisplay() {
            const hours = Math.floor(remainingSeconds / 3600);
            const minutes = Math.floor((remainingSeconds % 3600) / 60);
            const seconds = remainingSeconds % 60;
            
            timerDisplay.textContent = 
                `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }
        
        // 初始化
        setTimer(300);
