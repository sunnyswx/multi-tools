<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer - Multi Tools</title>
    <meta name="description" content="Set countdown timers.">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lang.js"></script>
    <script>
        // 自动检测浏览器语言
        (function() {
            const browserLang = navigator.language.split('-')[0];
            const supportedLangs = ['en', 'zh', 'ja', 'ko', 'es', 'fr', 'de', 'ru', 'ar'];
            
            // 检查浏览器语言是否在支持列表中
            let lang = 'en'; // 默认英文
            if (supportedLangs.includes(browserLang)) {
                lang = browserLang;
            }
            
            // 保存到 localStorage
            localStorage.setItem('multi-tools-lang', lang);
            
            console.log('[AutoLang] Browser language:', browserLang, '=> Using:', lang);
        })();
    </script>
    <script>
        // 初始化语言
        document.addEventListener('DOMContentLoaded', function() {
            initLanguage();
            debugTranslations();
        });
    </script>
    <style>
        .tool-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 30px; }
        .tool-header h1 { color: #333; font-size: 2rem; margin-bottom: 10px; }
        .tool-header p { color: #666; }
        .tool-content { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        .time-inputs { display: flex; gap: 15px; justify-content: center; }
        .time-input { text-align: center; }
        .time-input input { width: 80px; padding: 15px; font-size: 2rem; text-align: center; border: 2px solid #e0e0e0; border-radius: 10px; }
        .time-input input:focus { outline: none; border-color: #667eea; }
        .time-input label { display: block; margin-top: 8px; color: #666; }
        .timer-display { text-align: center; margin: 40px 0; }
        .time { font-size: 5rem; font-weight: bold; color: #667eea; font-family: monospace; }
        .btn-group { display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 12px 30px; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-stop { background: #e74c3c; color: white; }
        .language-selector { margin-top: 30px; text-align: center; }
        .language-selector select { padding: 10px 20px; font-size: 16px; border: none; border-radius: 25px; background: #667eea; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn" data-i18n="common.back_to_home">← Back to Home</a>
        <div class="tool-container">
            <div class="tool-header">
                <h1>⏲️ Countdown Timer</h1>
                <p>Set countdown timers</p>
            </div>
            <div class="tool-content">
                <div class="input-group">
                    <label>Set Timer:</label>
                    <div class="time-inputs">
                        <div class="time-input">
                            <input type="number" id="hours" value="0" min="0">
                            <label>Hours</label>
                        </div>
                        <div class="time-input">
                            <input type="number" id="minutes" value="5" min="0" max="59">
                            <label>Minutes</label>
                        </div>
                        <div class="time-input">
                            <input type="number" id="seconds" value="0" min="0" max="59">
                            <label>Seconds</label>
                        </div>
                    </div>
                </div>
                <div class="timer-display">
                    <div class="time" id="timer">00:05:00</div>
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="startTimer()">Start</button>
                    <button class="btn btn-secondary" onclick="pauseTimer()">Pause</button>
                    <button class="btn btn-secondary" onclick="resetTimer()">Reset</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        let timer = null;
        let totalSeconds = 300;
        let isRunning = false;
        
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getLanguage();
            applyLanguage(lang);
            updateDisplay();
        });
        
        function startTimer() {
            if (isRunning) return;
            
            isRunning = true;
            timer = setInterval(() => {
                totalSeconds--;
                updateDisplay();
                
                if (totalSeconds <= 0) {
                    clearInterval(timer);
                    timer = null;
                    isRunning = false;
                    alert('Time is up!');
                }
            }, 1000);
        }
        
        function pauseTimer() {
            if (timer) {
                clearInterval(timer);
                timer = null;
                isRunning = false;
            }
        }
        
        function resetTimer() {
            pauseTimer();
            totalSeconds = parseInt(document.getElementById('hours').value) * 3600 +
                          parseInt(document.getElementById('minutes').value) * 60 +
                          parseInt(document.getElementById('seconds').value);
            updateDisplay();
        }
        
        function updateDisplay() {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            
            document.getElementById('timer').textContent = 
                String(hours).padStart(2, '0') + ':' +
                String(minutes).padStart(2, '0') + ':' +
                String(seconds).padStart(2, '0');
        }
        
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_open', { tool: 'countdown-timer' });
        }
    </script>
</body>
</html>
