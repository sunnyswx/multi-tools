    <div class="container">

        <header>
            <h1>⏱️ 倒计时器</h1>
            <p>设置倒计时，准时提醒</p>
        </header>
        
        <div class="tool-card">
            <div class="timer-display" id="timerDisplay">00:05:00</div>
            
            <div class="presets">
                <button class="preset-btn" onclick="setTimer(60)">1分钟</button>
                <button class="preset-btn" onclick="setTimer(300)">5分钟</button>
                <button class="preset-btn" onclick="setTimer(600)">10分钟</button>
                <button class="preset-btn" onclick="setTimer(900)">15分钟</button>
                <button class="preset-btn" onclick="setTimer(1800)">30分钟</button>
                <button class="preset-btn" onclick="setTimer(3600)">1小时</button>
            </div>
            
            <div class="custom-input">
                <label>时 <input type="number" id="hoursInput" min="0" max="23" value="0"></label>
                <label>分 <input type="number" id="minutesInput" min="0" max="59" value="5"></label>
                <label>秒 <input type="number" id="secondsInput" min="0" max="59" value="0"></label>
            </div>
            
            <div class="controls">
                <button class="btn" id="setBtn" onclick="setTimer()">设置</button>
                <button class="btn" id="startBtn" onclick="startTimer()">开始</button>
                <button class="btn btn-stop" id="stopBtn" onclick="stopTimer()" style="display: none;">停止</button>
                <button class="btn btn-reset" onclick="resetTimer()">重置</button>
            </div>
        </div>

        <div class="feedback-section">
            <h3>💬 问题反馈</h3>
            <p style="color: #666; margin-bottom: 20px;">发现bug或使用问题？请告诉我们，我们会尽快修复！</p>
            
            <form class="feedback-form" id="feedbackForm" onsubmit="submitFeedback(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="feedbackName">您的姓名（可选）</label>
                        <input type="text" id="feedbackName" placeholder="输入您的姓名">
                    </div>
                    <div class="form-group">
                        <label for="feedbackEmail">您的邮箱（可选）</label>
                        <input type="email" id="feedbackEmail" placeholder="input@example.com">
                    </div>
                </div>

                    <label for="feedbackType">问题类型</label>
                    <select id="feedbackType" style="width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px;">
                        <option value="bug">🐛 Bug报告</option>
                        <option value="feature">✨ 功能建议</option>
                        <option value="performance">⚡ 性能问题</option>
                        <option value="ui">🎨 界面问题</option>
                        <option value="other">📝 其他</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="feedbackMessage">问题描述 *</label>
                    <textarea id="feedbackMessage" placeholder="请详细描述您遇到的问题或建议..." required></textarea>
                </div>
                
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="feedbackBrowser">
                        包含浏览器信息（帮助快速定位问题）

                <button type="submit" class="btn-submit">提交反馈</button>

                ❌ 提交失败，请稍后重试。
            </div>

    <script>
        // Google Analytics 4
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-L7GQFYBWB6');
        
        function trackToolUsage(toolName, action) {
            if (typeof gtag !== 'undefined') {
                gtag('event', 'tool_usage', {
                    'event_category': 'Tool',
                    'event_label': toolName,
                    'value': action
                });
            }
        }
        
        // 倒计时器逻辑
        let countdownTimer = null;
        let totalSeconds = 300;
        let remainingSeconds = 300;
        let isRunning = false;
        
        const timerDisplay = document.getElementById('timerDisplay');
        const hoursInput = document.getElementById('hoursInput');
        const minutesInput = document.getElementById('minutesInput');
        const secondsInput = document.getElementById('secondsInput');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        
        function setTimer(seconds) {
            if (seconds) {
                totalSeconds = seconds;
                remainingSeconds = seconds;
            } else {
                const h = parseInt(hoursInput.value) || 0;
                const m = parseInt(minutesInput.value) || 0;
                const s = parseInt(secondsInput.value) || 0;
                totalSeconds = h * 3600 + m * 60 + s;
                remainingSeconds = totalSeconds;
            }
            
            updateDisplay();
            timerDisplay.className = 'timer-display';
            trackToolUsage('countdown-timer', 'set');
        }
        
        function startTimer() {
            if (isRunning || remainingSeconds <= 0) return;
            
            isRunning = true;
            startBtn.style.display = 'none';
            stopBtn.style.display = 'inline-block';
            timerDisplay.className = 'timer-display running';
            
            countdownTimer = setInterval(() => {
                remainingSeconds--;
                updateDisplay();
                
                if (remainingSeconds <= 0) {
                    clearInterval(countdownTimer);
                    timerDisplay.className = 'timer-display finished';
                    isRunning = false;
                    startBtn.style.display = 'none';
                    stopBtn.style.display = 'none';
                    alert('⏰ 时间到！');
                    trackToolUsage('countdown-timer', 'finish');
                }
            }, 1000);
            
            trackToolUsage('countdown-timer', 'start');
        }
        
        function stopTimer() {
            if (!isRunning) return;
            
            clearInterval(countdownTimer);
            isRunning = false;
            startBtn.style.display = 'inline-block';
            stopBtn.style.display = 'none';
            timerDisplay.className = 'timer-display paused';
            trackToolUsage('countdown-timer', 'stop');
        }
        
        function resetTimer() {
            clearInterval(countdownTimer);
            isRunning = false;
            remainingSeconds = totalSeconds;
            updateDisplay();
            timerDisplay.className = 'timer-display';
            startBtn.style.display = 'inline-block';
            stopBtn.style.display = 'none';
            trackToolUsage('countdown-timer', 'reset');
        }
        
        function updateDisplay() {
            const h = Math.floor(remainingSeconds / 3600);
            const m = Math.floor((remainingSeconds % 3600) / 60);
            const s = remainingSeconds % 60;
            
            timerDisplay.textContent = 
                String(h).padStart(2, '0') + ':' +
                String(m).padStart(2, '0') + ':' +
                String(s).padStart(2, '0');
        }
        
        // 初始化显示
        updateDisplay();
        
        // 问题反馈功能
        function submitFeedback(e) {
            e.preventDefault();
            
            const name = document.getElementById('feedbackName').value.trim();
            const email = document.getElementById('feedbackEmail').value.trim();
            const type = document.getElementById('feedbackType').value;
            const message = document.getElementById('feedbackMessage').value.trim();
            const includeBrowser = document.getElementById('feedbackBrowser').checked;
            
            if (!message) {
                alert('请填写问题描述！');
                return;
            }
            
            const feedbackData = {
                tool: 'countdown-timer',
                timestamp: new Date().toISOString(),
                name: name || '匿名用户',
                email: email || '',
                type: type,
                message: message,
                browser: includeBrowser ? navigator.userAgent : ''
            };
            
            try {
                const feedbacks = JSON.parse(localStorage.getItem('feedbacks') || '[]');
                feedbacks.push(feedbackData);
                localStorage.setItem('feedbacks', JSON.stringify(feedbacks));
                
                document.getElementById('feedbackSuccess').style.display = 'block';
                document.getElementById('feedbackError').style.display = 'none';
                
                document.getElementById('feedbackForm').reset();
                
                trackToolUsage('countdown-timer', 'feedback');
                
                setTimeout(() => {
                    document.getElementById('feedbackSuccess').style.display = 'none';
                }, 3000);
            } catch (error) {
                document.getElementById('feedbackError').style.display = 'block';
                document.getElementById('feedbackSuccess').style.display = 'none';
                console.error('反馈提交失败:', error);
            }
        }
    
        // 追踪工具使用
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                trackToolUsage('countdown-timer', 'click');
            });
        });
</script>
