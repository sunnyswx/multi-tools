<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer - Free Online Tool | Multi Tools</title>
    <meta name="description" content="Free online countdown timer. Set custom time for exams, cooking, meetings. Support multiple timers and alerts.">
    <meta name="keywords" content="countdown, timer, stopwatch, online timer, countdown timer">
    
    <!-- GA4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; padding: 40px 20px; color: white; }
        header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .back-btn { display: inline-block; margin-bottom: 20px; padding: 10px 20px; background: rgba(255,255,255,0.2); color: white; text-decoration: none; border-radius: 25px; }
        .tool-content { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .timer-display { font-size: 5rem; text-align: center; color: #667eea; font-weight: bold; margin: 40px 0; font-family: 'Courier New', monospace; }
        .input-group { display: flex; gap: 10px; justify-content: center; margin-bottom: 30px; }
        .input-group input { width: 80px; padding: 15px; border: 2px solid #e0e0e0; border-radius: 10px; text-align: center; font-size: 1.5rem; }
        .input-group input:focus { outline: none; border-color: #667eea; }
        .input-group label { display: block; text-align: center; margin-top: 5px; color: #666; }
        .btn { padding: 15px 40px; border: none; border-radius: 25px; cursor: pointer; font-size: 18px; transition: all 0.3s; margin: 10px; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover { background: #e0e0e0; }
        .presets { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 30px; }
        .preset-btn { padding: 10px 20px; background: #f8f9fa; border: 2px solid #e0e0e0; border-radius: 20px; cursor: pointer; transition: all 0.3s; }
        .preset-btn:hover { border-color: #667eea; background: #e8eaff; }
        @media (max-width: 768px) { .timer-display { font-size: 3rem; } .input-group input { width: 60px; font-size: 1rem; } }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-btn">← Back to Home</a>
        <header>
            <h1>⏱️ Countdown Timer</h1>
            <p>Set custom countdown timers for any occasion</p>
        </header>
        <main class="tool-content">
            <div class="presets">
                <button class="preset-btn" onclick="setPreset(1, 0)">1 min</button>
                <button class="preset-btn" onclick="setPreset(5, 0)">5 min</button>
                <button class="preset-btn" onclick="setPreset(10, 0)">10 min</button>
                <button class="preset-btn" onclick="setPreset(25, 0)">25 min</button>
                <button class="preset-btn" onclick="setPreset(30, 0)">30 min</button>
                <button class="preset-btn" onclick="setPreset(60, 0)">1 hour</button>
            </div>
            
            <div class="input-group">
                <div>
                    <input type="number" id="hours" min="0" max="99" value="0">
                    <label>Hours</label>
                </div>
                <div>
                    <input type="number" id="minutes" min="0" max="59" value="5">
                    <label>Minutes</label>
                </div>
                <div>
                    <input type="number" id="seconds" min="0" max="59" value="0">
                    <label>Seconds</label>
                </div>
            </div>
            
            <div class="timer-display" id="display">00:05:00</div>
            
            <div style="text-align: center;">
                <button class="btn btn-primary" id="startBtn" onclick="startTimer()">▶️ Start</button>
                <button class="btn btn-secondary" onclick="pauseTimer()">⏸️ Pause</button>
                <button class="btn btn-secondary" onclick="resetTimer()">🔄 Reset</button>
            </div>
        </main>
    </div>
    
    <script>
        let timerInterval = null;
        let totalSeconds = 300;
        let isRunning = false;
        
        function updateDisplay() {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            document.getElementById('display').textContent = 
                `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }
        
        function startTimer() {
            if (isRunning) return;
            isRunning = true;
            timerInterval = setInterval(() => {
                if (totalSeconds > 0) {
                    totalSeconds--;
                    updateDisplay();
                } else {
                    clearInterval(timerInterval);
                    isRunning = false;
                    alert('⏰ Time is up!');
                }
            }, 1000);
        }
        
        function pauseTimer() {
            clearInterval(timerInterval);
            isRunning = false;
        }
        
        function resetTimer() {
            pauseTimer();
            const h = parseInt(document.getElementById('hours').value) || 0;
            const m = parseInt(document.getElementById('minutes').value) || 0;
            const s = parseInt(document.getElementById('seconds').value) || 0;
            totalSeconds = h * 3600 + m * 60 + s;
            updateDisplay();
        }
        
        function setPreset(minutes, seconds) {
            document.getElementById('hours').value = 0;
            document.getElementById('minutes').value = minutes;
            document.getElementById('seconds').value = seconds;
            totalSeconds = minutes * 60 + seconds;
            updateDisplay();
            resetTimer();
        }
        
        // Initialize
        updateDisplay();
        
        // Track usage
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_usage', { 'event_category': 'tools', 'event_label': 'countdown-timer', 'value': 1 });
        }
    </script>
</body>
</html>
