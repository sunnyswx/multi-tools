<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时区转换器 - 免费在线时区转换器工具 | Multi Tools</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; padding: 40px 20px; color: white; }
        header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        header p { font-size: 1.2rem; opacity: 0.9; }
        .back-btn { display: inline-block; margin-bottom: 20px; padding: 10px 20px; background: rgba(255,255,255,0.2); color: white; text-decoration: none; border-radius: 25px; }
        .back-btn:hover { background: rgba(255,255,255,0.3); }
        .tool-card { background: white; border-radius: 20px; padding: 40px; margin: 20px 0; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .timezone-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .timezone-card { background: #f8f9fa; padding: 25px; border-radius: 15px; text-align: center; }
        .timezone-card h3 { color: #333; margin-bottom: 15px; font-size: 1.1rem; }
        .timezone-time { font-size: 2rem; font-weight: bold; color: #667eea; margin: 15px 0; }
        .timezone-date { color: #666; font-size: 0.9rem; }
        select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 1rem; margin-top: 10px; }
        select:focus { outline: none; border-color: #667eea; }
        footer { text-align: center; padding: 40px 20px; color: white; opacity: 0.8; }
        
        /* 问题反馈样式 */
        .feedback-section {
            margin-top: 40px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 15px;
        }
        
        .feedback-section h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }
        
        .feedback-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .feedback-form textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
        }
        
        .feedback-form textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .feedback-form .form-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .feedback-form .form-group {
            flex: 1;
            min-width: 200px;
        }
        
        .feedback-form label {
            display: block;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .feedback-form input[type="text"],
        .feedback-form input[type="email"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .feedback-form input[type="text"]:focus,
        .feedback-form input[type="email"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .feedback-form .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            align-self: flex-start;
        }
        
        .feedback-form .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .feedback-success {
            background: #d1fae5;
            color: #065f46;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }
        
        .feedback-error {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-btn">← 返回首页</a>
        <header>
            <h1>🕐 时区转换器</h1>
            <p>在线时区转换，查看全球主要城市时间</p>
        </header>
        
        <div class="tool-card">
            <div class="timezone-grid" id="timezoneGrid">
                <!-- 时区卡片将在这里动态生成 -->
            </div>
        </div>
        
        <!-- 问题反馈区域 -->
        <div class="feedback-section">
            <h3>💬 问题反馈</h3>
            <p style="color: #666; margin-bottom: 20px;">发现bug或使用问题？请告诉我们，我们会尽快修复！</p>
            
            <form class="feedback-form" id="feedbackForm" onsubmit="submitFeedback(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="feedbackName">您的姓名（可选）</label>
                        <input type="text" id="feedbackName" placeholder="输入您的姓名">
                    </div>
                    <div class="form-group">
                        <label for="feedbackEmail">您的邮箱（可选）</label>
                        <input type="email" id="feedbackEmail" placeholder="input@example.com">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="feedbackType">问题类型</label>
                    <select id="feedbackType" style="width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px;">
                        <option value="bug">🐛 Bug报告</option>
                        <option value="feature">✨ 功能建议</option>
                        <option value="performance">⚡ 性能问题</option>
                        <option value="ui">🎨 界面问题</option>
                        <option value="other">📝 其他</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="feedbackMessage">问题描述 *</label>
                    <textarea id="feedbackMessage" placeholder="请详细描述您遇到的问题或建议..." required></textarea>
                </div>
                
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="feedbackBrowser">
                        包含浏览器信息（帮助快速定位问题）
                    </label>
                </div>
                
                <button type="submit" class="btn-submit">提交反馈</button>
            </form>
            
            <div class="feedback-success" id="feedbackSuccess">
                ✅ 感谢您的反馈！我们会尽快处理。
            </div>
            
            <div class="feedback-error" id="feedbackError">
                ❌ 提交失败，请稍后重试。
            </div>
        </div>
        
        <footer>
            <p>© 2026 Multi Tools - 免费在线工具集</p>
        </footer>
    </div>
    
    <script>
        // Google Analytics 4
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-L7GQFYBWB6');
        
        function trackToolUsage(toolName, action) {
            if (typeof gtag !== 'undefined') {
                gtag('event', 'tool_usage', {
                    'event_category': 'Tool',
                    'event_label': toolName,
                    'value': action
                });
            }
        }
        
        // 时区数据
        const timezones = [
            { name: '北京时间', tz: 'Asia/Shanghai' },
            { name: '东京时间', tz: 'Asia/Tokyo' },
            { name: '首尔时间', tz: 'Asia/Seoul' },
            { name: '新加坡时间', tz: 'Asia/Singapore' },
            { name: '伦敦时间', tz: 'Europe/London' },
            { name: '巴黎时间', tz: 'Europe/Paris' },
            { name: '纽约时间', tz: 'America/New_York' },
            { name: '洛杉矶时间', tz: 'America/Los_Angeles' },
            { name: '悉尼时间', tz: 'Australia/Sydney' },
            { name: '迪拜时间', tz: 'Asia/Dubai' }
        ];
        
        // 更新时间
        function updateTime() {
            const grid = document.getElementById('timezoneGrid');
            grid.innerHTML = '';
            
            const now = new Date();
            
            timezones.forEach(tz => {
                const options = { 
                    timeZone: tz.tz, 
                    hour: '2-digit', 
                    minute: '2-digit', 
                    second: '2-digit',
                    hour12: false
                };
                const dateOptions = { 
                    timeZone: tz.tz, 
                    year: 'numeric', 
                    month: '2-digit', 
                    day: '2-digit'
                };
                
                const timeStr = now.toLocaleTimeString('zh-CN', options);
                const dateStr = now.toLocaleDateString('zh-CN', dateOptions);
                
                const card = document.createElement('div');
                card.className = 'timezone-card';
                card.innerHTML = `
                    <h3>${tz.name}</h3>
                    <div class="timezone-time">${timeStr}</div>
                    <div class="timezone-date">${dateStr}</div>
                `;
                grid.appendChild(card);
            });
        }
        
        // 每秒更新时间
        updateTime();
        setInterval(updateTime, 1000);
        
        // 问题反馈功能
        function submitFeedback(e) {
            e.preventDefault();
            
            const name = document.getElementById('feedbackName').value.trim();
            const email = document.getElementById('feedbackEmail').value.trim();
            const type = document.getElementById('feedbackType').value;
            const message = document.getElementById('feedbackMessage').value.trim();
            const includeBrowser = document.getElementById('feedbackBrowser').checked;
            
            if (!message) {
                alert('请填写问题描述！');
                return;
            }
            
            const feedbackData = {
                tool: 'timezone-converter',
                timestamp: new Date().toISOString(),
                name: name || '匿名用户',
                email: email || '',
                type: type,
                message: message,
                browser: includeBrowser ? navigator.userAgent : ''
            };
            
            try {
                const feedbacks = JSON.parse(localStorage.getItem('feedbacks') || '[]');
                feedbacks.push(feedbackData);
                localStorage.setItem('feedbacks', JSON.stringify(feedbacks));
                
                document.getElementById('feedbackSuccess').style.display = 'block';
                document.getElementById('feedbackError').style.display = 'none';
                
                document.getElementById('feedbackForm').reset();
                
                trackToolUsage('timezone-converter', 'feedback');
                
                setTimeout(() => {
                    document.getElementById('feedbackSuccess').style.display = 'none';
                }, 3000);
            } catch (error) {
                document.getElementById('feedbackError').style.display = 'block';
                document.getElementById('feedbackSuccess').style.display = 'none';
                console.error('反馈提交失败:', error);
            }
        }
    </script>
</body>
</html>
