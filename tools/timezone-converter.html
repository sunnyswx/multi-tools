<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Timezone ConverterFree Online Tool | Multi Tools</title> <meta name="description" content="Free online timezone converter. Convert between different timezones instantly. Support all major timezones."> <meta name="keywords" content="timezone, converter, time zone, world clock, online tool"> <!-- GA4 --> <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script> <script> window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'G-L7GQFYBWB6'); </script> <style> * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; } .container { max-width: 1000px; margin: 0 auto; } header { text-align: center; padding: 40px 20px; color: white; } header h1 { font-size: 2.5rem; margin-bottom: 10px; } .back-btn { display: inline-block; margin-bottom: 20px; padding: 10px 20px; background: rgba(255,255,255,0.2); color: white; text-decoration: none; border-radius: 25px; } .tool-content { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); } .converter-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 30px; align-items: start; margin-bottom: 30px; } .timezone-box { background: #f8f9fa; padding: 30px; border-radius: 15px; } .timezone-box h3 { margin-bottom: 20px; color: #333; } .timezone-box select, .timezone-box input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; margin-bottom: 15px; font-size: 16px; } .timezone-box select:focus, .timezone-box input:focus { outline: none; border-color: #667eea; } .swap-btn { padding: 20px; background: #667eea; color: white; border: none; border-radius: 50%; cursor: pointer; font-size: 24px; transition: all 0.3s; margin-top: 50px; } .swap-btn:hover { transform: rotate(180deg); } .result-box { background: #e8eaff; padding: 20px; border-radius: 10px; text-align: center; margin-top: 20px; } .result-time { font-size: 2rem; font-weight: bold; color: #667eea; } .result-date { color: #666; margin-top: 10px; } @media (max-width: 768px) { .converter-grid { grid-template-columns: 1fr; } .swap-btn { margin: 20px auto; transform: rotate(90deg); } } </style> </head> <body> <div class="container"> <a href="/" class="back-btn">← Back to Home</a> <header> <h1>🌍 Timezone Converter</h1> <p>Convert time between different timezones</p> </header> <main class="tool-content"> <div class="converter-grid"> <div class="timezone-box"> <h3>From</h3> <select id="fromTimezone" onchange="convertTime()"> <option value="UTC">UTC</option> <option value="America/New_York">Eastern Time (ET)</option> <option value="America/Chicago">Central Time (CT)</option> <option value="America/Denver">Mountain Time (MT)</option> <option value="America/Los_Angeles">Pacific Time (PT)</option> <option value="Europe/London">London (GMT)</option> <option value="Europe/Paris">Paris (CET)</option> <option value="Europe/Berlin">Berlin (CET)</option> <option value="Asia/Tokyo">Tokyo (JST)</option> <option value="Asia/Shanghai">Shanghai (CST)</option> <option value="Asia/Kolkata">Mumbai (IST)</option> <option value="Australia/Sydney">Sydney (AEST)</option> </select> <input type="datetime-local" id="fromDateTime" onchange="convertTime()"> <div class="result-box"> <div class="result-time" id="fromDisplay">-</div> <div class="result-date" id="fromDate">-</div> </div> </div> <button class="swap-btn" onclick="swapTimezones()">⇄</button> <div class="timezone-box"> <h3>To</h3> <select id="toTimezone" onchange="convertTime()"> <option value="UTC">UTC</option> <option value="America/New_York">Eastern Time (ET)</option> <option value="America/Chicago">Central Time (CT)</option> <option value="America/Denver">Mountain Time (MT)</option> <option value="America/Los_Angeles">Pacific Time (PT)</option> <option value="Europe/London">London (GMT)</option> <option value="Europe/Paris">Paris (CET)</option> <option value="Europe/Berlin">Berlin (CET)</option> <option value="Asia/Tokyo" selected>Tokyo (JST)</option> <option value="Asia/Shanghai">Shanghai (CST)</option> <option value="Asia/Kolkata">Mumbai (IST)</option> <option value="Australia/Sydney">Sydney (AEST)</option> </select> <div class="result-box"> <div class="result-time" id="toDisplay">-</div> <div class="result-date" id="toDate">-</div> </div> </div> </div> <div style="text-align: center;"> <button class="btn btn-primary" onclick="setNow()">⏰ Set to Now</button> <button class="btn btn-secondary" onclick="copyResult()">📋 Copy Result</button> </div> </main> </div> <script> // Set initial time to now function setNow() { const now = new Date(); const localOffset = now.getTimezoneOffset() * 60000; const localTime = new Date(now.getTime() - localOffset); document.getElementById('fromDateTime').value = localTime.toISOString().slice(0, 16); convertTime(); } function convertTime() { const fromTZ = document.getElementById('fromTimezone').value; const toTZ = document.getElementById('toTimezone').value; const dateTimeStr = document.getElementById('fromDateTime').value; if (!dateTimeStr) return; const dateTime = new Date(dateTimeStr); // Get time in source timezone const fromOptions = { timeZone: fromTZ, hour12: false }; const fromTime = new Intl.DateTimeFormat('en-US', { ...fromOptions, hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(dateTime); const fromDate = new Intl.DateTimeFormat('en-US', { ...fromOptions, weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' }).format(dateTime); // Get time in target timezone const toOptions = { timeZone: toTZ, hour12: false }; const toTime = new Intl.DateTimeFormat('en-US', { ...toOptions, hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(dateTime); const toDate = new Intl.DateTimeFormat('en-US', { ...toOptions, weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' }).format(dateTime); document.getElementById('fromDisplay').textContent = fromTime; document.getElementById('fromDate').textContent = fromDate; document.getElementById('toDisplay').textContent = toTime; document.getElementById('toDate').textContent = toDate; } function swapTimezones() { const fromSelect = document.getElementById('fromTimezone'); const toSelect = document.getElementById('toTimezone'); const temp = fromSelect.value; fromSelect.value = toSelect.value; toSelect.value = temp; convertTime(); } function copyResult() { const fromTime = document.getElementById('fromDisplay').textContent; const toTime = document.getElementById('toDisplay').textContent; const text = `${fromTime} in ${document.getElementById('fromTimezone').value} = ${toTime} in ${document.getElementById('toTimezone').value}`; navigator.clipboard.writeText(text).then(() => { alert('Result copied!'); }); } // Initialize setNow(); // Track usage if (typeof gtag !== 'undefined') { gtag('event', 'tool_usage', { 'event_category': 'tools', 'event_label': 'timezone-converter', 'value': 1 }); } </script> </body> </html>
