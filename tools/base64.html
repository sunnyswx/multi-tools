/main> </div> <script> function encode() { const input = document.getElementById('inputText').value; if (!input) { alert('Please enter text to encode!'); return; } try { const encoded = btoa(unescape(encodeURIComponent(input))); document.getElementById('resultText').value = encoded; updateStats(input.length, encoded.length); } catch (e) { alert('Error encoding text: ' + e.message); } } function decode() { const input = document.getElementById('inputText').value; if (!input) { alert('Please enter Base64 to decode!'); return; } try { const decoded = decodeURIComponent(escape(atob(input))); document.getElementById('resultText').value = decoded; updateStats(input.length, decoded.length); } catch (e) { alert('Invalid Base64 string!'); } } function swap() { const input = document.getElementById('inputText').value; const result = document.getElementById('resultText').value; document.getElementById('inputText').value = result; document.getElementById('resultText').value = input; updateStats(result.length, input.length); } function copyResult() { const result = document.getElementById('resultText').value; if (!result) { alert('No result to copy!'); return; } navigator.clipboard.writeText(result).then(() => { alert('Copied to clipboard!'); }); } function clearAll() { document.getElementById('inputText').value = ''; document.getElementById('resultText').value = ''; updateStats(0, 0); } function updateStats(inputLen, outputLen) { document.getElementById('inputLength').textContent = inputLen; document.getElementById('outputLength').textContent = outputLen; if (inputLen > 0) { const ratio = ((1 - outputLen / inputLen) * 100).toFixed(1); document.getElementById('compressionRatio').textContent = ratio + '%'; } else { document.getElementById('compressionRatio').textContent = '0%'; } } // Track usage if (typeof gtag !== 'undefined') { gtag('event', 'tool_usage', { 'event_category': 'tools', 'event_label': 'base64', 'value': 1 }); } </script> </body> </html>
