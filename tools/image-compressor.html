<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Compressor - Multi Tools</title>
    <meta name="description" content="Compress images online for free. 免费在线压缩PNG、JPG、WebP图片">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lang.js"></script>
    <script>
        // 自动检测浏览器语言
        (function() {
            const browserLang = navigator.language.split('-')[0];
            const supportedLangs = ['en', 'zh', 'ja', 'ko', 'es', 'fr', 'de', 'ru', 'ar'];
            
            // 检查浏览器语言是否在支持列表中
            let lang = 'en'; // 默认英文
            if (supportedLangs.includes(browserLang)) {
                lang = browserLang;
            }
            
            // 保存到 localStorage
            localStorage.setItem('multi-tools-lang', lang);
            
            console.log('[AutoLang] Browser language:', browserLang, '=> Using:', lang);
        })();
    </script>
    <script>
        // 立即初始化语言
        document.addEventListener('DOMContentLoaded', function() {
            console.log('[Init] DOM loaded, calling initLanguage');
            initLanguage();
            debugTranslations();
        });
    </script>
    
    <style>
        .tool-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 30px; }
        .tool-header h1 { color: #333; font-size: 2rem; margin-bottom: 10px; }
        .tool-header p { color: #666; }
        .tool-content { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .upload-area { border: 3px dashed #e0e0e0; border-radius: 15px; padding: 50px; text-align: center; cursor: pointer; transition: all 0.3s; }
        .upload-area:hover { border-color: #667eea; background: #f8f9fa; }
        .upload-area input { display: none; }
        .preview-container { display: none; margin-top: 20px; }
        .preview-container img { max-width: 100%; border-radius: 10px; }
        .quality-slider { margin: 20px 0; }
        .quality-slider label { display: block; margin-bottom: 10px; font-weight: 600; }
        input[type="range"] { width: 100%; }
        .result-info { display: none; margin-top: 20px; padding: 20px; background: #f8f9fa; border-radius: 10px; }
        .result-info p { margin: 10px 0; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .btn { padding: 12px 30px; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .language-selector { margin-top: 30px; text-align: center; }
        .language-selector select { padding: 10px 20px; font-size: 16px; border: none; border-radius: 25px; background: #667eea; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn" data-i18n="common.back_to_home">← Back to Home</a>
        <div class="tool-container">
            <div class="tool-header">
                <h1 data-i18n="tools.image-compressor.name">🗜️ Image Compressor</h1>
                <p data-i18n="tools.image-compressor.desc">Compress images online for free</p>
            </div>
            <div class="tool-content">
                <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                    <div style="font-size: 3rem; margin-bottom: 15px;">📁</div>
                    <h3 data-i18n="common.click_to_upload">Click to upload image</h3>
                    <p data-i18n="common.or_drag_drop">or drag and drop</p>
                    <input type="file" id="fileInput" accept="image/*" onchange="handleFile(event)">
                </div>
                <div class="quality-slider" id="qualityControl" style="display: none;">
                    <label><span data-i18n="image-compressor.quality_label">Compression Quality</span>: <span id="qualityValue">80</span>%</label>
                    <input type="range" id="quality" min="10" max="100" value="80" oninput="updateQuality()">
                </div>
                <div class="preview-container" id="previewContainer">
                    <img id="preview" src="" alt="Preview">
                </div>
                <div class="result-info" id="resultInfo">
                    <p><strong data-i18n="image-compressor.original_size">Original Size</strong>: <span id="originalSize">-</span></p>
                    <p><strong data-i18n="image-compressor.compressed_size">Compressed Size</strong>: <span id="compressedSize">-</span></p>
                    <p><strong data-i18n="image-compressor.reduction">Reduction</strong>: <span id="reduction">-</span></p>
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" id="compressBtn" data-i18n="common.compress">Compress</button>
                    <button class="btn btn-secondary" id="downloadBtn" data-i18n="common.download">Download</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        let originalFile = null;
        let compressedBlob = null;
        
            
            // Also listen for language changes
            const langSelect = document.getElementById('langSelect');
            if (langSelect) {
                langSelect.addEventListener('change', function() {
                    const lang = this.value;
                    applyLanguage(lang);
                    
                    // Directly update title and description
                    const h1 = document.querySelector('h1[data-i18n="tools.image-compressor.name"]');
                    const p = document.querySelector('p[data-i18n="tools.image-compressor.desc"]');
                    if (h1 && translations[lang]?.['image-compressor-name']) {
                        h1.textContent = '🗜️ ' + translations[lang]['image-compressor-name'].name;
                    }
                    if (p && translations[lang]?.['image-compressor-desc']) {
                        p.textContent = translations[lang]['image-compressor-desc'].desc;
                    }
                });
            }
            
            const uploadArea = document.getElementById('uploadArea');
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = '#667eea';
                uploadArea.style.background = '#f8f9fa';
            });
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.style.borderColor = '#e0e0e0';
                uploadArea.style.background = 'transparent';
            });
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('image/')) {
                    handleFile({ target: { files: [file] } });
                }
            });
        
        function handleFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            originalFile = file;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('preview').src = e.target.result;
                document.getElementById('previewContainer').style.display = 'block';
                document.getElementById('qualityControl').style.display = 'block';
                document.getElementById('compressBtn').style.display = 'block';
                document.getElementById('originalSize').textContent = formatBytes(file.size);
            };
            reader.readAsDataURL(file);
        }
        
        function updateQuality() {
            document.getElementById('qualityValue').textContent = document.getElementById('quality').value;
        }
        
        function compress() {
            const quality = parseInt(document.getElementById('quality').value) / 100;
            const img = document.getElementById('preview');
            
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            ctx.drawImage(img, 0, 0);
            
            canvas.toBlob(function(blob) {
                compressedBlob = blob;
                document.getElementById('compressedSize').textContent = formatBytes(blob.size);
                
                const reduction = ((1 - blob.size / originalFile.size) * 100).toFixed(1);
                document.getElementById('reduction').textContent = reduction + '%';
                document.getElementById('resultInfo').style.display = 'block';
                document.getElementById('downloadBtn').style.display = 'block';
            }, 'image/jpeg', quality);
        }
        
        function download() {
            if (!compressedBlob) return;
            
            const link = document.createElement('a');
            link.download = 'compressed-' + originalFile.name;
            link.href = URL.createObjectURL(compressedBlob);
            link.click();
        }
        
        function formatBytes(bytes) {
            if (bytes === 0) return '0 ' + getUnit('bytes');
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + getUnit(sizes[i].toLowerCase());
        }
        
        function getUnit(unit) {
            const units = {
                'bytes': translations[getLanguage()]?.['image-compressor']?.['units']?.['bytes'] || 'Bytes',
                'kb': translations[getLanguage()]?.['image-compressor']?.['units']?.['kb'] || 'KB',
                'mb': translations[getLanguage()]?.['image-compressor']?.['units']?.['mb'] || 'MB',
                'gb': translations[getLanguage()]?.['image-compressor']?.['units']?.['gb'] || 'GB'
            };
            return units[unit] || unit;
        }
        
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_open', { tool: 'image-compressor' });
        }
    </script>
</body>
</html>
