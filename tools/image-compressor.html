<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{TITLE} - 免费在线工具 | Multi Tools</title>
    <meta name="description" content="{DESCRIPTION}">
    
    <!-- GA4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"><\/script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    <\/script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            padding: 40px 20px;
            color: white;
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        .tool-content {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }
        .tool-content h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }
        .tool-content p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .input-area, .output-area {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .input-area:focus, .output-area:focus {
            outline: none;
            border-color: #667eea;
        }
        .input-area {
            min-height: 150px;
            resize: vertical;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px 5px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
            box-shadow: none;
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .result h3 {
            color: #333;
            margin-bottom: 10px;
        }
        .result-value {
            font-size: 1.5rem;
            color: #667eea;
            font-weight: bold;
        }
        @media (max-width: 768px) {
            header h1 { font-size: 2rem; }
            .tool-content { padding: 20px; }
            .btn { padding: 10px 20px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-btn">← 返回首页</a>
        
        <header>
            <h1>🛠️ {TITLE}</h1>
            <p>{DESCRIPTION}</p>
        </header>
        
        <main class="tool-content">
            <!-- 工具功能区域 -->
            {CONTENT}
        </main>
        
        <footer style="text-align: center; color: white; padding: 20px;">
            <p>© 2026 Multi Tools - 免费在线工具集</p>
        </footer>
    </div>
    
    <!-- 工具追踪 -->
    <script>
        function trackToolUsage(toolName) {
            if (typeof gtag !== 'undefined') {
                gtag('event', 'tool_usage', {
                    'event_category': 'tools',
                    'event_label': toolName,
                    'value': 1
                });
            }
            console.log('工具使用:', toolName);
        }
        
        trackToolUsage('image-compressor');
    <\/script>
</body>
</html>
