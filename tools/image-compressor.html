    <div class="container">
        <a href="/" class="back-btn">← 返回首页</a>
        <header>
            <h1>🖼️ 图片压缩工具</h1>
            <p>免费在线压缩PNG、JPG、WebP图片，本地处理保护隐私</p>
        </header>
        
        <div class="tool-card">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <div class="upload-text">点击上传或拖拽图片到此处</div>
                <input type="file" id="fileInput" accept="image/*" multiple>
            </div>
            
            <div class="preview-container" id="previewContainer"></div>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        
        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#764ba2';
            uploadArea.style.background = '#f0f0f0';
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '#667eea';
            uploadArea.style.background = '#f8f9fa';
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#667eea';
            uploadArea.style.background = '#f8f9fa';
            handleFiles(e.dataTransfer.files);
        });
        
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });
        
        async function handleFiles(files) {
            previewContainer.innerHTML = '';
            
            for (const file of files) {
                if (!file.type.startsWith('image/')) continue;
                
                const originalSize = file.size;
                const originalUrl = URL.createObjectURL(file);
                
                try {
                    const options = {
                        maxSizeMB: 1,
                        maxWidthOrHeight: 1920,
                        useWebWorker: true
                    };
                    
                    const compressedFile = await imageCompression(file, options);
                    const compressedUrl = URL.createObjectURL(compressedFile);
                    
                    const previewItem = document.createElement('div');
                    previewItem.className = 'preview-item';
                    previewItem.innerHTML = `
                        <img src="${originalUrl}" alt="预览">
                        <div class="preview-info">
                            <h4>${file.name}</h4>
                            <p>原始: ${formatBytes(originalSize)} → 压缩: ${formatBytes(compressedFile.size)}</p>
                            <p>压缩率: ${Math.round((1 - compressedFile.size / originalSize) * 100)}%</p>
                        </div>
                        <a href="${compressedUrl}" download="compressed_${file.name}" class="download-btn">下载</a>
                    `;
                    previewContainer.appendChild(previewItem);
                    
                    trackToolUsage('image-compressor', 'compress');
                } catch (error) {
                    console.error('压缩失败:', error);
                }
            }
        }
        
        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
