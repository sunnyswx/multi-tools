/p> </header> <main class="tool-content"> <div id="preview" class="preview"></div> <div class="color-inputs"> <div class="input-group"> <label> (R)</label> <input type="number" id="red" min="0" max="255" value="102" oninput="updateColor()"> </div> <div class="input-group"> <label> (G)</label> <input type="number" id="green" min="0" max="255" value="126" oninput="updateColor()"> </div> <div class="input-group"> <label> (B)</label> <input type="number" id="blue" min="0" max="255" value="234" oninput="updateColor()"> </div> </div> <div class="input-group"> <label></label> <input type="color" id="colorPicker" value="#667eea" oninput="fromPicker(this.value)"> </div> <div class="result"> <div class="result-item"> <span>HEX:</span> <span id="hex">#667eea</span> <button class="copy-btn" onclick="copyValue('hex')"></button> </div> <div class="result-item"> <span>RGB:</span> <span id="rgb">rgb(102, 126, 234)</span> <button class="copy-btn" onclick="copyValue('rgb')"></button> </div> <div class="result-item"> <span>HSL:</span> <span id="hsl">hsl(232, 77%, 66%)</span> <button class="copy-btn" onclick="copyValue('hsl')"></button> </div> </div> </main> </div> <script> function updateColor() { const r = parseInt(document.getElementById('red').value) || 0; const g = parseInt(document.getElementById('green').value) || 0; const b = parseInt(document.getElementById('blue').value) || 0; const hex = '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join(''); const rgb = `rgb(${r}, ${g}, ${b})`; const hsl = rgbToHsl(r, g, b); document.getElementById('preview').style.background = hex; document.getElementById('hex').textContent = hex; document.getElementById('rgb').textContent = rgb; document.getElementById('hsl').textContent = hsl; document.getElementById('colorPicker').value = hex; trackToolUsage('color-picker'); } function fromPicker(value) { document.getElementById('red').value = parseInt(value.slice(1, 3), 16); document.getElementById('green').value = parseInt(value.slice(3, 5), 16); document.getElementById('blue').value = parseInt(value.slice(5, 7), 16); updateColor(); } function rgbToHsl(r, g, b) { r /= 255; g /= 255; b /= 255; const max = Math.max(r, g, b), min = Math.min(r, g, b); let h, s, l = (max + min) / 2; if (max === min) { h = s = 0; } else { const d = max - min; s = l > 0.5 ? d / (2 - max - min) : d / (max + min); switch (max) { case r: h = (g - b) / d + (g < b ? 6 : 0); break; case g: h = (b - r) / d + 2; break; case b: h = (r - g) / d + 4; break; } h /= 6; } return `hsl(${Math.round(h * 360)}, ${Math.round(s * 100)}%, ${Math.round(l * 100)}%)`; } function copyValue(id) { const text = document.getElementById(id).textContent; navigator.clipboard.writeText(text).then(() => alert('')); } function trackToolUsage(name) { if (typeof gtag !== 'undefined') gtag('event', 'tool_usage', { event_category: 'tools', event_label: name }); } trackToolUsage('color-picker'); updateColor(); // document.querySelectorAll('button').forEach(btn => { btn.addEventListener('click', () => { trackToolUsage('color-picker', 'click'); }); }); </script> </body> </html>
