<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="tools.color-picker.name">Color Picker - Multi Tools</title>
    <meta name="description" content="Pick colors and get HEX, RGB, HSL values.">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lang.js"></script>
    <script>
        (function() {
            const browserLang = navigator.language.split('-')[0];
            const supportedLangs = ['en', 'zh', 'ja', 'ko', 'es', 'fr', 'de', 'ru', 'ar'];
            let lang = 'en';
            if (supportedLangs.includes(browserLang)) {
                lang = browserLang;
            }
            localStorage.setItem('multi-tools-lang', lang);
            console.log('[AutoLang] Browser language:', browserLang, '=> Using:', lang);
        })();
        document.addEventListener('DOMContentLoaded', function() {
            initLanguage();
            debugTranslations();
        });
    </script>
    <style>
        .tool-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 30px; }
        .tool-header h1 { color: #333; font-size: 2rem; margin-bottom: 10px; }
        .tool-header p { color: #666; }
        .tool-content { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        
        .color-preview { 
            width: 100%; 
            height: 150px; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            border: 2px solid #e0e0e0; 
            transition: background 0.3s;
            cursor: pointer;
        }
        .color-preview:hover { border-color: #667eea; }
        
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input[type="color"] { 
            width: 100%; 
            height: 60px; 
            border: none; 
            cursor: pointer; 
            border-radius: 10px;
            padding: 5px;
        }
        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid #e0e0e0; 
            border-radius: 10px; 
            font-size: 16px; 
            font-family: monospace;
        }
        input[type="text"]:focus { outline: none; border-color: #667eea; }
        
        .value-display { 
            margin-top: 20px; 
            padding: 20px; 
            background: #f8f9fa; 
            border-radius: 10px;
        }
        .value-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .value-item:hover {
            background: #667eea;
            color: white;
        }
        .value-item:hover .copy-hint {
            opacity: 1;
        }
        .value-label { font-weight: 600; }
        .value-text { font-family: monospace; font-size: 16px; }
        .copy-hint { opacity: 0; transition: opacity 0.2s; font-size: 12px; margin-left: 10px; }
        
        .btn-group { 
            margin-top: 20px; 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn { 
            padding: 12px 24px; 
            border: none; 
            border-radius: 25px; 
            font-size: 14px; 
            cursor: pointer; 
            transition: all 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-success { background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%); color: white; }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 9999;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn" data-i18n="common.back_to_home">← Back to Home</a>
        <div class="tool-container">
            <div class="tool-header">
                <h1>🎨 <span data-i18n="tools.color-picker.name">Color Picker</span></h1>
                <p data-i18n="tools.color-picker.desc">Pick colors and get HEX, RGB, HSL values</p>
            </div>
            <div class="tool-content">
                <div class="color-preview" id="colorPreview" style="background: #667eea;" onclick="document.getElementById('colorPicker').click()"></div>
                
                <div class="input-group">
                    <label data-i18n="common.select_color">Select Color:</label>
                    <input type="color" id="colorPicker" value="#667eea">
                </div>
                
                <div class="value-display">
                    <div class="value-item" onclick="copyValue('hex')">
                        <span class="value-label" data-i18n="common.hex_label">HEX:</span>
                        <span>
                            <span class="value-text" id="hexValue">#667eea</span>
                            <span class="copy-hint" data-i18n="picker.click_to_copy">Click to copy</span>
                        </span>
                    </div>
                    <div class="value-item" onclick="copyValue('rgb')">
                        <span class="value-label" data-i18n="common.rgb_label">RGB:</span>
                        <span>
                            <span class="value-text" id="rgbValue">102, 126, 234</span>
                            <span class="copy-hint" data-i18n="picker.click_to_copy">Click to copy</span>
                        </span>
                    </div>
                    <div class="value-item" onclick="copyValue('hsl')">
                        <span class="value-label" data-i18n="common.hsl_label">HSL:</span>
                        <span>
                            <span class="value-text" id="hslValue">231, 71%, 66%</span>
                            <span class="copy-hint" data-i18n="picker.click_to_copy">Click to copy</span>
                        </span>
                    </div>
                </div>
                
                <div class="btn-group">
                    <button class="btn btn-secondary" onclick="randomColor()" data-i18n="common.random_color">Random Color</button>
                    <button class="btn btn-success" onclick="copyValue('hex')" data-i18n="common.copy_hex">Copy HEX</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="toast" id="toast"></div>

    <script>
        let currentColor = '#667eea';
        
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getLanguage();
            applyLanguage(lang);
            
            const picker = document.getElementById('colorPicker');
            picker.addEventListener('input', function(e) {
                updateColor(e.target.value);
            });
            
            updateColor('#667eea');
        });
        
        function updateColor(hex) {
            currentColor = hex;
            document.getElementById('colorPreview').style.background = hex;
            document.getElementById('colorPicker').value = hex;
            document.getElementById('hexValue').textContent = hex.toUpperCase();
            
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            document.getElementById('rgbValue').textContent = r + ', ' + g + ', ' + b;
            
            const rgbToHsl = (r, g, b) => {
                r /= 256; g /= 256; b /= 256;
                const max = Math.max(r, g, b), min = Math.min(r, g, b);
                let h, s, l = (max + min) / 2;
                if (max === min) {
                    h = s = 0;
                } else {
                    const d = max - min;
                    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                    switch (max) {
                        case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                        case g: h = (b - r) / d + 2; break;
                        case b: h = (r - g) / d + 4; break;
                    }
                    h /= 6;
                }
                return [Math.round(h * 360), Math.round(s * 100), Math.round(l * 100)];
            };
            
            const [h, s, l] = rgbToHsl(r, g, b);
            document.getElementById('hslValue').textContent = h + ', ' + s + '%, ' + l + '%';
        }
        
        function copyValue(type) {
            let text = '';
            if (type === 'hex') text = document.getElementById('hexValue').textContent;
            else if (type === 'rgb') text = document.getElementById('rgbValue').textContent;
            else if (type === 'hsl') text = document.getElementById('hslValue').textContent;
            
            navigator.clipboard.writeText(text).then(() => {
                showToast(type.toUpperCase() + ' copied!');
            }).catch(() => {
                showToast('Copy failed');
            });
        }
        
        function randomColor() {
            const randomHex = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
            updateColor(randomHex);
        }
        
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
        
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_open', { tool: 'color-picker' });
        }
    </script>
</body>
</html>
