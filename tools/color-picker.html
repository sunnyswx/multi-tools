<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker - Multi Tools</title>
    <meta name="description" content="Pick colors and get HEX, RGB, HSL values. 颜色选择器，选择颜色并获取HEX、RGB、HSL值">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lang.js"></script>
    <style>
        .tool-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 30px; }
        .tool-header h1 { color: #333; font-size: 2rem; margin-bottom: 10px; }
        .tool-header p { color: #666; }
        .tool-content { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .color-preview { width: 100%; height: 150px; border-radius: 10px; margin-bottom: 20px; border: 2px solid #e0e0e0; transition: background 0.3s; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input[type="color"] { width: 100%; height: 100px; border: none; cursor: pointer; border-radius: 10px; }
        input[type="text"] { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; font-family: monospace; }
        input[type="text"]:focus { outline: none; border-color: #667eea; }
        .value-display { margin-top: 10px; padding: 15px; background: #f8f9fa; border-radius: 10px; }
        .value-display p { margin: 5px 0; font-size: 14px; }
        .btn { padding: 12px 30px; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; transition: all 0.3s; margin: 5px; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .language-selector { margin-top: 30px; text-align: center; }
        .language-selector select { padding: 10px 20px; font-size: 16px; border: none; border-radius: 25px; background: #667eea; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn">← Back to Home</a>
        <div class="tool-container">
            <div class="tool-header">
                <h1>🎨 Color Picker</h1>
                <p>Pick colors and get HEX, RGB, HSL values</p>
            </div>
            <div class="tool-content">
                <div class="color-preview" id="colorPreview" style="background: #667eea;"></div>
                <div class="input-group">
                    <label>Select Color:</label>
                    <input type="color" id="colorPicker" value="#667eea">
                </div>
                <div class="input-group">
                    <label>HEX Value:</label>
                    <input type="text" id="hexValue" value="#667eea" readonly>
                </div>
                <div class="value-display">
                    <p><strong>RGB:</strong> <span id="rgbValue">102, 126, 234</span></p>
                    <p><strong>HSL:</strong> <span id="hslValue">231, 71%, 66%</span></p>
                </div>
                <div class="btn-group" style="margin-top: 20px;">
                    <button class="btn btn-primary" onclick="copyHEX()">Copy HEX</button>
                    <button class="btn btn-secondary" onclick="copyRGB()">Copy RGB</button>
                    <button class="btn btn-secondary" onclick="randomColor()">Random Color</button>
                </div>
            </div>
            <div class="language-selector">
                <select id="langSelect" onchange="changeLanguage(this.value)">
                    <option value="en">English</option>
                    <option value="zh">中文</option>
                    <option value="ja">日本語</option>
                    <option value="ko">한국어</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                    <option value="ru">Русский</option>
                    <option value="ar">العربية</option>
                </select>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getLanguage();
            applyLanguage(lang);
            
            const picker = document.getElementById('colorPicker');
            picker.addEventListener('input', function(e) {
                updateColor(e.target.value);
            });
            
            updateColor('#667eea');
        });
        
        function updateColor(hex) {
            document.getElementById('colorPreview').style.background = hex;
            document.getElementById('hexValue').value = hex.toUpperCase();
            
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            document.getElementById('rgbValue').textContent = r + ', ' + g + ', ' + b;
            
            const rgbToHsl = (r, g, b) => {
                r /= 256; g /= 256; b /= 256;
                const max = Math.max(r, g, b), min = Math.min(r, g, b);
                let h, s, l = (max + min) / 2;
                if (max === min) {
                    h = s = 0;
                } else {
                    const d = max - min;
                    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                    switch (max) {
                        case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                        case g: h = (b - r) / d + 2; break;
                        case b: h = (r - g) / d + 4; break;
                    }
                    h /= 6;
                }
                return [Math.round(h * 360), Math.round(s * 100), Math.round(l * 100)];
            };
            
            const [h, s, l] = rgbToHsl(r, g, b);
            document.getElementById('hslValue').textContent = h + ', ' + s + '%, ' + l + '%';
        }
        
        function copyHEX() {
            navigator.clipboard.writeText(document.getElementById('hexValue').value);
            alert('HEX copied!');
        }
        
        function copyRGB() {
            navigator.clipboard.writeText(document.getElementById('rgbValue').textContent);
            alert('RGB copied!');
        }
        
        function randomColor() {
            const randomHex = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
            document.getElementById('colorPicker').value = randomHex;
            updateColor(randomHex);
        }
        
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_open', { tool: 'color-picker' });
        }
    </script>
</body>
</html>
