ption> <option value="auto">Fit to Image</option> </select> </div> <div style="text-align: center;"> <button class="btn btn-primary" onclick="convertToPDF()" id="convertBtn" disabled>📄 Convert to PDF</button> <button class="btn btn-secondary" onclick="clearAll()">🗑️ Clear All</button> </div> <div class="progress-bar" id="progressBar"> <div class="progress-fill" id="progressFill"></div> </div> </main> </div> <script> let images = []; const uploadArea = document.getElementById('uploadArea'); uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); }); uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover')); uploadArea.addEventListener('drop', (e) => { e.preventDefault(); uploadArea.classList.remove('dragover'); handleFiles(e.dataTransfer.files); }); function handleFiles(files) { Array.from(files).forEach(file => { if (file.type.startsWith('image/')) { const reader = new FileReader(); reader.onload = (e) => { images.push({ name: file.name, data: e.target.result }); updatePreview(); }; reader.readAsDataURL(file); } }); } function updatePreview() { const grid = document.getElementById('previewGrid'); grid.innerHTML = images.map((img, i) => ` <div class="preview-item"> <img src="${img.data}" alt="${img.name}"> <button class="remove-btn" onclick="removeImage(${i})">×</button> </div> `).join(''); document.getElementById('convertBtn').disabled = images.length === 0; } function removeImage(index) { images.splice(index, 1); updatePreview(); } function clearAll() { images = []; updatePreview(); } async function convertToPDF() { if (images.length === 0) return; const progressBar = document.getElementById('progressBar'); const progressFill = document.getElementById('progressFill'); progressBar.style.display = 'block'; // Simulate progress for (let i = 0; i <= 100; i += 10) { progressFill.style.width = i + '%'; await new Promise(r => setTimeout(r, 100)); } // Create simple PDF (using basic PDF format) let pdfContent = '%PDF-1.4\n'; let objects = []; let objNum = 1; // Add images to PDF images.forEach((img, i) => { const base64Data = img.data.split(',')[1]; const imageData = atob(base64Data); const imageSize = imageData.length; // Image object objects.push(`\n${objNum} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${img.width} /Height ${img.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${imageSize} >>\nstream\n${imageData}\nendstream\nendobj\n`); objNum++; }); // For simplicity, create a basic PDF structure const finalPDF = btoa(pdfContent + objects.join('')); // Download const link = document.createElement('a'); link.href = 'data:application/pdf;base64,' + finalPDF; link.download = 'converted.pdf'; link.click(); alert(`✅ Created PDF with ${images.length} image(s)!`); progressBar.style.display = 'none'; progressFill.style.width = '0%'; } // Track usage if (typeof gtag !== 'undefined') { gtag('event', 'tool_usage', { 'event_category': 'tools', 'event_label': 'pdf-converter', 'value': 1 }); } </script> </body> </html>
