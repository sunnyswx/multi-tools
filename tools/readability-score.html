<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Readability Score - Multi Tools</title>
    <meta name="description" content="Check text readability.">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lang.js"></script>
    <script>
        // 自动检测浏览器语言
        (function() {
            const browserLang = navigator.language.split('-')[0];
            const supportedLangs = ['en', 'zh', 'ja', 'ko', 'es', 'fr', 'de', 'ru', 'ar'];
            
            // 检查浏览器语言是否在支持列表中
            let lang = 'en'; // 默认英文
            if (supportedLangs.includes(browserLang)) {
                lang = browserLang;
            }
            
            // 保存到 localStorage
            localStorage.setItem('multi-tools-lang', lang);
            
            console.log('[AutoLang] Browser language:', browserLang, '=> Using:', lang);
        })();
    </script>
    <script>
        // 初始化语言
        document.addEventListener('DOMContentLoaded', function() {
            initLanguage();
        });
    </script>
    <style>
        .tool-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 30px; }
        .tool-header h1 { color: #333; font-size: 2rem; margin-bottom: 10px; }
        .tool-header p { color: #666; }
        .tool-content { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 200px; padding: 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; resize: vertical; box-sizing: border-box; }
        textarea:focus { outline: none; border-color: #667eea; }
        .btn { padding: 12px 30px; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; margin-top: 15px; }
        .results { margin-top: 20px; }
        .score-circle { width: 150px; height: 150px; border-radius: 50%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: white; font-size: 2.5rem; font-weight: bold; }
        .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .metric { padding: 15px; background: #f8f9fa; border-radius: 10px; }
        .metric-label { font-size: 0.9rem; color: #666; }
        .metric-value { font-size: 1.5rem; font-weight: bold; }
        .language-selector { margin-top: 30px; text-align: center; }
        .language-selector select { padding: 10px 20px; font-size: 16px; border: none; border-radius: 25px; background: #667eea; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn">← Back to Home</a>
        <div class="tool-container">
            <div class="tool-header">
                <h1>📊 Readability Score</h1>
                <p>Check text readability</p>
            </div>
            <div class="tool-content">
                <textarea id="textInput" placeholder="Enter text to analyze...">The quick brown fox jumps over the lazy dog. This is a sample text for readability analysis.</textarea>
                <button class="btn" onclick="analyze()">Analyze</button>
                <div class="results" id="results" style="display: none;">
                    <div class="score-circle" id="score">0</div>
                    <div class="metrics">
                        <div class="metric">
                            <div class="metric-label">Flesch-Kincaid Grade</div>
                            <div class="metric-value" id="grade">-</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Sentences</div>
                            <div class="metric-value" id="sentences">-</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Words</div>
                            <div class="metric-value" id="words">-</div>
                        </div>
                        <div class="metric">
                            <div class="metric-label">Syllables</div>
                            <div class="metric-value" id="syllables">-</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getLanguage();
            applyLanguage(lang);
        });
        
        function countSyllables(word) {
            word = word.toLowerCase();
            if (word.length <= 3) return 1;
            word = word.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, '');
            word = word.replace(/^y/, '');
            const matches = word.match(/[aeiouy]{1,2}/g);
            return matches ? matches.length : 1;
        }
        
        function analyze() {
            const text = document.getElementById('textInput').value;
            const sentences = text.split(/[.!?]+/).filter(s => s.trim()).length;
            const words = text.trim().split(/\s+/).filter(w => w).length;
            const syllables = words.reduce((sum, w) => sum + countSyllables(w), 0);
            
            const score = Math.max(0, Math.min(100, 206.835 - 1.015 * (words / sentences) - 84.6 * (syllables / words)));
            
            document.getElementById('score').textContent = Math.round(score);
            document.getElementById('grade').textContent = (score / 10 + 5).toFixed(1);
            document.getElementById('sentences').textContent = sentences;
            document.getElementById('words').textContent = words;
            document.getElementById('syllables').textContent = syllables;
            document.getElementById('results').style.display = 'block';
        }
        
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_open', { tool: 'readability-score' });
        }
    </script>
</body>
</html>
