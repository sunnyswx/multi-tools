ass="stat-item"> <h4></h4> <div class="stat-value" id="stat-words">0</div> </div> <div class="stat-item"> <h4></h4> <div class="stat-value" id="stat-sentences">0</div> </div> <div class="stat-item"> <h4></h4> <div class="stat-value" id="stat-paragraphs">0</div> </div> <div class="stat-item"> <h4></h4> <div class="stat-value" id="stat-avg-sentence">0</div> </div> </div> <div class="tips" id="tips" style="display: none;"> <h4>💡 </h4> <ul id="tips-list"></ul> </div> </div> </main> </div> <script> function analyzeText() { const text = document.getElementById('text-input').value.trim(); if (!text) { alert('！'); return; } // const words = text.split(/\s+/).filter(w => w.length > 0); const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0); const paragraphs = text.split(/\n+/).filter(p => p.trim().length > 0); // （） let totalSyllables = 0; words.forEach(word => { totalSyllables += countSyllables(word); }); // Flesch Reading Ease const numWords = words.length; const numSentences = sentences.length; const numSyllables = totalSyllables; if (numSentences === 0 || numWords === 0) { alert('，！'); return; } const score = 206.835 - 1.015 * (numWords / numSentences) - 84.6 * (numSyllables / numWords); const finalScore = Math.max(0, Math.min(100, score)); // displayResults(finalScore, numWords, numSentences, paragraphs.length); } function countSyllables(word) { word = word.toLowerCase(); if (word.length <= 3) return 1; word = word.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, ''); word = word.replace(/^y/, ''); const matches = word.match(/[aeiouy]{1,2}/g); return matches ? matches.length : 1; } function displayResults(score, words, sentences, paragraphs) { const result = document.getElementById('result'); result.style.display = 'block'; // document.getElementById('score-number').textContent = Math.round(score); const circle = document.getElementById('score-circle'); circle.className = 'score-circle'; let difficulty, desc, tips = []; if (score >= 80) { circle.addClassName('score-high'); difficulty = ''; desc = '，11'; } else if (score >= 60) { circle.classList.add('score-medium'); difficulty = ''; desc = '，8-10'; if (words / sentences > 20) { tips.push('，'); } } else if (score >= 40) { circle.classList.add('score-medium'); difficulty = ''; desc = '13-15'; tips.push('，'); tips.push(''); } else { circle.classList.add('score-low'); difficulty = ''; desc = ''; tips.push(''); tips.push(''); tips.push(''); } circle.classList.add(score >= 80 ? 'score-high' : score >= 60 ? 'score-medium' : 'score-low'); document.getElementById('difficulty-level').textContent = difficulty; document.getElementById('difficulty-desc').textContent = desc; // document.getElementById('stat-words').textContent = words; document.getElementById('stat-sentences').textContent = sentences; document.getElementById('stat-paragraphs').textContent = paragraphs; document.getElementById('stat-avg-sentence').textContent = (words / sentences).toFixed(1); // const tipsDiv = document.getElementById('tips'); const tipsList = document.getElementById('tips-list'); if (tips.length > 0) { tipsDiv.style.display = 'block'; tipsList.innerHTML = tips.map(t => '<li>' + t + '</li>').join(''); } else { tipsDiv.style.display = 'none'; } } function clearText() { document.getElementById('text-input').value = ''; document.getElementById('result').style.display = 'none'; } // if (typeof gtag !== 'undefined') { gtag('event', 'tool_usage', { 'event_category': 'tools', 'event_label': 'readability-score', 'value': 1 }); } </script> </body> </html>
