<body>
    <div class="container">
        <header>
            <h1>🛠️ Multi Tools</h1>
            <p>免费在线工具集 - 本地处理，保护隐私</p>
        </header>
        
        <div class="tool-container">
            <div class="tool-header">
                <div class="tool-icon">📊</div>
                <h1 class="tool-title">CSV转JSON</h1>
                <p class="tool-description">将CSV数据转换为JSON格式</p>
            </div>
            
            <div class="input-section">
                <label for="csvInput">输入CSV数据：</label>
                <textarea id="csvInput" placeholder="姓名,年龄,城市&#10;张三,25,北京&#10;李四,30,上海&#10;王五,28,广州"></textarea>
            </div>
            
            <div class="options">
                <h3>转换选项：</h3>
                <div class="option-item">
                    <label>
                        <input type="radio" name="outputType" value="array" checked>
                        数组格式（默认）
                    </label>
                    <label>
                        <input type="radio" name="outputType" value="object">
                        对象格式
                    </label>
                </div>
                <div class="option-item">
                    <label>
                        <input type="checkbox" id="firstRowAsHeader" checked>
                        第一行作为表头
                    </label>
                </div>
            </div>
            
            <div class="button-group">
                <button class="btn btn-primary" onclick="convertCSV()">转换</button>
                <button class="btn btn-secondary" onclick="copyResult()">复制</button>
                <button class="btn btn-secondary" onclick="clearAll()">清空</button>
            </div>
            
            <div class="result-section">
                <h3>JSON结果：</h3>
                <textarea id="jsonOutput" readonly placeholder="转换后的JSON将显示在这里..."></textarea>
                
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="rowCount">0</div>
                        <div class="stat-label">数据行数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="colCount">0</div>
                        <div class="stat-label">列数</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="jsonSize">0 B</div>
                        <div class="stat-label">JSON大小</div>
                    </div>
                </div>
            </div>
            
            <a href="/" class="back-link">← 返回首页</a>
        </div>
        
        <footer>
            <p>© 2026 Multi Tools - 免费在线工具集</p>
        </footer>
    </div>
    
    <script>
        function convertCSV() {
            const input = document.getElementById('csvInput').value.trim();
            if (!input) {
                alert('请先输入CSV数据！');
                return;
            }
            
            try {
                const lines = input.split('\n').map(line => line.trim()).filter(line => line);
                if (lines.length === 0) {
                    alert('CSV数据为空！');
                    return;
                }
                
                const useHeader = document.getElementById('firstRowAsHeader').checked;
                const outputType = document.querySelector('input[name="outputType"]:checked').value;
                
                let headers = [];
                let dataLines = [];
                
                if (useHeader && lines.length > 1) {
                    headers = parseCSVLine(lines[0]);
                    dataLines = lines.slice(1);
                } else {
                    // 自动生成列名
                    const sampleLine = parseCSVLine(lines[0]);
                    headers = sampleLine.map((_, i) => `column_${i + 1}`);
                    dataLines = lines;
                }
                
                let result;
                
                if (outputType === 'array') {
                    // 数组格式
                    result = dataLines.map(line => {
                        const values = parseCSVLine(line);
                        const obj = {};
                        headers.forEach((header, i) => {
                            obj[header] = convertValue(values[i]);
                        });
                        return obj;
                    });
                } else {
                    // 对象格式
                    result = {};
                    dataLines.forEach((line, index) => {
                        const values = parseCSVLine(line);
                        const key = useHeader ? values[0] : `row_${index + 1}`;
                        const obj = {};
                        headers.forEach((header, i) => {
                            obj[header] = convertValue(values[i]);
                        });
                        result[key] = obj;
                    });
                }
                
                const json = JSON.stringify(result, null, 2);
                document.getElementById('jsonOutput').value = json;
                
                // 更新统计
                document.getElementById('rowCount').textContent = dataLines.length;
                document.getElementById('colCount').textContent = headers.length;
                document.getElementById('jsonSize').textContent = formatBytes(new Blob([json]).size);
                
                trackToolUsage('csv-to-json', 'convert');
            } catch (e) {
                alert('转换失败：' + e.message);
            }
        }
        
        function parseCSVLine(line) {
            const values = [];
            let current = '';
            let inQuotes = false;
            
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    values.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            
            values.push(current.trim());
            return values;
        }
        
        function convertValue(value) {
            if (value === '' || value === null || value === undefined) {
                return null;
            }
            
            // 尝试转换为数字
            const num = Number(value);
            if (!isNaN(num) && value.trim() !== '') {
                return num;
            }
            
            // 尝试转换为布尔值
            if (value.toLowerCase() === 'true') return true;
            if (value.toLowerCase() === 'false') return false;
            
            // 返回字符串
            return value;
        }
        
        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        function copyResult() {
            const output = document.getElementById('jsonOutput');
            if (!output.value) {
                alert('没有可复制的内容！');
                return;
            }
            
            output.select();
            document.execCommand('copy');
            alert('已复制到剪贴板！');
            trackToolUsage('csv-to-json', 'copy');
        }
        
        function clearAll() {
            document.getElementById('csvInput').value = '';
            document.getElementById('jsonOutput').value = '';
            document.getElementById('rowCount').textContent = '0';
            document.getElementById('colCount').textContent = '0';
            document.getElementById('jsonSize').textContent = '0 B';
            trackToolUsage('csv-to-json', 'clear');
        }
    </script>
</body>
