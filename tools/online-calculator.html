<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Calculator - Multi Tools</title>
    <meta name="description" content="Online Calculator: Basic calculator for everyday math.">
    
    <!-- GA4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lang.js"></script>
    
    <style>
        .tool-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .tool-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .tool-header h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .tool-header p {
            color: #666;
            font-size: 1.1rem;
        }
        .tool-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        .input-group input,
        .input-group textarea,
        .input-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .input-group input:focus,
        .input-group textarea:focus,
        .input-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .input-group textarea {
            min-height: 150px;
            resize: vertical;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .result h3 {
            color: #333;
            margin-bottom: 10px;
        }
        .result pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 14px;
        }
        .result code {
            font-family: 'Consolas', 'Monaco', monospace;
        }
        .language-selector {
            margin-top: 30px;
            text-align: center;
        }
        .language-selector select {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            background: #667eea;
            color: white;
            cursor: pointer;
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            text-decoration: none;
            border-radius: 25px;
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: rgba(102, 126, 234, 0.2);
        }
        /* Color Picker Styles */
        .color-preview {
            width: 100%;
            height: 150px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
        }
        /* Range Slider */
        input[type="range"] {
            width: 100%;
            margin: 10px 0;
        }
        /* Gradient Preview */
        .gradient-preview {
            width: 100%;
            height: 150px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
        }
        /* Shadow Preview */
        .shadow-preview {
            width: 200px;
            height: 200px;
            background: white;
            border-radius: 10px;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        /* Countdown Timer */
        .timer-display {
            font-size: 4rem;
            text-align: center;
            font-weight: bold;
            color: #667eea;
            margin: 30px 0;
        }
        /* Calculator */
        .calculator-display {
            width: 100%;
            padding: 20px;
            font-size: 2rem;
            text-align: right;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        /* QR Code */
        .qr-preview {
            text-align: center;
            margin: 20px 0;
        }
        .qr-preview img {
            max-width: 200px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn">← Back to Home</a>
        
        <div class="tool-container">
            <div class="tool-header">
                <h1>🧮 Online Calculator</h1>
                <p>Basic calculator for everyday math.</p>
            </div>
            
            <div class="tool-content" id="toolContent">
                <!-- Tool-specific content will be inserted here -->
            </div>
            
            <div class="language-selector">
                <select id="langSelect" onchange="changeLanguage(this.value)">
                    <option value="en">English</option>
                    <option value="zh">中文</option>
                    <option value="ja">日本語</option>
                    <option value="ko">한국어</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                    <option value="ru">Русский</option>
                    <option value="ar">العربية</option>
                </select>
            </div>
        </div>
    </div>
    
    <script>
        // Initialize language
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getLanguage();
            applyLanguage(lang);
            initTool();
        });
        
        // Initialize tool
        function initTool() {
            
            const display = document.createElement('input');
            display.type = 'text';
            display.id = 'calcDisplay';
            display.className = 'calculator-display';
            display.value = '0';
            display.readOnly = true;
            
            const buttons = ['7','8','9','/','4','5','6','*','1','2','3','-','C','0','=','+'];
            const btnGrid = document.createElement('div');
            btnGrid.style.display = 'grid';
            btnGrid.style.gridTemplateColumns = 'repeat(4, 1fr)';
            btnGrid.style.gap = '10px';
            btnGrid.style.marginTop = '20px';
            
            buttons.forEach(btn => {
                const button = document.createElement('button');
                button.textContent = btn;
                button.className = 'btn ' + (btn === '=' ? 'btn-primary' : 'btn-secondary');
                button.style.padding = '20px';
                button.style.fontSize = '1.2rem';
                button.addEventListener('click', () => {
                    if (btn === 'C') {
                        display.value = '0';
                    } else if (btn === '=') {
                        try {
                            display.value = eval(display.value) || '0';
                        } catch {
                            display.value = 'Error';
                        }
                    } else {
                        if (display.value === '0' && !['+','-','*','/'].includes(btn)) {
                            display.value = btn;
                        } else {
                            display.value += btn;
                        }
                    }
                });
                btnGrid.appendChild(button);
            });
            
            const toolContent = document.getElementById('toolContent');
            toolContent.appendChild(display);
            toolContent.appendChild(btnGrid);
        
        }
        
        // Track tool usage
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_open', { tool: 'online-calculator' });
        }
    </script>
</body>
</html>
