<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线计算器 - Multi Tools</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        header { text-align: center; padding: 40px 20px; color: white; }
        header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        header p { font-size: 1.2rem; opacity: 0.9; }
        .back-btn { display: inline-block; margin-bottom: 20px; padding: 10px 20px; background: rgba(255,255,255,0.2); color: white; text-decoration: none; border-radius: 25px; }
        .back-btn:hover { background: rgba(255,255,255,0.3); }
        .calculator { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .display { background: #1a1a2e; color: white; padding: 30px; border-radius: 15px; margin-bottom: 20px; text-align: right; }
        .display .expression { font-size: 1.2rem; color: #888; min-height: 30px; }
        .display .result { font-size: 3rem; font-weight: bold; word-wrap: break-word; }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .btn { padding: 25px; font-size: 1.5rem; border: none; border-radius: 15px; cursor: pointer; transition: all 0.2s; font-weight: bold; }
        .btn:hover { transform: scale(1.05); }
        .btn:active { transform: scale(0.95); }
        .btn-number { background: #f0f0f0; color: #333; }
        .btn-operator { background: #667eea; color: white; }
        .btn-function { background: #ff9800; color: white; }
        .btn-equal { background: #4caf50; color: white; grid-column: span 2; }
        .btn-clear { background: #f44336; color: white; }
        .btn-zero { grid-column: span 2; }
        footer { text-align: center; padding: 40px 20px; color: white; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-btn">← 返回首页</a>
        <header>
            <h1>🧮 在线计算器</h1>
            <p>基础计算器和科学计算器，支持多种运算</p>
        </header>
        
        <div class="calculator">
            <div class="display">
                <div class="expression" id="expression"></div>
                <div class="result" id="result">0</div>
            </div>
            
            <div class="buttons">
                <button class="btn btn-clear" onclick="clearAll()">C</button>
                <button class="btn btn-function" onclick="deleteLast()">⌫</button>
                <button class="btn btn-function" onclick="appendOperator('%')">%</button>
                <button class="btn btn-operator" onclick="appendOperator('/')">÷</button>
                
                <button class="btn btn-number" onclick="appendNumber('7')">7</button>
                <button class="btn btn-number" onclick="appendNumber('8')">8</button>
                <button class="btn btn-number" onclick="appendNumber('9')">9</button>
                <button class="btn btn-operator" onclick="appendOperator('*')">×</button>
                
                <button class="btn btn-number" onclick="appendNumber('4')">4</button>
                <button class="btn btn-number" onclick="appendNumber('5')">5</button>
                <button class="btn btn-number" onclick="appendNumber('6')">6</button>
                <button class="btn btn-operator" onclick="appendOperator('-')">−</button>
                
                <button class="btn btn-number" onclick="appendNumber('1')">1</button>
                <button class="btn btn-number" onclick="appendNumber('2')">2</button>
                <button class="btn btn-number" onclick="appendNumber('3')">3</button>
                <button class="btn btn-operator" onclick="appendOperator('+')">+</button>
                
                <button class="btn btn-number btn-zero" onclick="appendNumber('0')">0</button>
                <button class="btn btn-number" onclick="appendNumber('.')">.</button>
                <button class="btn btn-equal" onclick="calculate()">=</button>
            </div>
        </div>
        
        <footer>
            <p>© 2026 Multi Tools | 免费在线工具集</p>
        </footer>
    </div>
    
    <script>
        let currentExpression = '';
        let shouldResetDisplay = false;
        
        const expressionDisplay = document.getElementById('expression');
        const resultDisplay = document.getElementById('result');
        
        function appendNumber(num) {
            if (shouldResetDisplay) {
                currentExpression = '';
                shouldResetDisplay = false;
            }
            currentExpression += num;
            updateDisplay();
        }
        
        function appendOperator(op) {
            if (currentExpression === '' && op !== '-') return;
            
            const lastChar = currentExpression.slice(-1);
            if ('+-*/%'.includes(lastChar)) {
                currentExpression = currentExpression.slice(0, -1);
            }
            
            currentExpression += op;
            shouldResetDisplay = false;
            updateDisplay();
        }
        
        function clearAll() {
            currentExpression = '';
            resultDisplay.textContent = '0';
            expressionDisplay.textContent = '';
        }
        
        function deleteLast() {
            currentExpression = currentExpression.slice(0, -1);
            updateDisplay();
        }
        
        function calculate() {
            if (currentExpression === '') return;
            
            try {
                // 安全计算
                const sanitized = currentExpression.replace(/[^0-9+\-*/%.()]/g, '');
                const result = Function('"use strict"; return (' + sanitized + ')')();
                
                resultDisplay.textContent = formatResult(result);
                expressionDisplay.textContent = currentExpression + ' =';
                currentExpression = result.toString();
                shouldResetDisplay = true;
            } catch (e) {
                resultDisplay.textContent = 'Error';
                currentExpression = '';
            }
        }
        
        function formatResult(num) {
            if (Math.abs(num) > 999999999999) {
                return num.toExponential(6);
            }
            if (Math.abs(num) < 0.000001 && num !== 0) {
                return num.toExponential(6);
            }
            return parseFloat(num.toFixed(10)).toString();
        }
        
        function updateDisplay() {
            resultDisplay.textContent = currentExpression || '0';
        }
        
        // 键盘支持
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
            if (e.key === '.') appendNumber('.');
            if (e.key === '+') appendOperator('+');
            if (e.key === '-') appendOperator('-');
            if (e.key === '*') appendOperator('*');
            if (e.key === '/') appendOperator('/');
            if (e.key === '%') appendOperator('%');
            if (e.key === 'Enter' || e.key === '=') calculate();
            if (e.key === 'Escape') clearAll();
            if (e.key === 'Backspace') deleteLast();
        });
    </script>
</body>
</html>
