        // 问题反馈功能
        function submitFeedback(e) {
            e.preventDefault();
            
            const name = document.getElementById('feedbackName').value.trim();
            const email = document.getElementById('feedbackEmail').value.trim();
            const type = document.getElementById('feedbackType').value;
            const message = document.getElementById('feedbackMessage').value.trim();

            if (!message) {
                alert('请填写问题描述！');
                return;
            }
            
            // 构建反馈数据
            const feedbackData = {
                tool: '""" + tool_name + """',
                timestamp: new Date().toISOString(),
                name: name || '匿名用户',
                email: email || '',
                type: type,
                message: message,
                browser: includeBrowser ? navigator.userAgent : ''
            };
            
            // 保存到localStorage
            try {
                const feedbacks = JSON.parse(localStorage.getItem('feedbacks') || '[]');
                feedbacks.push(feedbackData);
                localStorage.setItem('feedbacks', JSON.stringify(feedbacks));
                
                // 显示成功消息
                document.getElementById('feedbackSuccess').style.display = 'block';
                document.getElementById('feedbackError').style.display = 'none';
                
                // 清空表单
                document.getElementById('feedbackForm').reset();
                
                trackToolUsage('""" + tool_name + """', 'feedback');
                
                // 3秒后隐藏成功消息

                document.getElementById('feedbackSuccess').style.display = 'none';

    <script>
        let currentExpression = '';
        let shouldResetDisplay = false;
        
        const expressionDisplay = document.getElementById('expression');
        const resultDisplay = document.getElementById('result');
        
        function appendNumber(num) {
            if (shouldResetDisplay) {
                currentExpression = '';
                shouldResetDisplay = false;
            }
            currentExpression += num;
            updateDisplay();
        }
        
        function appendOperator(op) {
            if (currentExpression === '' && op !== '-') return;
            
            const lastChar = currentExpression.slice(-1);
            if ('+-*/%'.includes(lastChar)) {
                currentExpression = currentExpression.slice(0, -1);
            }
            
            currentExpression += op;
            shouldResetDisplay = false;
            updateDisplay();
        }
        
        function clearAll() {
            currentExpression = '';
            resultDisplay.textContent = '0';
            expressionDisplay.textContent = '';
        }
        
        function deleteLast() {
            currentExpression = currentExpression.slice(0, -1);
            updateDisplay();
        }
        
        function calculate() {
            if (currentExpression === '') return;
            
            try {
                // 安全计算
                const sanitized = currentExpression.replace(/[^0-9+\-*/%.()]/g, '');
                const result = Function('"use strict"; return (' + sanitized + ')')();
                
                resultDisplay.textContent = formatResult(result);
                expressionDisplay.textContent = currentExpression + ' =';
                currentExpression = result.toString();
                shouldResetDisplay = true;
            } catch (e) {
                resultDisplay.textContent = 'Error';
                currentExpression = '';
            }
        }
        
        function formatResult(num) {
            if (Math.abs(num) > 999999999999) {
                return num.toExponential(6);
            }
            if (Math.abs(num) < 0.000001 && num !== 0) {
                return num.toExponential(6);
            }
            return parseFloat(num.toFixed(10)).toString();
        }
        
        function updateDisplay() {
            resultDisplay.textContent = currentExpression || '0';
        }
        
        // 键盘支持
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
            if (e.key === '.') appendNumber('.');
            if (e.key === '+') appendOperator('+');
            if (e.key === '-') appendOperator('-');
            if (e.key === '*') appendOperator('*');
            if (e.key === '/') appendOperator('/');
            if (e.key === '%') appendOperator('%');
            if (e.key === 'Enter' || e.key === '=') calculate();
            if (e.key === 'Escape') clearAll();
            if (e.key === 'Backspace') deleteLast();
        });
