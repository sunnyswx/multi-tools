<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Calculator - Multi Tools</title>
    <meta name="description" content="Basic calculator for everyday math.">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lang.js"></script>
    <script>
        // 自动检测浏览器语言
        (function() {
            const browserLang = navigator.language.split('-')[0];
            const supportedLangs = ['en', 'zh', 'ja', 'ko', 'es', 'fr', 'de', 'ru', 'ar'];
            
            // 检查浏览器语言是否在支持列表中
            let lang = 'en'; // 默认英文
            if (supportedLangs.includes(browserLang)) {
                lang = browserLang;
            }
            
            // 保存到 localStorage
            localStorage.setItem('multi-tools-lang', lang);
            
            console.log('[AutoLang] Browser language:', browserLang, '=> Using:', lang);
        })();
    </script>
    <script>
        // 初始化语言
        document.addEventListener('DOMContentLoaded', function() {
            initLanguage();
        });
    </script>
    <style>
        .tool-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 30px; }
        .tool-header h1 { color: #333; font-size: 2rem; margin-bottom: 10px; }
        .tool-header p { color: #666; }
        .tool-content { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .calculator { max-width: 400px; margin: 0 auto; }
        .display { width: 100%; padding: 25px; font-size: 2.5rem; text-align: right; border: 2px solid #e0e0e0; border-radius: 10px; margin-bottom: 20px; background: #f8f9fa; font-family: monospace; }
        .btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .calc-btn { padding: 20px; font-size: 1.3rem; border: none; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
        .calc-btn:hover { transform: scale(1.05); }
        .calc-btn.number { background: #f0f0f0; color: #333; }
        .calc-btn.operator { background: #667eea; color: white; }
        .calc-btn.equals { background: #764ba2; color: white; grid-column: span 2; }
        .calc-btn.clear { background: #e74c3c; color: white; }
        .language-selector { margin-top: 30px; text-align: center; }
        .language-selector select { padding: 10px 20px; font-size: 16px; border: none; border-radius: 25px; background: #667eea; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn">← Back to Home</a>
        <div class="tool-container">
            <div class="tool-header">
                <h1>🧮 Online Calculator</h1>
                <p>Basic calculator for everyday math</p>
            </div>
            <div class="tool-content">
                <div class="calculator">
                    <input type="text" class="display" id="display" value="0" readonly>
                    <div class="btn-grid">
                        <button class="calc-btn clear" onclick="clearDisplay()">C</button>
                        <button class="calc-btn operator" onclick="appendToDisplay('/')">/</button>
                        <button class="calc-btn operator" onclick="appendToDisplay('*')">×</button>
                        <button class="calc-btn operator" onclick="deleteLast()">⌫</button>
                        
                        <button class="calc-btn number" onclick="appendToDisplay('7')">7</button>
                        <button class="calc-btn number" onclick="appendToDisplay('8')">8</button>
                        <button class="calc-btn number" onclick="appendToDisplay('9')">9</button>
                        <button class="calc-btn operator" onclick="appendToDisplay('-')">-</button>
                        
                        <button class="calc-btn number" onclick="appendToDisplay('4')">4</button>
                        <button class="calc-btn number" onclick="appendToDisplay('5')">5</button>
                        <button class="calc-btn number" onclick="appendToDisplay('6')">6</button>
                        <button class="calc-btn operator" onclick="appendToDisplay('+')">+</button>
                        
                        <button class="calc-btn number" onclick="appendToDisplay('1')">1</button>
                        <button class="calc-btn number" onclick="appendToDisplay('2')">2</button>
                        <button class="calc-btn number" onclick="appendToDisplay('3')">3</button>
                        <button class="calc-btn number" onclick="appendToDisplay('.')">.</button>
                        
                        <button class="calc-btn number" onclick="appendToDisplay('0')">0</button>
                        <button class="calc-btn equals" onclick="calculate()">=</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getLanguage();
            applyLanguage(lang);
        });
        
        function appendToDisplay(value) {
            const display = document.getElementById('display');
            if (display.value === '0' && value !== '.') {
                display.value = value;
            } else {
                display.value += value;
            }
        }
        
        function clearDisplay() {
            document.getElementById('display').value = '0';
        }
        
        function deleteLast() {
            const display = document.getElementById('display');
            display.value = display.value.slice(0, -1) || '0';
        }
        
        function calculate() {
            try {
                const display = document.getElementById('display');
                display.value = eval(display.value) || '0';
            } catch {
                document.getElementById('display').value = 'Error';
            }
        }
        
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_open', { tool: 'online-calculator' });
        }
    </script>
</body>
</html>
