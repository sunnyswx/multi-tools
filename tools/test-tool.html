<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试工具 - 免费在线测试工具 | Multi Tools</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; padding: 20px; color: white; }
        header h1 { font-size: 2rem; margin-bottom: 10px; }
        .back-btn { display: inline-block; margin-bottom: 15px; padding: 8px 20px; background: rgba(255,255,255,0.2); color: white; text-decoration: none; border-radius: 20px; font-size: 0.9rem; }
        .back-btn:hover { background: rgba(255,255,255,0.3); }
        .tool-card { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        .result { background: #f8f9fa; padding: 20px; border-radius: 10px; margin-top: 20px; }
        .result h3 { color: #667eea; margin-bottom: 15px; }
        .btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 12px 30px; font-size: 1rem; border-radius: 25px; cursor: pointer; transition: transform 0.2s; }
        .btn:hover { transform: scale(1.05); }
        footer { text-align: center; padding: 40px 20px; color: white; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-btn">← 返回首页</a>
        <header>
            <h1>🧪 测试工具</h1>
            <p>自动化部署流程测试工具</p>
        </header>
        
        <div class="tool-card">
            <h3>功能测试</h3>
            <p>这是一个测试工具，用于验证批量部署流程是否正确。</p>
            
            <button class="btn" onclick="testFunction()">点击测试</button>
            
            <div class="result" id="result" style="display: none;">
                <h3>测试结果</h3>
                <p id="resultText"></p>
            </div>
        </div>
        
        <footer>
            <p>© 2026 Multi Tools | 测试工具</p>
        </footer>
    </div>
    
    <script>
        function testFunction() {
            const result = document.getElementById('result');
            const resultText = document.getElementById('resultText');
            
            result.style.display = 'block';
            resultText.textContent = '✅ 测试工具运行正常！部署流程验证成功！';
            
            // 追踪测试
            if (typeof trackToolUsage === 'function') {
                trackToolUsage('test-tool', 'click');
            }
        }
    </script>
</body>
</html>
