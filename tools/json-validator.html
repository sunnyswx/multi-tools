<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>JSON Multi Tools</title> <meta name="description" content="JSON"> <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script> <script> window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'G-L7GQFYBWB6'); </script>

    <script src="lang-helper.js"></script> <style> * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; } .container { max-width: 1000px; margin: 0 auto; } header { text-align: center; padding: 40px 20px; color: white; } header h1 { font-size: 2.5rem; margin-bottom: 10px; } .back-btn { display: inline-block; margin-bottom: 20px; padding: 10px 20px; background: rgba(255,255,255,0.2); color: white; text-decoration: none; border-radius: 25px; } .tool-content { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); } textarea { width: 100%; height: 300px; padding: 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; font-family: monospace; resize: vertical; } textarea:focus { outline: none; border-color: #667eea; } .btn-group { display: flex; gap: 10px; margin: 20px 0; } .btn { padding: 12px 30px; border: none; border-radius: 25px; cursor: pointer; font-size: 16px; transition: all 0.3s; } .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; } .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); } .btn-secondary { background: #f0f0f0; color: #333; } .result { margin-top: 20px; padding: 20px; border-radius: 10px; display: none; } .result.show { display: block; } .result.success { background: #d1fae5; color: #065f46; border-left: 4px solid #10b981; } .result.error { background: #fee2e2; color: #991b1b; border-left: 4px solid #ef4444; } </style> </head> <body> <div class="container"> <a href="/" class="back-btn">← </a> <header> <h1>🔍 JSON</h1> <p>JSON，</p> </header> <main class="tool-content"> <textarea id="jsonInput" placeholder='JSON，：{"name": "", "age": 25}'></textarea> <div class="btn-group"> <button class="btn btn-primary" onclick="validate()"></button> <button class="btn btn-secondary" onclick="formatJSON()"></button> <button class="btn btn-secondary" onclick="clearAll()"></button> </div> <div id="result" class="result"></div> </main> </div> <script> function validate() { const input = document.getElementById('jsonInput').value.trim(); const result = document.getElementById('result'); if (!input) { showResult('JSON', false); return; } try { JSON.parse(input); showResult('✅ JSON！', true); } catch (e) { showResult('❌ JSON: ' + e.message, false); } } function formatJSON() { const input = document.getElementById('jsonInput').value.trim(); const result = document.getElementById('result'); if (!input) { showResult('JSON', false); return; } try { const obj = JSON.parse(input); document.getElementById('jsonInput').value = JSON.stringify(obj, null, 2); showResult('✅ JSON', true); } catch (e) { showResult('❌ JSON: ' + e.message, false); } } function showResult(message, isSuccess) { const result = document.getElementById('result'); result.textContent = message; result.className = 'result show ' + (isSuccess ? 'success' : 'error'); } function clearAll() { document.getElementById('jsonInput').value = ''; document.getElementById('result').className = 'result'; } function trackToolUsage(name) { if (typeof gtag !== 'undefined') gtag('event', 'tool_usage', { event_category: 'tools', event_label: name }); } trackToolUsage('json-validator'); </script> </body> </html>
