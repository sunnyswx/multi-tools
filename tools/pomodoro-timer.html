<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer - Multi Tools</title>
    <meta name="description" content="Pomodoro timer for productivity.">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lang.js"></script>
    <script>
        // 自动检测浏览器语言
        (function() {
            const browserLang = navigator.language.split('-')[0];
            const supportedLangs = ['en', 'zh', 'ja', 'ko', 'es', 'fr', 'de', 'ru', 'ar'];
            
            // 检查浏览器语言是否在支持列表中
            let lang = 'en'; // 默认英文
            if (supportedLangs.includes(browserLang)) {
                lang = browserLang;
            }
            
            // 保存到 localStorage
            localStorage.setItem('multi-tools-lang', lang);
            
            console.log('[AutoLang] Browser language:', browserLang, '=> Using:', lang);
        })();
    </script>
    <style>
        .tool-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 30px; }
        .tool-header h1 { color: #333; font-size: 2rem; margin-bottom: 10px; }
        .tool-header p { color: #666; }
        .tool-content { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .timer-display { text-align: center; margin: 40px 0; }
        .time { font-size: 6rem; font-weight: bold; color: #667eea; font-family: monospace; }
        .mode-selector { display: flex; gap: 10px; justify-content: center; margin-bottom: 30px; }
        .mode-btn { padding: 12px 25px; border: 2px solid #e0e0e0; border-radius: 25px; cursor: pointer; transition: all 0.3s; background: white; }
        .mode-btn.active { border-color: #667eea; background: #667eea; color: white; }
        .btn-group { display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 12px 30px; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .session-counter { text-align: center; margin-top: 20px; color: #666; }
        .language-selector { margin-top: 30px; text-align: center; }
        .language-selector select { padding: 10px 20px; font-size: 16px; border: none; border-radius: 25px; background: #667eea; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn">← Back to Home</a>
        <div class="tool-container">
            <div class="tool-header">
                <h1>⏰ Pomodoro Timer</h1>
                <p>Pomodoro timer for productivity</p>
            </div>
            <div class="tool-content">
                <div class="mode-selector">
                    <div class="mode-btn active" onclick="setMode(25)">Work</div>
                    <div class="mode-btn" onclick="setMode(5)">Short Break</div>
                    <div class="mode-btn" onclick="setMode(15)">Long Break</div>
                </div>
                <div class="timer-display">
                    <div class="time" id="timer">25:00</div>
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="startTimer()">Start</button>
                    <button class="btn btn-secondary" onclick="pauseTimer()">Pause</button>
                    <button class="btn btn-secondary" onclick="resetTimer()">Reset</button>
                </div>
                <div class="session-counter">
                    Sessions completed: <span id="sessions">0</span>
                </div>
            </div>
        </div>
    </div>
    <script>
        let timer = null;
        let timeLeft = 25 * 60;
        let isRunning = false;
        let sessions = 0;
        
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getLanguage();
            applyLanguage(lang);
            updateDisplay();
        });
        
        function setMode(minutes) {
            timeLeft = minutes * 60;
            updateDisplay();
            
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (timer) {
                clearInterval(timer);
                timer = null;
                isRunning = false;
            }
        }
        
        function startTimer() {
            if (isRunning) return;
            
            isRunning = true;
            timer = setInterval(() => {
                timeLeft--;
                updateDisplay();
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    timer = null;
                    isRunning = false;
                    
                    if (event.target.classList.contains('mode-btn')) {
                        sessions++;
                        document.getElementById('sessions').textContent = sessions;
                    }
                    
                    alert('Time\'s up!');
                }
            }, 1000);
        }
        
        function pauseTimer() {
            if (timer) {
                clearInterval(timer);
                timer = null;
                isRunning = false;
            }
        }
        
        function resetTimer() {
            pauseTimer();
            const activeMode = document.querySelector('.mode-btn.active');
            if (activeMode.textContent === 'Work') {
                timeLeft = 25 * 60;
            } else if (activeMode.textContent === 'Short Break') {
                timeLeft = 5 * 60;
            } else {
                timeLeft = 15 * 60;
            }
            updateDisplay();
        }
        
        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('timer').textContent = 
                String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
        }
        
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_open', { tool: 'pomodoro-timer' });
        }
    </script>
</body>
</html>
