<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Converter - Multi Tools</title>
    <meta name="description" content="Convert images between formats.">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lang.js"></script>
    <script>
        // 自动检测浏览器语言
        (function() {
            const browserLang = navigator.language.split('-')[0];
            const supportedLangs = ['en', 'zh', 'ja', 'ko', 'es', 'fr', 'de', 'ru', 'ar'];
            
            // 检查浏览器语言是否在支持列表中
            let lang = 'en'; // 默认英文
            if (supportedLangs.includes(browserLang)) {
                lang = browserLang;
            }
            
            // 保存到 localStorage
            localStorage.setItem('multi-tools-lang', lang);
            
            console.log('[AutoLang] Browser language:', browserLang, '=> Using:', lang);
        })();
    </script>
    <script>
        // 初始化语言
        document.addEventListener('DOMContentLoaded', function() {
            initLanguage();
            debugTranslations();
        });
    </script>
    <style>
        .tool-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 30px; }
        .tool-header h1 { color: #333; font-size: 2rem; margin-bottom: 10px; }
        .tool-header p { color: #666; }
        .tool-content { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .upload-area { border: 3px dashed #e0e0e0; border-radius: 15px; padding: 50px; text-align: center; cursor: pointer; }
        .upload-area:hover { border-color: #667eea; }
        .upload-area input { display: none; }
        .format-select { margin: 20px 0; }
        .format-select label { display: block; margin-bottom: 8px; font-weight: 600; }
        select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn { padding: 12px 30px; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .preview { margin-top: 20px; text-align: center; }
        .preview img { max-width: 100%; border-radius: 10px; }
        .language-selector { margin-top: 30px; text-align: center; }
        .language-selector select { padding: 10px 20px; font-size: 16px; border: none; border-radius: 25px; background: #667eea; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn" data-i18n="common.back_to_home">← Back to Home</a>
        <div class="tool-container">
            <div class="tool-header">
                <h1>🖼️ Image Converter</h1>
                <p>Convert images between formats</p>
            </div>
            <div class="tool-content">
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <div style="font-size: 3rem;">📁</div>
                    <h3 data-i18n="common.click_to_upload">Click to upload image</h3>
                    <input type="file" id="fileInput" accept="image/*" onchange="handleFile(event)">
                </div>
                <div class="format-select" id="formatControl" style="display: none;">
                    <label>Convert to:</label>
                    <select id="format">
                        <option value="image/png">PNG</option>
                        <option value="image/jpeg">JPEG</option>
                        <option value="image/webp">WebP</option>
                        <option value="image/bmp">BMP</option>
                    </select>
                </div>
                <div class="btn-group" id="btnGroup" style="display: none;">
                    <button class="btn btn-primary" onclick="convert()">Convert</button>
                    <button class="btn btn-primary" onclick="download()">Download</button>
                </div>
                <div class="preview" id="preview"></div>
            </div>
        </div>
    </div>
    <script>
        let originalFile = null;
        
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getLanguage();
            applyLanguage(lang);
        });
        
        function handleFile(event) {
            originalFile = event.target.files[0];
            if (!originalFile) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('preview').innerHTML = '<img src="' + e.target.result + '" alt="Preview">';
                document.getElementById('formatControl').style.display = 'block';
                document.getElementById('btnGroup').style.display = 'flex';
            };
            reader.readAsDataURL(originalFile);
        }
        
        function convert() {
            if (!originalFile) return;
            
            const format = document.getElementById('format').value;
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const ext = format.split('/')[1];
                    const link = document.createElement('a');
                    link.download = 'converted.' + ext;
                    link.href = url;
                    link.click();
                }, format);
            };
            img.src = URL.createObjectURL(originalFile);
        }
        
        function download() {
            convert();
        }
        
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_open', { tool: 'image-converter' });
        }
    </script>
</body>
</html>
