<body>
    <div class="container">
        <a href="/" class="back-btn">← 返回首页</a>
        <header>
            <h1>🔄 图片格式转换</h1>
            <p>免费在线转换JPG、PNG、WebP格式</p>
        </header>
        
        <div class="tool-card">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <div class="upload-text">点击上传或拖拽图片到此处</div>
                <input type="file" id="fileInput" accept="image/*">
            </div>
            
            <div class="file-info" id="fileInfo" style="display: none;">
                文件: <span id="fileName"></span> | 大小: <span id="fileSize"></span> | 类型: <span id="fileType"></span>
            </div>
            
            <div class="controls">
                <label>转换为格式：</label>
                <select id="formatSelect" class="format-select">
                    <option value="image/jpeg">JPG</option>
                    <option value="image/png">PNG</option>
                    <option value="image/webp">WebP</option>
                </select>
                <button class="btn" id="convertBtn" disabled>开始转换</button>
                <a id="downloadLink" class="btn" style="display: none; text-decoration: none;">下载</a>
            </div>
            
            <div class="preview-container" id="previewContainer" style="display: none;">
                <div class="preview-box">
                    <h3>原始图片</h3>
                    <img id="originalPreview" src="" alt="Original">
                    <p id="originalSize"></p>
                </div>
                <div class="preview-box">
                    <h3>转换后</h3>
                    <img id="convertedPreview" src="" alt="Converted">
                    <p id="convertedSize"></p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const convertBtn = document.getElementById('convertBtn');
        const downloadLink = document.getElementById('downloadLink');
        const formatSelect = document.getElementById('formatSelect');
        const fileInfo = document.getElementById('fileInfo');
        const previewContainer = document.getElementById('previewContainer');
        
        let currentFile = null;
        let originalDataURL = null;
        
        uploadArea.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) {
                currentFile = e.target.files[0];
                readFile(currentFile);
            }
        });
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#764ba2';
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                currentFile = file;
                fileInput.files = e.dataTransfer.files;
                readFile(file);
            }
        });
        
        function readFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                originalDataURL = e.target.result;
                
                document.getElementById('fileName').textContent = file.name;
                document.getElementById('fileSize').textContent = formatSize(file.size);
                document.getElementById('fileType').textContent = file.type;
                fileInfo.style.display = 'block';
                
                document.getElementById('originalPreview').src = originalDataURL;
                document.getElementById('originalSize').textContent = formatSize(file.size);
                
                convertBtn.disabled = false;
                previewContainer.style.display = 'grid';
            };
            reader.readAsDataURL(file);
        }
        
        function formatSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        convertBtn.addEventListener('click', () => {
            if (!currentFile) return;
            
            convertBtn.disabled = true;
            convertBtn.textContent = '转换中...';
            
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                
                const format = formatSelect.value;
                const quality = format === 'image/jpeg' ? 0.9 : 1.0;
                
                canvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    document.getElementById('convertedPreview').src = url;
                    document.getElementById('convertedSize').textContent = formatSize(blob.size);
                    
                    downloadLink.href = url;
                    downloadLink.download = currentFile.name.replace(/\.[^/.]+$/, '') + '.' + format.split('/')[1];
                    downloadLink.style.display = 'inline-block';
                    
                    convertBtn.disabled = false;
                    convertBtn.textContent = '开始转换';
                }, format, quality);
            };
            img.src = originalDataURL;
        });
    
        // 追踪按钮点击
        document.querySelector('button').addEventListener('click', () => {
            trackToolUsage('image-converter', 'click');
        });
</script>
