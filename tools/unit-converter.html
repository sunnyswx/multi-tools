<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter - Multi Tools</title>
    <meta name="description" content="Convert between different units.">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lang.js"></script>
    <script>
        // 自动检测浏览器语言
        (function() {
            const browserLang = navigator.language.split('-')[0];
            const supportedLangs = ['en', 'zh', 'ja', 'ko', 'es', 'fr', 'de', 'ru', 'ar'];
            
            // 检查浏览器语言是否在支持列表中
            let lang = 'en'; // 默认英文
            if (supportedLangs.includes(browserLang)) {
                lang = browserLang;
            }
            
            // 保存到 localStorage
            localStorage.setItem('multi-tools-lang', lang);
            
            console.log('[AutoLang] Browser language:', browserLang, '=> Using:', lang);
        })();
    </script>
    <script>
        // 初始化语言
        document.addEventListener('DOMContentLoaded', function() {
            initLanguage();
            debugTranslations();
        });
    </script>
    <style>
        .tool-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 30px; }
        .tool-header h1 { color: #333; font-size: 2rem; margin-bottom: 10px; }
        .tool-header p { color: #666; }
        .tool-content { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .converter-group { margin-bottom: 20px; }
        .converter-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input[type="number"] { width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        input[type="number"]:focus { outline: none; border-color: #667eea; }
        select { width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        .result-box { margin-top: 20px; padding: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 10px; color: white; font-size: 1.5rem; text-align: center; display: none; }
        .language-selector { margin-top: 30px; text-align: center; }
        .language-selector select { padding: 10px 20px; font-size: 16px; border: none; border-radius: 25px; background: #667eea; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn" data-i18n="common.back_to_home">← Back to Home/a>
        <div class="tool-container">
            <div class="tool-header">
                <h1>📏 Unit Converter</h1>
                <p>Convert between different units</p>
            </div>
            <div class="tool-content">
                <div class="converter-group">
                    <label>Category:</label>
                    <select id="category" onchange="updateUnits()">
                        <option value="length">Length</option>
                        <option value="weight">Weight</option>
                        <option value="temperature">Temperature</option>
                        <option value="area">Area</option>
                        <option value="volume">Volume</option>
                        <option value="speed">Speed</option>
                        <option value="data">Data</option>
                    </select>
                </div>
                <div class="converter-group">
                    <label>From:</label>
                    <select id="fromUnit"></select>
                    <input type="number" id="fromValue" placeholder="Enter value" oninput="convert()">
                </div>
                <div class="converter-group">
                    <label>To:</label>
                    <select id="toUnit"></select>
                </div>
                <div class="result-box" id="result"></div>
            </div>
        </div>
    </div>
    <script>
        const units = {
            length: { m: 1, km: 0.001, cm: 100, mm: 1000, mi: 0.000621371, yd: 1.09361, ft: 3.28084, in: 39.3701 },
            weight: { kg: 1, g: 1000, mg: 1000000, lb: 2.20462, oz: 35.274 },
            temperature: { C: 'C', F: 'F', K: 'K' },
            area: { m2: 1, km2: 0.000001, ha: 0.0001, acre: 0.000247105, ft2: 10.7639 },
            volume: { l: 1, ml: 1000, gal: 0.264172, qt: 1.05669, pt: 2.11338, cup: 4.22675 },
            speed: { 'm/s': 1, 'km/h': 3.6, 'mph': 2.23694, 'knot': 1.94384 },
            data: { B: 1, KB: 0.001, MB: 0.000001, GB: 0.000000001, TB: 0.000000000001 }
        };
        
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getLanguage();
            applyLanguage(lang);
            updateUnits();
        });
        
        function updateUnits() {
            const category = document.getElementById('category').value;
            const fromSelect = document.getElementById('fromUnit');
            const toSelect = document.getElementById('toUnit');
            
            fromSelect.innerHTML = '';
            toSelect.innerHTML = '';
            
            Object.keys(units[category]).forEach(unit => {
                fromSelect.add(new Option(unit, unit));
                toSelect.add(new Option(unit, unit));
            });
            
            if (fromSelect.options.length > 1) {
                toSelect.selectedIndex = 1;
            }
        }
        
        function convert() {
            const category = document.getElementById('category').value;
            const from = document.getElementById('fromUnit').value;
            const to = document.getElementById('toUnit').value;
            const value = parseFloat(document.getElementById('fromValue').value);
            
            if (isNaN(value)) {
                document.getElementById('result').style.display = 'none';
                return;
            }
            
            let result;
            
            if (category === 'temperature') {
                result = convertTemperature(value, from, to);
            } else {
                const fromFactor = units[category][from];
                const toFactor = units[category][to];
                result = value * fromFactor / toFactor;
            }
            
            document.getElementById('result').textContent = value + ' ' + from + ' = ' + result.toFixed(4) + ' ' + to;
            document.getElementById('result').style.display = 'block';
        }
        
        function convertTemperature(value, from, to) {
            if (from === to) return value;
            
            let celsius;
            if (from === 'C') celsius = value;
            else if (from === 'F') celsius = (value - 32) * 5/9;
            else celsius = value - 273.15;
            
            if (to === 'C') return celsius;
            else if (to === 'F') return celsius * 9/5 + 32;
            else return celsius + 273.15;
        }
        
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_open', { tool: 'unit-converter' });
        }
    </script>
</body>
</html>
