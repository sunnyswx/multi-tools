<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter - Free Online Tool | Multi Tools</title>
    <meta name="description" content="Free online unit converter. Convert length, weight, temperature, area, volume and more. Fast and accurate conversions.">
    <meta name="keywords" content="unit converter, conversion, length, weight, temperature, online tool">
    
    <!-- GA4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        header { text-align: center; padding: 40px 20px; color: white; }
        header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .back-btn { display: inline-block; margin-bottom: 20px; padding: 10px 20px; background: rgba(255,255,255,0.2); color: white; text-decoration: none; border-radius: 25px; }
        .tool-content { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .category-tabs { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; }
        .tab-btn { padding: 10px 20px; background: #f0f0f0; border: none; border-radius: 20px; cursor: pointer; transition: all 0.3s; }
        .tab-btn.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .converter-box { display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; align-items: center; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-weight: bold; margin-bottom: 8px; color: #333; }
        .input-group input, .input-group select { padding: 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; }
        .input-group input:focus, .input-group select:focus { outline: none; border-color: #667eea; }
        .swap-btn { padding: 15px; background: #667eea; color: white; border: none; border-radius: 50%; cursor: pointer; font-size: 20px; transition: all 0.3s; }
        .swap-btn:hover { transform: rotate(180deg); }
        .result-box { background: #f8f9fa; padding: 20px; border-radius: 10px; text-align: center; margin-top: 30px; }
        .result-value { font-size: 2rem; color: #667eea; font-weight: bold; }
        @media (max-width: 768px) { .converter-box { grid-template-columns: 1fr; } .swap-btn { transform: rotate(90deg); margin: 10px auto; } }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-btn">← Back to Home</a>
        <header>
            <h1>📏 Unit Converter</h1>
            <p>Convert between different units of measurement</p>
        </header>
        <main class="tool-content">
            <div class="category-tabs">
                <button class="tab-btn active" onclick="switchCategory('length')">Length</button>
                <button class="tab-btn" onclick="switchCategory('weight')">Weight</button>
                <button class="tab-btn" onclick="switchCategory('temperature')">Temperature</button>
                <button class="tab-btn" onclick="switchCategory('area')">Area</button>
                <button class="tab-btn" onclick="switchCategory('volume')">Volume</button>
            </div>
            
            <div class="converter-box">
                <div class="input-group">
                    <label>From</label>
                    <select id="fromUnit" onchange="convert()"></select>
                    <input type="number" id="fromValue" oninput="convert()" placeholder="Enter value">
                </div>
                <button class="swap-btn" onclick="swapUnits()">⇄</button>
                <div class="input-group">
                    <label>To</label>
                    <select id="toUnit" onchange="convert()"></select>
                    <input type="number" id="toValue" readonly placeholder="Result">
                </div>
            </div>
            
            <div class="result-box">
                <div class="result-value" id="resultText">Enter a value to convert</div>
            </div>
        </main>
    </div>
    
    <script>
        const units = {
            length: ['Meter', 'Kilometer', 'Centimeter', 'Millimeter', 'Mile', 'Yard', 'Foot', 'Inch'],
            weight: ['Kilogram', 'Gram', 'Milligram', 'Pound', 'Ounce', 'Ton'],
            temperature: ['Celsius', 'Fahrenheit', 'Kelvin'],
            area: ['Square Meter', 'Square Kilometer', 'Square Foot', 'Acre', 'Hectare'],
            volume: ['Liter', 'Milliliter', 'Gallon', 'Quart', 'Pint', 'Cup']
        };
        
        const conversionRates = {
            length: { Meter: 1, Kilometer: 1000, Centimeter: 0.01, Millimeter: 0.001, Mile: 1609.34, Yard: 0.9144, Foot: 0.3048, Inch: 0.0254 },
            weight: { Kilogram: 1, Gram: 0.001, Milligram: 0.000001, Pound: 0.453592, Ounce: 0.0283495, Ton: 1000 },
            area: { Square Meter: 1, Square Kilometer: 1000000, Square Foot: 0.092903, Acre: 4046.86, Hectare: 10000 },
            volume: { Liter: 1, Milliliter: 0.001, Gallon: 3.78541, Quart: 0.946353, Pint: 0.473176, Cup: 0.236588 }
        };
        
        let currentCategory = 'length';
        
        function switchCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('fromUnit').innerHTML = units[category].map(u => `<option value="${u}">${u}</option>`).join('');
            document.getElementById('toUnit').innerHTML = units[category].map(u => `<option value="${u}">${u}</option>`).join('');
            
            if (category === 'temperature') {
                document.getElementById('toUnit').selectedIndex = 1;
            }
            
            convert();
        }
        
        function convert() {
            const fromValue = parseFloat(document.getElementById('fromValue').value);
            const fromUnit = document.getElementById('fromUnit').value;
            const toUnit = document.getElementById('toUnit').value;
            
            if (isNaN(fromValue)) {
                document.getElementById('toValue').value = '';
                document.getElementById('resultText').textContent = 'Enter a value to convert';
                return;
            }
            
            let result;
            
            if (currentCategory === 'temperature') {
                result = convertTemperature(fromValue, fromUnit, toUnit);
            } else {
                const rates = conversionRates[currentCategory];
                const baseValue = fromValue * rates[fromUnit];
                result = baseValue / rates[toUnit];
            }
            
            document.getElementById('toValue').value = result.toFixed(6).replace(/\.?0+$/, '');
            document.getElementById('resultText').textContent = `${fromValue} ${fromUnit} = ${result.toFixed(6).replace(/\.?0+$/, '')} ${toUnit}`;
        }
        
        function convertTemperature(value, from, to) {
            if (from === to) return value;
            
            let celsius;
            if (from === 'Celsius') celsius = value;
            else if (from === 'Fahrenheit') celsius = (value - 32) * 5/9;
            else celsius = value - 273.15;
            
            if (to === 'Celsius') return celsius;
            else if (to === 'Fahrenheit') return celsius * 9/5 + 32;
            else return celsius + 273.15;
        }
        
        function swapUnits() {
            const fromSelect = document.getElementById('fromUnit');
            const toSelect = document.getElementById('toUnit');
            const temp = fromSelect.value;
            fromSelect.value = toSelect.value;
            toSelect.value = temp;
            convert();
        }
        
        // Initialize
        switchCategory('length');
        
        // Track usage
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_usage', { 'event_category': 'tools', 'event_label': 'unit-converter', 'value': 1 });
        }
    </script>
</body>
</html>
