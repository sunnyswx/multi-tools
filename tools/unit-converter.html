        // 问题反馈功能
        function submitFeedback(e) {

            const type = document.getElementById('feedbackType').value;

                type: type,
                message: message,
                browser: includeBrowser ? navigator.userAgent : ''
            };
            
            // 保存到localStorage
            try {
                const feedbacks = JSON.parse(localStorage.getItem('feedbacks') || '[]');
                feedbacks.push(feedbackData);
                localStorage.setItem('feedbacks', JSON.stringify(feedbacks));
                
                // 显示成功消息

    <script>
        // 长度转换
        function convertLength() {
            const value = parseFloat(document.getElementById('lengthValue').value) || 0;
            const unit = document.getElementById('lengthUnit').value;
            
            const toMeters = {
                m: 1, km: 1000, cm: 0.01, mm: 0.001,
                mi: 1609.34, yd: 0.9144, ft: 0.3048, in: 0.0254
            };
            
            const meters = value * toMeters[unit];
            const result = meters * 100; // 转换为厘米
            
            document.getElementById('lengthResult').textContent = `${value} ${unit} = ${result.toFixed(2)} 厘米`;
        }
        
        // 重量转换
        function convertWeight() {
            const value = parseFloat(document.getElementById('weightValue').value) || 0;
            const unit = document.getElementById('weightUnit').value;
            
            const toGrams = {
                kg: 1000, g: 1, mg: 0.001,
                lb: 453.592, oz: 28.3495, ton: 1000000
            };
            
            const grams = value * toGrams[unit];
            document.getElementById('weightResult').textContent = `${value} ${unit} = ${grams.toFixed(2)} 克`;
        }
        
        // 温度转换
        function convertTemp() {
            const value = parseFloat(document.getElementById('tempValue').value) || 0;
            const unit = document.getElementById('tempUnit').value;
            
            let celsius, fahrenheit, kelvin;
            
            if (unit === 'c') {
                celsius = value;
                fahrenheit = value * 9/5 + 32;
                kelvin = value + 273.15;
            } else if (unit === 'f') {
                celsius = (value - 32) * 5/9;
                fahrenheit = value;
                kelvin = celsius + 273.15;
            } else {
                celsius = value - 273.15;
                fahrenheit = celsius * 9/5 + 32;
                kelvin = value;
            }
            
            document.getElementById('tempResult').textContent = 
                `${value}°${unit.toUpperCase()} = ${celsius.toFixed(2)}°C = ${fahrenheit.toFixed(2)}°F = ${kelvin.toFixed(2)}K`;
        }
        
        // 面积转换
        function convertArea() {
            const value = parseFloat(document.getElementById('areaValue').value) || 0;
            const unit = document.getElementById('areaUnit').value;
            
            const toM2 = {
                m2: 1, km2: 1000000, cm2: 0.0001,
                ha: 10000, acre: 4046.86, ft2: 0.092903
            };
            
            const m2 = value * toM2[unit];
            const result = m2 * 10000; // 转换为平方厘米
            
            document.getElementById('areaResult').textContent = `${value} ${unit} = ${result.toFixed(2)} 平方厘米`;
        }
        
        // 初始化
        convertLength();
        convertWeight();
        convertTemp();
        convertArea();

</script>
