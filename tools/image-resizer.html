    <script>
        // 问题反馈功能
        function submitFeedback(e) {
            e.preventDefault();
            
            const name = document.getElementById('feedbackName').value.trim();
            const email = document.getElementById('feedbackEmail').value.trim();
            const type = document.getElementById('feedbackType').value;
            const message = document.getElementById('feedbackMessage').value.trim();
            const includeBrowser = document.getElementById('feedbackBrowser').checked;
            
            if (!message) {
                alert('请填写问题描述！');
                return;
            }
            
            // 构建反馈数据
            const feedbackData = {
                tool: '""" + tool_name + """',
                timestamp: new Date().toISOString(),
                name: name || '匿名用户',
                email: email || '',
                type: type,
                message: message,
                browser: includeBrowser ? navigator.userAgent : ''
            };
            
            // 保存到localStorage
            try {
                const feedbacks = JSON.parse(localStorage.getItem('feedbacks') || '[]');
                feedbacks.push(feedbackData);
                localStorage.setItem('feedbacks', JSON.stringify(feedbacks));
                
                // 显示成功消息
                document.getElementById('feedbackSuccess').style.display = 'block';
                document.getElementById('feedbackError').style.display = 'none';
                
                // 清空表单
                document.getElementById('feedbackForm').reset();
                
                trackToolUsage('""" + tool_name + """', 'feedback');
                
                // 3秒后隐藏成功消息
                setTimeout(() => {
                    document.getElementById('feedbackSuccess').style.display = 'none';
                }, 3000);
            } catch (error) {
                // 显示错误消息
                document.getElementById('feedbackError').style.display = 'block';
                document.getElementById('feedbackSuccess').style.display = 'none';
                console.error('反馈提交失败:', error);
            }
        }
    </script>

    <script>
        let originalImage = null;
        let originalFileName = '';
        
        // 文件上传处理
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });
        
        // 拖拽上传
        const uploadArea = document.getElementById('uploadArea');
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#764ba2';
            uploadArea.style.background = '#f0f0f0';
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = '#667eea';
            uploadArea.style.background = '#f8f9fa';
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#667eea';
            uploadArea.style.background = '#f8f9fa';
            
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            }
        });
        
        function handleFile(file) {
            originalFileName = file.name;
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    originalImage = img;
                    
                    // 显示原始预览
                    document.getElementById('originalPreview').src = e.target.result;
                    document.getElementById('originalPreview').style.display = 'block';
                    document.getElementById('originalInfo').style.display = 'block';
                    document.getElementById('originalInfo').textContent = `原始尺寸: ${img.width} x ${img.height}`;
                    
                    // 填充输入框
                    document.getElementById('widthInput').value = img.width;
                    document.getElementById('heightInput').value = img.height;
                    
                    trackToolUsage('image-resizer', 'upload');
                };
                img.src = e.target.result;
            };
            
            reader.readAsDataURL(file);
        }
        
        // 保持宽高比
        document.getElementById('widthInput').addEventListener('input', function() {
            if (document.getElementById('maintainRatio').checked && originalImage) {
                const ratio = originalImage.height / originalImage.width;
                document.getElementById('heightInput').value = Math.round(this.value * ratio);
            }
        });
        
        document.getElementById('heightInput').addEventListener('input', function() {
            if (document.getElementById('maintainRatio').checked && originalImage) {
                const ratio = originalImage.width / originalImage.height;
                document.getElementById('widthInput').value = Math.round(this.value * ratio);
            }
        });
        
        function resizeImage() {
            if (!originalImage) {
                alert('请先上传图片！');
                return;
            }
            
            const width = parseInt(document.getElementById('widthInput').value);
            const height = parseInt(document.getElementById('heightInput').value);
            
            if (!width || !height || width < 1 || height < 1) {
                alert('请输入有效的尺寸！');
                return;
            }
            
            // 创建canvas并调整大小
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(originalImage, 0, 0, width, height);
            
            // 获取调整后的图片
            const resizedDataUrl = canvas.toDataURL('image/jpeg', 0.9);
            
            // 显示预览
            document.getElementById('resizedPreview').src = resizedDataUrl;
            document.getElementById('resizedPreview').style.display = 'block';
            document.getElementById('resizedInfo').style.display = 'block';
            document.getElementById('resizedInfo').textContent = `调整后: ${width} x ${height}`;
            
            // 显示统计
            document.getElementById('statsContainer').style.display = 'flex';
            document.getElementById('originalSize').textContent = `${originalImage.width}x${originalImage.height}`;
            document.getElementById('resizedSize').textContent = `${width}x${height}`;
            
            // 计算文件大小
            const bytes = Math.round(resizedDataUrl.length * 0.75);
            document.getElementById('fileSize').textContent = formatBytes(bytes);
            
            trackToolUsage('image-resizer', 'resize');
        }
        
        function downloadImage() {
            const resizedPreview = document.getElementById('resizedPreview');
            if (!resizedPreview.src || resizedPreview.style.display === 'none') {
                alert('请先调整图片大小！');
                return;
            }
            
            const link = document.createElement('a');
            link.download = 'resized_' + originalFileName;
            link.href = resizedPreview.src;
            link.click();
            
            trackToolUsage('image-resizer', 'download');
        }
        
        function resetImage() {
            if (originalImage) {
                document.getElementById('widthInput').value = originalImage.width;
                document.getElementById('heightInput').value = originalImage.height;
            }
        }
        
        function clearAll() {
            originalImage = null;
            originalFileName = '';
            
            document.getElementById('fileInput').value = '';
            document.getElementById('originalPreview').style.display = 'none';
            document.getElementById('originalInfo').style.display = 'none';
            document.getElementById('resizedPreview').style.display = 'none';
            document.getElementById('resizedInfo').style.display = 'none';
            document.getElementById('statsContainer').style.display = 'none';
            
            document.getElementById('widthInput').value = '';
            document.getElementById('heightInput').value = '';
            
            trackToolUsage('image-resizer', 'clear');
        }
        
        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
