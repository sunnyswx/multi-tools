    <script src="lang-helper.js"></script> <style> * { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; } .container { max-width: 1000px; margin: 0 auto; } header { text-align: center; padding: 40px 20px; color: white; } header h1 { font-size: 2.5rem; margin-bottom: 10px; } .back-btn { display: inline-block; margin-bottom: 20px; padding: 10px 20px; background: rgba(255,255,255,0.2); color: white; text-decoration: none; border-radius: 25px; } .tool-content { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); } .upload-area { border: 3px dashed #e0e0e0; border-radius: 15px; padding: 40px; text-align: center; cursor: pointer; transition: all 0.3s; margin: 20px 0; } .upload-area:hover { border-color: #667eea; background: #f8f9fa; } .preview-container { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin: 30px 0; } .preview-box { text-align: center; } .preview-box img { max-width: 100%; max-height: 300px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); } .preview-box h3 { margin-bottom: 10px; color: #333; } .controls { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 30px; } .control-group { display: flex; flex-direction: column; } .control-group label { font-weight: bold; margin-bottom: 8px; } .control-group input, .control-group select { padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; } .aspect-ratio-btn { padding: 8px 15px; background: #f0f0f0; border: none; border-radius: 5px; cursor: pointer; margin: 5px; } .aspect-ratio-btn.active { background: #667eea; color: white; } .btn { padding: 12px 30px; border: none; border-radius: 25px; cursor: pointer; font-size: 16px; transition: all 0.3s; margin: 10px 5px; } .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; } .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); } .btn-secondary { background: #f0f0f0; color: #333; } @media (max-width: 768px) { .preview-container { grid-template-columns: 1fr; } .controls { grid-template-columns: 1fr; } } </style> </head> <body> <div class="container"> <a href="/" class="back-btn">← Back to Home</a> <header> <h1>🖼️ Image Resizer</h1> <p>Resize images to custom dimensions</p> </header> <main class="tool-content"> <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()"> <div style="font-size: 3rem; margin-bottom: 10px;">📁</div> <h3>Upload an image to resize</h3> <p style="color: #666;">Support JPG, PNG, WebP</p> </div> <input type="file" id="fileInput" accept="image/*" style="display: none" onchange="handleFile(this.files[0])"> <div class="preview-container" id="previewContainer" style="display: none;"> <div class="preview-box"> <h3>Original</h3> <img id="originalPreview" src="" alt="Original"> <p id="originalSize"></p> </div> <div class="preview-box"> <h3>Resized</h3> <img id="resizedPreview" src="" alt="Resized"> <p id="resizedSize"></p> </div> </div> <div class="controls" id="controls" style="display: none;"> <div class="control-group"> <label>Width (px)</label> <input type="number" id="width" placeholder="Width"> </div> <div class="control-group"> <label>Height (px)</label> <input type="number" id="height" placeholder="Height"> </div> <div class="control-group"> <label>Format</label> <select id="format"> <option value="image/jpeg">JPG</option> <option value="image/png">PNG</option> <option value="image/webp">WebP</option> </select> </div> <div class="control-group"> <label>Quality</label> <input type="range" id="quality" min="10" max="100" value="90"> <span id="qualityValue">90%</span> </div> </div> <div style="text-align: center;"> <button class="btn btn-primary" onclick="resizeImage()" id="resizeBtn" style="display: none;">🔄 Resize</button> <button class="btn btn-secondary" onclick="downloadImage()" id="downloadBtn" style="display: none;">⬇️ Download</button> </div> </main> </div> <script> let originalImage = null; let maintainAspectRatio = true; const uploadArea = document.getElementById('uploadArea'); uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); }); uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover')); uploadArea.addEventListener('drop', (e) => { e.preventDefault(); uploadArea.classList.remove('dragover'); handleFile(e.dataTransfer.files[0]); }); document.getElementById('quality').addEventListener('input', (e) => { document.getElementById('qualityValue').textContent = e.target.value + '%'; }); document.getElementById('width').addEventListener('input', function() { if (maintainAspectRatio && originalImage) { const ratio = originalImage.height / originalImage.width; document.getElementById('height').value = Math.round(this.value * ratio); } resizeImage(); }); document.getElementById('height').addEventListener('input', function() { if (maintainAspectRatio && originalImage) { const ratio = originalImage.width / originalImage.height; document.getElementById('width').value = Math.round(this.value * ratio); } resizeImage(); }); function handleFile(file) { if (!file || !file.type.startsWith('image/')) { alert('Please upload an image file!'); return; } const reader = new FileReader(); reader.onload = (e) => { const img = new Image(); img.onload = () => { originalImage = img; document.getElementById('originalPreview').src = e.target.result; document.getElementById('originalSize').textContent = `${img.width} × ${img.height} px`; document.getElementById('width').value = img.width; document.getElementById('height').value = img.height; document.getElementById('previewContainer').style.display = 'grid'; document.getElementById('controls').style.display = 'grid'; document.getElementById('resizeBtn').style.display = 'inline-block'; resizeImage(); }; img.src = e.target.result; }; reader.readAsDataURL(file); } function resizeImage() { if (!originalImage) return; const width = parseInt(document.getElementById('width').value) || originalImage.width; const height = parseInt(document.getElementById('height').value) || originalImage.height; const format = document.getElementById('format').value; const quality = parseInt(document.getElementById('quality').value) / 100; const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.drawImage(originalImage, 0, 0, width, height); const dataUrl = canvas.toDataURL(format, quality); document.getElementById('resizedPreview').src = dataUrl; document.getElementById('resizedSize').textContent = `${width} × ${height} px`; document.getElementById('downloadBtn').style.display = 'inline-block'; } function downloadImage() { const width = document.getElementById('width').value; const height = document.getElementById('height').value; const format = document.getElementById('format').value.split('/')[1]; const link = document.createElement('a'); link.download = `resized_${width}x${height}.${format}`; link.href = document.getElementById('resizedPreview').src; link.click(); } function clearAll() { originalImage = null; document.getElementById('previewContainer').style.display = 'none'; document.getElementById('controls').style.display = 'none'; document.getElementById('resizeBtn').style.display = 'none'; document.getElementById('downloadBtn').style.display = 'none'; } // Track usage if (typeof gtag !== 'undefined') { gtag('event', 'tool_usage', { 'event_category': 'tools', 'event_label': 'image-resizer', 'value': 1 }); } </script> </body> </html>
