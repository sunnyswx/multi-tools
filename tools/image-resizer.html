<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Resizer - Multi Tools</title>
    <meta name="description" content="Resize images online.">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lang.js"></script>
    <style>
        .tool-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 30px; }
        .tool-header h1 { color: #333; font-size: 2rem; margin-bottom: 10px; }
        .tool-header p { color: #666; }
        .tool-content { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .upload-area { border: 3px dashed #e0e0e0; border-radius: 15px; padding: 50px; text-align: center; cursor: pointer; margin-bottom: 20px; }
        .upload-area:hover { border-color: #667eea; }
        .upload-area input { display: none; }
        .size-inputs { display: flex; gap: 15px; margin-bottom: 20px; }
        .size-input { flex: 1; }
        .size-input label { display: block; margin-bottom: 8px; font-weight: 600; }
        .size-input input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        .checkbox { margin-bottom: 20px; }
        .checkbox label { cursor: pointer; }
        .btn-group { display: flex; gap: 10px; }
        .btn { padding: 12px 30px; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .preview { margin-top: 20px; text-align: center; }
        .preview img { max-width: 100%; border-radius: 10px; }
        .language-selector { margin-top: 30px; text-align: center; }
        .language-selector select { padding: 10px 20px; font-size: 16px; border: none; border-radius: 25px; background: #667eea; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn">← Back to Home</a>
        <div class="tool-container">
            <div class="tool-header">
                <h1>📐 Image Resizer</h1>
                <p>Resize images online</p>
            </div>
            <div class="tool-content">
                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <div style="font-size: 3rem;">📁</div>
                    <h3>Click to upload image</h3>
                    <input type="file" id="fileInput" accept="image/*" onchange="handleFile(event)">
                </div>
                <div class="size-inputs" id="sizeControl" style="display: none;">
                    <div class="size-input">
                        <label>Width (px):</label>
                        <input type="number" id="width" placeholder="Width">
                    </div>
                    <div class="size-input">
                        <label>Height (px):</label>
                        <input type="number" id="height" placeholder="Height">
                    </div>
                </div>
                <div class="checkbox" id="aspectControl" style="display: none;">
                    <label><input type="checkbox" id="keepAspect" checked> Maintain aspect ratio</label>
                </div>
                <div class="btn-group" id="btnGroup" style="display: none;">
                    <button class="btn btn-primary" onclick="resize()">Resize</button>
                    <button class="btn btn-primary" onclick="download()">Download</button>
                </div>
                <div class="preview" id="preview"></div>
            </div>
            <div class="language-selector">
                <select id="langSelect" onchange="changeLanguage(this.value)">
                    <option value="en">English</option>
                    <option value="zh">中文</option>
                    <option value="ja">日本語</option>
                    <option value="ko">한국어</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                    <option value="ru">Русский</option>
                    <option value="ar">العربية</option>
                </select>
            </div>
        </div>
    </div>
    <script>
        let originalFile = null;
        let originalWidth = 0;
        let originalHeight = 0;
        
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getLanguage();
            applyLanguage(lang);
            
            document.getElementById('width').addEventListener('input', function() {
                if (document.getElementById('keepAspect').checked && originalWidth) {
                    document.getElementById('height').value = Math.round(this.value * originalHeight / originalWidth);
                }
            });
            document.getElementById('height').addEventListener('input', function() {
                if (document.getElementById('keepAspect').checked && originalHeight) {
                    document.getElementById('width').value = Math.round(this.value * originalWidth / originalHeight);
                }
            });
        });
        
        function handleFile(event) {
            originalFile = event.target.files[0];
            if (!originalFile) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    originalWidth = img.naturalWidth;
                    originalHeight = img.naturalHeight;
                    document.getElementById('width').value = originalWidth;
                    document.getElementById('height').value = originalHeight;
                    document.getElementById('sizeControl').style.display = 'flex';
                    document.getElementById('aspectControl').style.display = 'block';
                    document.getElementById('btnGroup').style.display = 'flex';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(originalFile);
        }
        
        function resize() {
            if (!originalFile) return;
            
            const targetWidth = parseInt(document.getElementById('width').value);
            const targetHeight = parseInt(document.getElementById('height').value);
            
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = targetWidth;
                canvas.height = targetHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, targetWidth, targetHeight);
                
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.download = 'resized-' + originalFile.name;
                    link.href = url;
                    link.click();
                });
            };
            img.src = URL.createObjectURL(originalFile);
        }
        
        function download() {
            resize();
        }
        
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_open', { tool: 'image-resizer' });
        }
    </script>
</body>
</html>
