<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength - Multi Tools</title>
    <meta name="description" content="Check password strength and security.">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lang.js"></script>
    <script>
        // 自动检测浏览器语言
        (function() {
            const browserLang = navigator.language.split('-')[0];
            const supportedLangs = ['en', 'zh', 'ja', 'ko', 'es', 'fr', 'de', 'ru', 'ar'];
            
            // 检查浏览器语言是否在支持列表中
            let lang = 'en'; // 默认英文
            if (supportedLangs.includes(browserLang)) {
                lang = browserLang;
            }
            
            // 保存到 localStorage
            localStorage.setItem('multi-tools-lang', lang);
            
            console.log('[AutoLang] Browser language:', browserLang, '=> Using:', lang);
        })();
    </script>
    <script>
        // 初始化语言
        document.addEventListener('DOMContentLoaded', function() {
            initLanguage();
            debugTranslations();
        });
    </script>
    <style>
        .tool-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 30px; }
        .tool-header h1 { color: #333; font-size: 2rem; margin-bottom: 10px; }
        .tool-header p { color: #666; }
        .tool-content { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input[type="password"], input[type="text"] { width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; }
        .strength-meter { height: 10px; background: #e0e0e0; border-radius: 5px; margin-top: 10px; overflow: hidden; }
        .strength-bar { height: 100%; width: 0; transition: all 0.3s; }
        .strength-text { margin-top: 10px; font-weight: 600; }
        .tips { margin-top: 20px; padding: 20px; background: #f8f9fa; border-radius: 10px; }
        .tips h3 { margin-top: 0; }
        .tips ul { margin: 0; padding-left: 20px; }
        .tips li { margin-bottom: 8px; }
        .language-selector { margin-top: 30px; text-align: center; }
        .language-selector select { padding: 10px 20px; font-size: 16px; border: none; border-radius: 25px; background: #667eea; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn" data-i18n="common.back_to_home">← Back to Home/a>
        <div class="tool-container">
            <div class="tool-header">
                <h1>🔐 Password Strength Checker</h1>
                <p>Check password strength and security</p>
            </div>
            <div class="tool-content">
                <div class="input-group">
                    <label>Enter Password:</label>
                    <input type="password" id="passwordInput" placeholder="Type your password..." oninput="checkStrength()">
                    <div class="strength-meter">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <div class="strength-text" id="strengthText"></div>
                </div>
                <div class="tips">
                    <h3>Password Tips:</h3>
                    <ul>
                        <li>Use at least 8 characters</li>
                        <li>Mix uppercase and lowercase letters</li>
                        <li>Include numbers and symbols</li>
                        <li>Avoid common words and patterns</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getLanguage();
            applyLanguage(lang);
        });
        
        function checkStrength() {
            const password = document.getElementById('passwordInput').value;
            let strength = 0;
            
            if (password.length >= 8) strength++;
            if (password.length >= 12) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');
            
            const levels = [
                { width: '0%', color: '#e0e0e0', text: '' },
                { width: '20%', color: '#e74c3c', text: 'Very Weak' },
                { width: '40%', color: '#e67e22', text: 'Weak' },
                { width: '60%', color: '#f39c12', text: 'Moderate' },
                { width: '80%', color: '#2ecc71', text: 'Strong' },
                { width: '100%', color: '#27ae60', text: 'Very Strong' }
            ];
            
            const level = levels[strength] || levels[0];
            bar.style.width = level.width;
            bar.style.background = level.color;
            text.textContent = level.text;
            text.style.color = level.color;
        }
        
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_open', { tool: 'password-strength' });
        }
    </script>
</body>
</html>
