ion checkStrength() { const password = document.getElementById('password').value; if (!password) { resetResult(); return; } // const checks = { length: password.length >= 8, upper: /[A-Z]/.test(password), lower: /[a-z]/.test(password), number: /[0-9]/.test(password), special: /[^A-Za-z0-9]/.test(password), variety: new Set(password.split('')).size >= 6 }; // updateCriteria(checks); // let score = 0; if (checks.length) score += 2; if (checks.upper) score += 1; if (checks.lower) score += 1; if (checks.number) score += 1; if (checks.special) score += 2; if (checks.variety) score += 1; // let strength, desc, className; if (score <= 2) { strength = ''; desc = '，'; className = 'strength-weak'; } else if (score <= 4) { strength = ''; desc = '，'; className = 'strength-fair'; } else if (score <= 5) { strength = ''; desc = '，'; className = 'strength-good'; } else { strength = ''; desc = '，'; className = 'strength-strong'; } const result = document.getElementById('result'); result.className = 'result ' + className; document.getElementById('strength-text').textContent = strength; document.getElementById('strength-desc').textContent = desc; const meter = document.getElementById('strength-meter'); meter.className = 'strength-meter-fill ' + className; // showTips(checks); } function updateCriteria(checks) { const criteriaMap = { length: 'c-length', upper: 'c-upper', lower: 'c-lower', number: 'c-number', special: 'c-special', variety: 'c-variety' }; for (const [key, id] of Object.entries(criteriaMap)) { const el = document.getElementById(id); if (checks[key]) { el.className = 'criteria-item pass'; el.innerHTML = '<span>✅</span><span>' + el.querySelector('span:last-child').textContent + '</span>'; } else { el.className = 'criteria-item fail'; el.innerHTML = '<span>❌</span><span>' + el.querySelector('span:last-child').textContent + '</span>'; } } } function showTips(checks) { const tips = []; if (!checks.length) tips.push('8'); if (!checks.upper) tips.push('（A-Z）'); if (!checks.lower) tips.push('（a-z）'); if (!checks.number) tips.push('（0-9）'); if (!checks.special) tips.push('（!@#$%^&*）'); if (!checks.variety) tips.push(''); const tipsDiv = document.getElementById('tips'); const tipsList = document.getElementById('tips-list'); if (tips.length > 0) { tipsDiv.style.display = 'block'; tipsList.innerHTML = tips.map(tip => '<li>' + tip + '</li>').join(''); } else { tipsDiv.style.display = 'none'; } } function resetResult() { document.getElementById('result').className = 'result'; document.getElementById('strength-text').textContent = ''; document.getElementById('strength-desc').textContent = ''; document.getElementById('strength-meter').className = 'strength-meter-fill'; document.getElementById('tips').style.display = 'none'; const criteriaItems = document.querySelectorAll('.criteria-item'); criteriaItems.forEach(item => { item.className = 'criteria-item'; const span = item.querySelector('span:first-child'); if (span) span.textContent = getIcon(item.textContent.trim()); }); } function getIcon(text) { if (text.includes('')) return '📏'; if (text.includes('')) return '🔤'; if (text.includes('')) return '🔡'; if (text.includes('')) return '🔢'; if (text.includes('')) return '⚡'; if (text.includes('')) return '🎯'; return '○'; } // if (typeof gtag !== 'undefined') { gtag('event', 'tool_usage', { 'event_category': 'tools', 'event_label': 'password-strength', 'value': 1 }); } </script> </body> </html>
