<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码强度检测器 - 免费在线工具 | Multi Tools</title>
    <meta name="description" content="在线检测密码强度，分析密码安全性，提供改进建议，免费使用">
    
    <!-- GA4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 40px 20px;
            color: white;
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: all 0.3s;
        }
        
        .back-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .tool-content {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .input-area {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 20px;
        }
        
        .input-area:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .strength-meter {
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        .strength-meter-fill {
            height: 100%;
            width: 0%;
            transition: all 0.3s;
        }
        
        .strength-weak { background: #ff6b6b; width: 25%; }
        .strength-fair { background: #ffd93d; width: 50%; }
        .strength-good { background: #6bcf7f; width: 75%; }
        .strength-strong { background: #4ecdc4; width: 100%; }
        
        .result {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .result h3 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .result-value {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .strength-weak .result-value { color: #ff6b6b; }
        .strength-fair .result-value { color: #ffd93d; }
        .strength-good .result-value { color: #6bcf7f; }
        .strength-strong .result-value { color: #4ecdc4; }
        
        .tips {
            margin-top: 20px;
            padding: 20px;
            background: #f0f7ff;
            border-radius: 10px;
        }
        
        .tips h4 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .tips ul {
            margin-left: 20px;
            color: #666;
        }
        
        .tips li {
            margin: 5px 0;
        }
        
        .criteria {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        
        .criteria-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .criteria-item.pass {
            background: #d4edda;
            color: #155724;
        }
        
        .criteria-item.fail {
            background: #f8d7da;
            color: #721c24;
        }
        
        @media (max-width: 768px) {
            .criteria {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-btn">← 返回首页</a>
        
        <header>
            <h1>🔐 密码强度检测器</h1>
            <p>检测密码安全性，提供改进建议</p>
        </header>
        
        <main class="tool-content">
            <input type="password" class="input-area" id="password" 
                   placeholder="输入密码进行检测..." oninput="checkStrength()">
            
            <div class="strength-meter">
                <div class="strength-meter-fill" id="strength-meter"></div>
            </div>
            
            <div class="result" id="result">
                <h3>密码强度</h3>
                <div class="result-value" id="strength-text">请输入密码</div>
                <p id="strength-desc">密码强度将在此显示</p>
            </div>
            
            <div class="criteria" id="criteria">
                <div class="criteria-item" id="c-length">
                    <span>📏</span>
                    <span>长度至少8位</span>
                </div>
                <div class="criteria-item" id="c-upper">
                    <span>🔤</span>
                    <span>包含大写字母</span>
                </div>
                <div class="criteria-item" id="c-lower">
                    <span>🔡</span>
                    <span>包含小写字母</span>
                </div>
                <div class="criteria-item" id="c-number">
                    <span>🔢</span>
                    <span>包含数字</span>
                </div>
                <div class="criteria-item" id="c-special">
                    <span>⚡</span>
                    <span>包含特殊字符</span>
                </div>
                <div class="criteria-item" id="c-variety">
                    <span>🎯</span>
                    <span>字符种类丰富</span>
                </div>
            </div>
            
            <div class="tips" id="tips" style="display: none;">
                <h4>💡 密码改进建议</h4>
                <ul id="tips-list"></ul>
            </div>
        </main>
    </div>
    
    <script>
        function checkStrength() {
            const password = document.getElementById('password').value;
            
            if (!password) {
                resetResult();
                return;
            }
            
            // 计算各项标准
            const checks = {
                length: password.length >= 8,
                upper: /[A-Z]/.test(password),
                lower: /[a-z]/.test(password),
                number: /[0-9]/.test(password),
                special: /[^A-Za-z0-9]/.test(password),
                variety: new Set(password.split('')).size >= 6
            };
            
            // 更新检查项显示
            updateCriteria(checks);
            
            // 计算强度分数
            let score = 0;
            if (checks.length) score += 2;
            if (checks.upper) score += 1;
            if (checks.lower) score += 1;
            if (checks.number) score += 1;
            if (checks.special) score += 2;
            if (checks.variety) score += 1;
            
            // 根据分数显示结果
            let strength, desc, className;
            if (score <= 2) {
                strength = '弱';
                desc = '密码很容易被破解，建议加强';
                className = 'strength-weak';
            } else if (score <= 4) {
                strength = '一般';
                desc = '密码强度一般，建议增加复杂度';
                className = 'strength-fair';
            } else if (score <= 5) {
                strength = '良好';
                desc = '密码强度较好，但仍可优化';
                className = 'strength-good';
            } else {
                strength = '强';
                desc = '密码强度很高，安全性好';
                className = 'strength-strong';
            }
            
            const result = document.getElementById('result');
            result.className = 'result ' + className;
            document.getElementById('strength-text').textContent = strength;
            document.getElementById('strength-desc').textContent = desc;
            
            const meter = document.getElementById('strength-meter');
            meter.className = 'strength-meter-fill ' + className;
            
            // 显示改进建议
            showTips(checks);
        }
        
        function updateCriteria(checks) {
            const criteriaMap = {
                length: 'c-length',
                upper: 'c-upper',
                lower: 'c-lower',
                number: 'c-number',
                special: 'c-special',
                variety: 'c-variety'
            };
            
            for (const [key, id] of Object.entries(criteriaMap)) {
                const el = document.getElementById(id);
                if (checks[key]) {
                    el.className = 'criteria-item pass';
                    el.innerHTML = '<span>✅</span><span>' + el.querySelector('span:last-child').textContent + '</span>';
                } else {
                    el.className = 'criteria-item fail';
                    el.innerHTML = '<span>❌</span><span>' + el.querySelector('span:last-child').textContent + '</span>';
                }
            }
        }
        
        function showTips(checks) {
            const tips = [];
            if (!checks.length) tips.push('增加密码长度到至少8位');
            if (!checks.upper) tips.push('添加大写字母（A-Z）');
            if (!checks.lower) tips.push('添加小写字母（a-z）');
            if (!checks.number) tips.push('添加数字（0-9）');
            if (!checks.special) tips.push('添加特殊字符（!@#$%^&*等）');
            if (!checks.variety) tips.push('使用更多不同字符');
            
            const tipsDiv = document.getElementById('tips');
            const tipsList = document.getElementById('tips-list');
            
            if (tips.length > 0) {
                tipsDiv.style.display = 'block';
                tipsList.innerHTML = tips.map(tip => '<li>' + tip + '</li>').join('');
            } else {
                tipsDiv.style.display = 'none';
            }
        }
        
        function resetResult() {
            document.getElementById('result').className = 'result';
            document.getElementById('strength-text').textContent = '请输入密码';
            document.getElementById('strength-desc').textContent = '密码强度将在此显示';
            document.getElementById('strength-meter').className = 'strength-meter-fill';
            document.getElementById('tips').style.display = 'none';
            
            const criteriaItems = document.querySelectorAll('.criteria-item');
            criteriaItems.forEach(item => {
                item.className = 'criteria-item';
                const span = item.querySelector('span:first-child');
                if (span) span.textContent = getIcon(item.textContent.trim());
            });
        }
        
        function getIcon(text) {
            if (text.includes('长度')) return '📏';
            if (text.includes('大写')) return '🔤';
            if (text.includes('小写')) return '🔡';
            if (text.includes('数字')) return '🔢';
            if (text.includes('特殊')) return '⚡';
            if (text.includes('字符种类')) return '🎯';
            return '○';
        }
        
        // 追踪使用
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_usage', {
                'event_category': 'tools',
                'event_label': 'password-strength',
                'value': 1
            });
        }
    </script>
</body>
</html>
