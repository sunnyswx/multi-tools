<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Repeater - Multi Tools</title>
    <meta name="description" content="Repeat text multiple times.">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../lang.js"></script>
    <script>
        // 自动检测浏览器语言
        (function() {
            const browserLang = navigator.language.split('-')[0];
            const supportedLangs = ['en', 'zh', 'ja', 'ko', 'es', 'fr', 'de', 'ru', 'ar'];
            
            // 检查浏览器语言是否在支持列表中
            let lang = 'en'; // 默认英文
            if (supportedLangs.includes(browserLang)) {
                lang = browserLang;
            }
            
            // 保存到 localStorage
            localStorage.setItem('multi-tools-lang', lang);
            
            console.log('[AutoLang] Browser language:', browserLang, '=> Using:', lang);
        })();
    </script>
    <script>
        // 初始化语言
        document.addEventListener('DOMContentLoaded', function() {
            initLanguage();
            debugTranslations();
        });
    </script>
    <style>
        .tool-container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .tool-header { text-align: center; margin-bottom: 30px; }
        .tool-header h1 { color: #333; font-size: 2rem; margin-bottom: 10px; }
        .tool-header p { color: #666; }
        .tool-content { background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        textarea { width: 100%; height: 100px; padding: 15px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; resize: vertical; box-sizing: border-box; }
        textarea:focus { outline: none; border-color: #667eea; }
        input[type="number"] { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        .btn { padding: 12px 30px; border: none; border-radius: 25px; font-size: 16px; cursor: pointer; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; margin-top: 15px; }
        .language-selector { margin-top: 30px; text-align: center; }
        .language-selector select { padding: 10px 20px; font-size: 16px; border: none; border-radius: 25px; background: #667eea; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-btn" data-i18n="common.back_to_home">← Back to Home</a>
        <div class="tool-container">
            <div class="tool-header">
                <h1>🔁 Text Repeater</h1>
                <p>Repeat text multiple times</p>
            </div>
            <div class="tool-content">
                <div class="input-group">
                    <label>Text:</label>
                    <textarea id="inputText" placeholder="Enter text to repeat..."></textarea>
                </div>
                <div class="input-group">
                    <label>Count:</label>
                    <input type="number" id="count" value="5" min="1" max="1000">
                </div>
                <div class="input-group">
                    <label>Separator:</label>
                    <input type="text" id="separator" value="\n" placeholder="\n for newline">
                </div>
                <button class="btn" onclick="repeat()">Repeat</button>
                <textarea id="output" placeholder="Result..." readonly></textarea>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const lang = getLanguage();
            applyLanguage(lang);
        });
        
        function repeat() {
            const text = document.getElementById('inputText').value;
            const count = parseInt(document.getElementById('count').value);
            let sep = document.getElementById('separator').value.replace(/\\n/g, '\n');
            
            if (!text) {
                alert('Please enter text');
                return;
            }
            
            let result = '';
            for (let i = 0; i < count; i++) {
                result += text + sep;
            }
            
            document.getElementById('output').value = result;
        }
        
        if (typeof gtag !== 'undefined') {
            gtag('event', 'tool_open', { tool: 'text-repeater' });
        }
    </script>
</body>
</html>
