        // Get current language
        function getCurrentLang() {
            const params = new URLSearchParams(window.location.search);
            const langParam = params.get('lang');
            if (langParam && translations[langParam]) {
                return langParam;
            }
            return window.multiLanguage.get();
        }
        
        // Change language
        function changeLanguage(lang) {
            window.multiLanguage.set(lang);
            
            // Update URL parameter
            const url = new URL(window.location);
            url.searchParams.set('lang', lang);
            window.history.pushState({}, '', url);
            
            // Re-render tools
            renderTools(toolsData);
            
            // Update header text
            updateHeaderText(lang);
            
            // Track language change
            if (typeof gtag !== 'undefined') {
                gtag('event', 'language_change', { 'language': lang });
            }
        }
        
        // Update header text based on language
        function updateHeaderText(lang) {
            const t = translations[lang] || translations.en;
            document.querySelector('header h1').textContent = t.header_title;
            document.querySelector('header p').textContent = t.header_subtitle;
            document.querySelector('footer p:last-child').textContent = t.footer_text;
            document.getElementById('searchInput').placeholder = t.search_placeholder;
        }
        
        // Render tool cards
        function renderTools(tools) {
            const grid = document.getElementById('toolsGrid');
            const lang = getCurrentLang();
            
            grid.innerHTML = tools.map(tool => {
                const trans = toolTranslations[lang] && toolTranslations[lang][tool.name] 
                    ? toolTranslations[lang][tool.name] 
                    : (toolTranslations['en'] && toolTranslations['en'][tool.name] 
                        ? toolTranslations['en'][tool.name] 
                        : { name: tool.name, desc: '' });
                
                return `
                    <a href="${tool.url}" class="tool-card">
                        <div class="tool-icon">${tool.icon}</div>
                        <div class="tool-name">${trans.name}</div>
                        <div class="tool-desc">${trans.desc}</div>
                    </a>
                `;
            }).join('');
        }
        
        // Search tools
        function searchTools() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const lang = getCurrentLang();
            const filtered = toolsData.filter(tool => {
                const trans = toolTranslations[lang] && toolTranslations[lang][tool.name]
                    ? toolTranslations[lang][tool.name]
                    : (toolTranslations['en'] && toolTranslations['en'][tool.name]
                        ? toolTranslations['en'][tool.name]
                        : { name: tool.name, desc: '' });
                return trans.name.toLowerCase().includes(query) || 
                       trans.desc.toLowerCase().includes(query);
            });
            renderTools(filtered);
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize language system
            window.multiLanguage.init();
            
            // Get language from URL or browser
            const lang = getCurrentLang();
            
            // Set language selector
            document.getElementById('langSelector').value = lang;
            
            // Apply language
            window.multiLanguage.apply(lang);
            
            // Render tools
            renderTools(toolsData);
            
            // Track page view
            if (typeof gtag !== 'undefined') {
                gtag('event', 'page_view', { 'page_title': 'Multi Tools Home', 'page_path': '/' });
            }
        });
