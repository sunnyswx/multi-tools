<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Tools - Free Online Tools Collection</title>
    <meta name="description" content="46+ free online tools for developers, designers, and everyone.">
    <meta name="keywords" content="online tools, free tools, image compressor, json formatter, markdown editor">
    
    <!-- Open Graph -->
    <meta property="og:title" content="Multi Tools - Free Online Tools">
    <meta property="og:description" content="46+ free online tools for developers and designers.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://zh8888.dpdns.org/">
    <meta property="og:locale" content="en_US">
    
    <!-- GA4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L7GQFYBWB6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7GQFYBWB6');
    </script>
    
    <link rel="stylesheet" href="css/style.css">
    <script src="lang.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1 data-i18n="site_title">🛠️ Multi Tools</h1>
            <p data-i18n="site_subtitle">46+ Free Online Tools for Everyone</p>
            
            <!-- Language Selector -->
            <div class="language-selector">
                <select id="langSelect" onchange="changeLanguage(this.value)">
                    <option value="en">English</option>
                    <option value="zh">中文</option>
                    <option value="ja">日本語</option>
                    <option value="ko">한국어</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                    <option value="ru">Русский</option>
                    <option value="ar">العربية</option>
                </select>
            </div>
            
            <!-- Search -->
            <div class="search-box">
                <input type="text" id="searchInput" data-i18n-placeholder="search_placeholder" placeholder="Search tools...">
            </div>
        </header>
        
        <!-- Tools Grid -->
        <main id="toolsGrid">
            <!-- Tools will be loaded here -->
        </main>
        
        <!-- Footer -->
        <footer>
            <p data-i18n="footer_text">Free online tools for developers, designers, and everyone.</p>
        </footer>
    </div>
    
    <script>
        // Tool data
        const toolsData = [
            { id: 'image-compressor', icon: '🖼️', category: 'image', url: 'tools/image-compressor.html' },
            { id: 'image-converter', icon: '🔄', category: 'image', url: 'tools/image-converter.html' },
            { id: 'image-resizer', icon: '📐', category: 'image', url: 'tools/image-resizer.html' },
            { id: 'color-picker', icon: '🎨', category: 'design', url: 'tools/color-picker.html' },
            { id: 'gradient-generator', icon: '🌈', category: 'design', url: 'tools/gradient-generator.html' },
            { id: 'shadow-generator', icon: '💫', category: 'design', url: 'tools/shadow-generator.html' },
            { id: 'box-model', icon: '📦', category: 'design', url: 'tools/box-model.html' },
            { id: 'json-formatter', icon: '📋', category: 'developer', url: 'tools/json-formatter.html' },
            { id: 'json-validator', icon: '✅', category: 'developer', url: 'tools/json-validator.html' },
            { id: 'xml-formatter', icon: '📄', category: 'developer', url: 'tools/xml-formatter.html' },
            { id: 'markdown-editor', icon: '📝', category: 'text', url: 'tools/markdown-editor.html' },
            { id: 'lorem-ipsum', icon: '📃', category: 'text', url: 'tools/lorem-ipsum.html' },
            { id: 'word-counter', icon: '🔢', category: 'text', url: 'tools/word-counter.html' },
            { id: 'text-compressor', icon: '📉', category: 'text', url: 'tools/text-compressor.html' },
            { id: 'base64', icon: '🔐', category: 'developer', url: 'tools/base64.html' },
            { id: 'url-encoder', icon: '🔗', category: 'developer', url: 'tools/url-encoder.html' },
            { id: 'hash-generator', icon: '🔒', category: 'security', url: 'tools/hash-generator.html' },
            { id: 'password-generator', icon: '🔑', category: 'security', url: 'tools/password-generator.html' },
            { id: 'password-strength', icon: '🛡️', category: 'security', url: 'tools/password-strength.html' },
            { id: 'regex-tester', icon: '🔍', category: 'developer', url: 'tools/regex-tester.html' },
            { id: 'cron-generator', icon: '⏰', category: 'developer', url: 'tools/cron-generator.html' },
            { id: 'uuid-generator', icon: '🆔', category: 'developer', url: 'tools/uuid-generator.html' },
            { id: 'qr-generator', icon: '📱', category: 'utility', url: 'tools/qr-generator.html' },
            { id: 'csv-to-json', icon: '📊', category: 'converter', url: 'tools/csv-to-json.html' },
            { id: 'unit-converter', icon: '📏', category: 'converter', url: 'tools/unit-converter.html' },
            { id: 'timezone-converter', icon: '🌍', category: 'converter', url: 'tools/timezone-converter.html' },
            { id: 'time-format', icon: '🕐', category: 'converter', url: 'tools/time-format.html' },
            { id: 'age-calculator', icon: '🎂', category: 'calculator', url: 'tools/age-calculator.html' },
            { id: 'bmi-calculator', icon: '⚖️', category: 'calculator', url: 'tools/bmi-calculator.html' },
            { id: 'mortgage-calculator', icon: '🏠', category: 'calculator', url: 'tools/mortgage-calculator.html' },
            { id: 'percentage-calculator', icon: '💯', category: 'calculator', url: 'tools/percentage-calculator.html' },
            { id: 'online-calculator', icon: '🧮', category: 'calculator', url: 'tools/online-calculator.html' },
            { id: 'color-contrast-checker', icon: '👁️', category: 'design', url: 'tools/color-contrast-checker.html' },
            { id: 'countdown-timer', icon: '⏱️', category: 'utility', url: 'tools/countdown-timer.html' },
            { id: 'pomodoro-timer', icon: '🍅', category: 'utility', url: 'tools/pomodoro-timer.html' },
            { id: 'random-generator', icon: '🎲', category: 'utility', url: 'tools/random-generator.html' },
            { id: 'pdf-converter', icon: '📕', category: 'converter', url: 'tools/pdf-converter.html' },
            { id: 'readability-score', icon: '📖', category: 'text', url: 'tools/readability-score.html' },
            { id: 'seo-analyzer', icon: '🔎', category: 'seo', url: 'tools/seo-analyzer.html' }
        ];
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            initLanguage();
            renderTools();
            setupSearch();
        });
        
        // Render tools
        function renderTools() {
            const grid = document.getElementById('toolsGrid');
            const lang = getLanguage();
            
            grid.innerHTML = toolsData.map(tool => {
                const trans = translations[lang]?.tools?.[tool.id] || translations.en.tools?.[tool.id] || { name: tool.id, desc: '' };
                return `
                    <a href="${tool.url}" class="tool-card">
                        <div class="tool-icon">${tool.icon}</div>
                        <div class="tool-name">${trans.name}</div>
                        <div class="tool-desc">${trans.desc}</div>
                    </a>
                `;
            }).join('');
        }
        
        // Setup search
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', function() {
                const query = this.value.toLowerCase();
                const lang = getLanguage();
                const cards = document.querySelectorAll('.tool-card');
                
                cards.forEach((card, index) => {
                    const tool = toolsData[index];
                    const trans = translations[lang]?.tools?.[tool.id] || translations.en.tools?.[tool.id] || { name: tool.id };
                    const match = trans.name.toLowerCase().includes(query) || trans.desc.toLowerCase().includes(query);
                    card.style.display = match ? 'block' : 'none';
                });
            });
        }
        
        // Change language
        function changeLanguage(lang) {
            localStorage.setItem('multi-tools-lang', lang);
            applyLanguage(lang);
            renderTools();
            trackLanguageChange(lang);
        }
        
        // Track language change
        function trackLanguageChange(lang) {
            if (typeof gtag !== 'undefined') {
                gtag('event', 'language_change', { language: lang });
            }
        }
    </script>
</body>
</html>
