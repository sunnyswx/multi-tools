    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; 
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        
        header { 
            text-align: center; 
            padding: 60px 20px 40px; 
            color: white;
        }
        header h1 { 
            font-size: 3rem; 
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        header p { 
            font-size: 1.3rem; 
            opacity: 0.9;
        }
        
        .search-container { 
            max-width: 600px; 
            margin: 30px auto; 
            position: relative;
        }
        .search-input {
            width: 100%;
            padding: 15px 20px 15px 50px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }
        .search-input:focus {
            outline: none;
            box-shadow: 0 6px 25px rgba(0,0,0,0.3);
        }
        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: #999;
        }
        
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        .tool-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: all 0.3s;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .tool-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .tool-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        .tool-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
        .tool-desc {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.5;
        }
        
        footer {
            text-align: center;
            padding: 40px 20px;
            color: white;
            opacity: 0.8;
        }
        
        @media (max-width: 768px) {
            header h1 { font-size: 2rem; }
            header p { font-size: 1rem; }
            .tools-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛠️ Multi Tools</h1>
            <p>43+ Free Online Tools for Everyone</p>
        </header>
        
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" id="searchInput" placeholder="Search tools..." oninput="searchTools()">
        </div>
        
        <div class="tools-grid" id="toolsGrid">
            <!-- Tools will be generated by JavaScript -->
        </div>
        
        <footer>
            <p>&copy; 2026 Multi Tools. All rights reserved.</p>
            <p style="margin-top: 10px; font-size: 0.9rem;">Free online tools for developers, designers, and everyone.</p>
        </footer>
    </div>
    
    <script>
        const tools = [
            // Image Tools
            { name: "Image Compressor", desc: "Compress images online for free. Reduce file size while maintaining quality.", icon: "🖼️", url: "tools/image-compressor.html" },
            { name: "Image Converter", desc: "Convert images between JPG, PNG, WebP formats online.", icon: "🔄", url: "tools/image-converter.html" },
            { name: "Image Resizer", desc: "Resize images to custom dimensions online.", icon: "📐", url: "tools/image-resizer.html" },
            
            // Text Tools
            { name: "Markdown Editor", desc: "Edit Markdown online with live preview.", icon: "📝", url: "tools/markdown-editor.html" },
            { name: "Lorem Ipsum Generator", desc: "Generate placeholder text for your designs.", icon: "📄", url: "tools/lorem-ipsum.html" },
            { name: "Word Counter", desc: "Count words, characters, and paragraphs in real-time.", icon: "🔢", url: "tools/word-counter.html" },
            { name: "Text Compressor", desc: "Compress text to reduce size using deflate algorithm.", icon: "📦", url: "tools/text-compressor.html" },
            
            // Developer Tools
            { name: "JSON Formatter", desc: "Format, validate and beautify JSON data instantly.", icon: "📋", url: "tools/json-formatter.html" },
            { name: "JSON Validator", desc: "Validate JSON syntax and check for errors.", icon: "✅", url: "tools/json-validator.html" },
            { name: "XML Formatter", desc: "Format and validate XML data online.", icon: "📄", url: "tools/xml-formatter.html" },
            { name: "Base64 Encoder/Decoder", desc: "Encode and decode Base64 strings online.", icon: "🔐", url: "tools/base64.html" },
            { name: "URL Encoder", desc: "Encode and decode URL components online.", icon: "🔗", url: "tools/url-encoder.html" },
            { name: "Regex Tester", desc: "Test regular expressions with real-time matching.", icon: "🔍", url: "tools/regex-tester.html" },
            { name: "Hash Generator", desc: "Generate MD5, SHA-1, SHA-256, SHA-512 hashes.", icon: "🔐", url: "tools/hash-generator.html" },
            { name: "UUID Generator", desc: "Generate unique UUIDs instantly.", icon: "🎲", url: "tools/uuid-generator.html" },
            { name: "Cron Generator", desc: "Generate cron expressions for scheduling.", icon: "⏰", url: "tools/cron-generator.html" },
            
            // Security Tools
            { name: "Password Generator", desc: "Generate strong, secure passwords online.", icon: "🔑", url: "tools/password-generator.html" },
            { name: "Password Strength", desc: "Check password strength and security level.", icon: "💪", url: "tools/password-strength.html" },
            
            // Calculator Tools
            { name: "Age Calculator", desc: "Calculate your exact age from birthdate.", icon: "🎂", url: "tools/age-calculator.html" },
            { name: "BMI Calculator", desc: "Calculate Body Mass Index online.", icon: "⚖️", url: "tools/bmi-calculator.html" },
            { name: "Mortgage Calculator", desc: "Calculate monthly mortgage payments.", icon: "🏠", url: "tools/mortgage-calculator.html" },
            { name: "Percentage Calculator", desc: "Calculate percentages easily online.", icon: "📊", url: "tools/percentage-calculator.html" },
            { name: "Online Calculator", desc: "Basic calculator for everyday math.", icon: "🧮", url: "tools/online-calculator.html" },
            
            // Design Tools
            { name: "Color Picker", desc: "Pick colors and get HEX, RGB, HSL values.", icon: "🎨", url: "tools/color-picker.html" },
            { name: "Gradient Generator", desc: "Create beautiful CSS gradients online.", icon: "🌈", url: "tools/gradient-generator.html" },
            { name: "CSS Box Model", desc: "Visualize and generate CSS box model code.", icon: "📦", url: "tools/box-model.html" },
            { name: "CSS Shadow Generator", desc: "Create box-shadow and text-shadow CSS code.", icon: "🌑", url: "tools/shadow-generator.html" },
            
            // Converter Tools
            { name: "Unit Converter", desc: "Convert between different units of measurement.", icon: "📏", url: "tools/unit-converter.html" },
            { name: "Timezone Converter", desc: "Convert time between different timezones.", icon: "🌍", url: "tools/timezone-converter.html" },
            { name: "Time Format", desc: "Format and convert date/time strings.", icon: "🕐", url: "tools/time-format.html" },
            { name: "CSV to JSON", desc: "Convert CSV data to JSON format instantly.", icon: "📊", url: "tools/csv-to-json.html" },
            
            // Utility Tools
            { name: "QR Code Generator", desc: "Generate QR codes for text, URLs, WiFi.", icon: "📱", url: "tools/qr-generator.html" },
            { name: "PDF Converter", desc: "Convert images to PDF online.", icon: "📄", url: "tools/pdf-converter.html" },
            { name: "Countdown Timer", desc: "Create countdown timers online.", icon: "⏱️", url: "tools/countdown-timer.html" },
            { name: "Random Generator", desc: "Generate random numbers, strings, passwords.", icon: "🎲", url: "tools/random-generator.html" },
            
            // SEO Tools
            { name: "SEO Analyzer", desc: "Analyze basic SEO factors for web pages.", icon: "🔍", url: "tools/seo-analyzer.html" },
            { name: "Readability Score", desc: "Check text readability and comprehension level.", icon: "📖", url: "tools/readability-score.html" }
        ];
        
        function renderTools(toolsToRender) {
            const grid = document.getElementById('toolsGrid');
            grid.innerHTML = toolsToRender.map(tool => `
                <a href="${tool.url}" class="tool-card">
                    <div class="tool-icon">${tool.icon}</div>
                    <div class="tool-name">${tool.name}</div>
                    <div class="tool-desc">${tool.desc}</div>
                </a>
            `).join('');
        }
        
        function searchTools() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = tools.filter(tool => 
                tool.name.toLowerCase().includes(query) || 
                tool.desc.toLowerCase().includes(query)
            );
            renderTools(filtered);
        }
        
        // Initial render
        renderTools(tools);
        
        // Track page view
        if (typeof gtag !== 'undefined') {
            gtag('event', 'page_view', { 'page_title': 'Multi Tools Home', 'page_path': '/' });
        }
    </script>
</body>
